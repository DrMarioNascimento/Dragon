<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada | Dragon Games</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#070605;--coal:#141010;--cream:#f4ead0;--mist:#c9bba3;--gold:#e0b13a;--gold2:#f3d078;--lip:#7a4e0e;--line:rgba(224,177,58,.22)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font:17px/1.6 Inter,system-ui,sans-serif}
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px 16px;background:radial-gradient(60% 50% at 50% 30%,rgba(255,106,24,.12),transparent 70%),var(--bg)}
    main{width:min(560px,100%);text-align:center}
    img{width:min(220px,55vw);height:auto;filter:drop-shadow(0 16px 30px rgba(0,0,0,.6))}
    .eyebrow{margin:18px 0 6px;font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
    h1{margin:0 0 12px;font:800 clamp(1.7rem,6vw,2.4rem)/1.15 Cinzel,Georgia,serif;letter-spacing:.06em;color:var(--gold2)}
    p{margin:0 auto;max-width:30rem;color:var(--mist)}
    .acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:26px}
    a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:10px;font-weight:600;text-decoration:none}
    .ouro{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1206;box-shadow:0 5px 0 var(--lip)}
    .fantasma{border:1.5px solid var(--line);color:var(--gold2)}
    a:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}
  </style>
</head>
<body>
<main>
  <img src="/brand/dragon.webp" alt="Emblema da Dragon Games" width="720" height="857" />
  <p class="eyebrow">Erro 404 · pista perdida</p>
  <h1>Esta porta não leva a lugar nenhum</h1>
  <p>O endereço pode ter mudado ou ter sido digitado com algum detalhe diferente. Se você recebeu um código de partida, volte à página inicial e entre por ali.</p>
  <div class="acoes">
    <a class="btn ouro" href="/">Ir para a Dragon Games</a>
    <a class="btn fantasma" href="/#entrar">Tenho um código</a>
  </div>
</main>
</body>
</html>
