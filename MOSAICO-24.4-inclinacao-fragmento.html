<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fragmento Guiado — Protótipo de Inclinação</title>
<style>
  :root{
    --bg: #0b0f14;
    --panel: #121820;
    --line: #223040;
    --ember: #ff6a3d;
    --ember-dim: #ff6a3d33;
    --cold: #2fb8ff;
    --text: #e8eef4;
    --text-dim: #7d8fa0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  header{
    text-align:center;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  h1{
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 4px;
  }
  #status-line{
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
  }
  #stage{
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
  }
  #fragment-wrap{
    width: min(70vw, 300px);
    aspect-ratio: 1;
    position: relative;
  }
  #fragment-glow{
    position:absolute; inset: -30%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--ember-dim), transparent 70%);
    opacity: 0;
    transition: opacity 0.15s linear;
    filter: blur(4px);
  }
  #fragment{
    position: relative;
    width:100%; height:100%;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--panel);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #fragment svg{
    width: 62%; height: 62%;
    opacity: 0.08;
    transition: opacity 0.15s linear, filter 0.15s linear;
    filter: blur(6px) grayscale(1);
  }
  #fragment.locked svg{
    opacity: 1;
    filter: blur(0) grayscale(0);
  }
  #fragment.locked{
    border-color: var(--ember);
    box-shadow: 0 0 40px 0 var(--ember-dim);
  }
  #ring{
    position:absolute; inset:0;
    border-radius: 18px;
    pointer-events:none;
  }
  #hold-track{
    position: absolute;
    bottom: -22px; left: 10%; right: 10%;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow:hidden;
  }
  #hold-fill{
    height:100%;
    width:0%;
    background: var(--ember);
    transition: width 0.05s linear;
  }
  footer{
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .row{
    display:flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .row b{ color: var(--text); font-weight: 600; }
  #bar-track{
    width:100%; height: 8px;
    background: var(--line);
    border-radius: 4px;
    overflow:hidden;
    margin-bottom: 14px;
  }
  #bar-fill{
    height:100%; width:0%;
    background: linear-gradient(90deg, var(--cold), var(--ember));
    transition: width 0.08s linear;
  }
  #controls{
    display:flex;
    gap: 10px;
  }
  button{
    flex:1;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
  }
  button:active{ background: #1a232e; }
  #enable-btn{
    border-color: var(--ember);
    color: var(--ember);
  }
  #target-info{
    font-size: 11px;
    color: var(--text-dim);
    text-align:center;
    margin-top: 8px;
    letter-spacing: 0.03em;
  }
  #overlay{
    position:fixed; inset:0;
    background: var(--bg);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: 16px;
    padding: 32px;
    text-align:center;
    z-index: 10;
  }
  #overlay p{ color: var(--text-dim); font-size: 14px; max-width: 280px; line-height:1.5; }
  #overlay.hidden{ display:none; }
  body.embed #controls,body.embed #target-info{display:none}
</style>
</head>
<body>
<div id="overlay">
  <h1 style="font-size:16px;color:var(--text)">FRAGMENTO GUIADO</h1>
  <p>Este protótipo usa o giroscópio do celular. Segure o aparelho e toque em "Ativar sensor" para começar. Funciona melhor num iPhone/Android real, não no computador.</p>
  <button id="enable-btn">Ativar sensor</button>
</div>

<div id="app">
  <header>
    <h1>Alvo do Guia</h1>
    <div id="status-line">Aguardando sensor...</div>
  </header>

  <div id="stage">
    <div id="fragment-wrap">
      <div id="fragment-glow"></div>
      <div id="fragment">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="50" cy="50" r="34" style="color:var(--ember)"/>
          <path d="M50 20 L50 80 M20 50 L80 50" style="color:var(--ember)"/>
          <circle cx="50" cy="50" r="8" style="color:var(--cold)" fill="var(--cold)"/>
        </svg>
      </div>
      <div id="hold-track"><div id="hold-fill"></div></div>
    </div>
  </div>

  <footer>
    <div class="row"><span>Distância angular</span><b id="delta-val">--°</b></div>
    <div id="bar-track"><div id="bar-fill"></div></div>
    <div id="controls">
      <button id="new-target-btn">Novo alvo</button>
      <button id="reset-btn">Reiniciar</button>
    </div>
    <div id="target-info">alvo: pitch -- / roll --</div>
  </footer>
</div>

<script>
(function(){
  const TOLERANCE = 15;       // graus — margem considerada "encaixado"
  const HOLD_MS = 2000;       // tempo segurando dentro da tolerância pra revelar
  const MAX_DIST = 90;        // distância angular considerada "totalmente frio"

  const els = {
    overlay: document.getElementById('overlay'),
    enableBtn: document.getElementById('enable-btn'),
    status: document.getElementById('status-line'),
    fragment: document.getElementById('fragment'),
    glow: document.getElementById('fragment-glow'),
    deltaVal: document.getElementById('delta-val'),
    barFill: document.getElementById('bar-fill'),
    holdFill: document.getElementById('hold-fill'),
    newTargetBtn: document.getElementById('new-target-btn'),
    resetBtn: document.getElementById('reset-btn'),
    targetInfo: document.getElementById('target-info'),
  };

  let target = { pitch: 0, roll: 0 };
  let holdStart = null;
  let locked = false;
  let rafPending = false;
  let latestReading = { beta: 0, gamma: 0 };
  const embedded = new URLSearchParams(location.search).get('embed') === '1';
  if (embedded) document.body.classList.add('embed');

  function notifyComplete(){
    if (window.parent !== window){
      window.parent.postMessage({ mosaico:'tarefa-concluida', tarefa:'inclinacao' }, location.origin);
    }
  }

  function randomTarget(){
    // pitch: entre -60 e 80 (evita virar totalmente de cabeça pra baixo/plano demais)
    // roll: entre -70 e 70 (evita a tela ficar de perfil, ilegível)
    const pitch = Math.round(-60 + Math.random() * 140);
    const roll = Math.round(-70 + Math.random() * 140);
    target = { pitch, roll };
    els.targetInfo.textContent = `alvo: pitch ${pitch}° / roll ${roll}°`;
    locked = false;
    holdStart = null;
    els.fragment.classList.remove('locked');
  }

  function angularDistance(a, b){
    let d = Math.abs(a - b) % 360;
    if (d > 180) d = 360 - d;
    return d;
  }

  function handleOrientation(e){
    if (e.beta === null || e.gamma === null) return;
    latestReading.beta = e.beta;
    latestReading.gamma = e.gamma;
    if (!rafPending){
      rafPending = true;
      requestAnimationFrame(updateUI);
    }
  }

  function updateUI(){
    rafPending = false;
    const dPitch = angularDistance(latestReading.beta, target.pitch);
    const dRoll = angularDistance(latestReading.gamma, target.roll);
    const dist = Math.sqrt(dPitch*dPitch + dRoll*dRoll);

    const closeness = Math.max(0, 1 - dist / MAX_DIST); // 0 frio -> 1 quente
    els.deltaVal.textContent = Math.round(dist) + '°';
    els.barFill.style.width = (closeness * 100).toFixed(0) + '%';
    els.glow.style.opacity = (closeness * 0.9).toFixed(2);

    const withinTolerance = dist <= TOLERANCE;

    if (withinTolerance && !locked){
      if (holdStart === null) holdStart = performance.now();
      const elapsed = performance.now() - holdStart;
      const holdPct = Math.min(100, (elapsed / HOLD_MS) * 100);
      els.holdFill.style.width = holdPct + '%';
      if (elapsed >= HOLD_MS){
        locked = true;
        els.fragment.classList.add('locked');
        els.status.textContent = 'Fragmento revelado!';
        notifyComplete();
      } else {
        els.status.textContent = 'Segura firme...';
      }
    } else if (!withinTolerance){
      holdStart = null;
      els.holdFill.style.width = '0%';
      if (!locked){
        els.status.textContent = closeness > 0.6 ? 'Quase lá' : 'Gire o celular';
      }
    }
  }

  function enableSensor(){
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission()
        .then(state => {
          if (state === 'granted'){
            startListening();
          } else {
            els.status.textContent = 'Permissão negada — ative nas configurações do navegador.';
          }
        })
        .catch(() => {
          els.status.textContent = 'Erro ao pedir permissão do sensor.';
        });
    } else if ('DeviceOrientationEvent' in window){
      startListening();
    } else {
      els.status.textContent = 'Sensor não disponível neste dispositivo/navegador.';
    }
  }

  function startListening(){
    window.addEventListener('deviceorientation', handleOrientation);
    els.overlay.classList.add('hidden');
    randomTarget();
  }

  els.enableBtn.addEventListener('click', enableSensor);
  els.newTargetBtn.addEventListener('click', randomTarget);
  els.resetBtn.addEventListener('click', () => {
    locked = false;
    holdStart = null;
    els.fragment.classList.remove('locked');
    els.status.textContent = 'Gire o celular';
  });
})();
</script>
</body>
</html>
