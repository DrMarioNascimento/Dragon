<!DOCTYPE html>

<head>

<title>MOSAICO · Modo Solo · A Casa da Costa</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../v1/css/profundidade-1mais1.css?v=20260930-foco">
<link rel="stylesheet" href="mesa-solo.css?v=20261004-janelas">
<script src="../v1/js/ac-ritmo.js?v=20261004-janelas"></script>
<script src="../v1/js/ac-legenda-giro.js?v=20261004-janelas"></script>

<script src="../papel-camada.js?v=20261004-janelas"></script>
</head>
<body>
<main id="app"></main>
<script type="module" src="../firebase-user.js?v=20260930-alvo-toque"
        data-project="mesa"
        data-experience="casa-da-costa-solo"
        data-storage-keys="mosaico_casa_ultima_partida_solo,mosaico_solo_costa_cloud"></script>
<script>
(function(){
  /* A abertura vem ANTES do jogo carregar, não depois: se carregasse junto, a
     primeira tela do Solo apareceria por baixo dela e o jogador já teria lido
     a pergunta quando a casa começasse a falar. Se o arquivo da abertura não
     chegar, `onerror` segue direto — o Solo nunca fica preso esperando. */
  function iniciar(){
    if(window.__mosaicoSoloIniciado)return;
    window.__mosaicoSoloIniciado=true;
    var ab=document.createElement('script');
    ab.src='../abertura-casa.js?v=20260917-video-so';
    ab.onload=function(){window.MosaicoAberturaCasa.mostrar(carregarJogo)};
    ab.onerror=function(){console.error('MOSAICO: abertura não carregou.');carregarJogo()};
    document.head.appendChild(ab);
  }
  function carregarJogo(){
    /* 11/10/2026: as variações da solução (o mesmo arquivo da Mesa) carregam antes do jogo */
    var vari=document.createElement('script');vari.async=false;vari.src='../v1/js/variacoes-casa.js?v=20261011-t4';document.head.appendChild(vari);
    var jogo=document.createElement('script');jogo.async=false;
    jogo.src='mesa-solo.js?v=20261011-t4';
    jogo.onload=function(){
      var ponte=document.createElement('script');
      ponte.src='estado-solo.js?v=20261011-t4';
      document.body.appendChild(ponte);
      /* 11/10/2026: o aprendizado da tela, o mesmo da Mesa, com os passos do Solo */
      var ap=document.createElement('script');
      ap.src='../v1/js/aprendizado-casa.js?v=20261011-pele2';
      document.body.appendChild(ap);
    };
    document.body.appendChild(jogo);
  }
  window.addEventListener('mosaico-cloud-ready',iniciar,{once:true});
})();
</script>
</body>
</html>
