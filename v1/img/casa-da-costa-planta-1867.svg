<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ead8b0"/><stop offset=".52" stop-color="#d9bf8b"/><stop offset="1" stop-color="#c7a66d"/></linearGradient>
  <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07111d" stop-opacity=".14"/><stop offset="1" stop-color="#020508" stop-opacity=".78"/></linearGradient>
  <filter id="stamp"><feColorMatrix type="matrix" values="0 0 0 0 .48 0 0 0 0 .08 0 0 0 0 .06 0 0 0 .82 0"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".35"/></filter>
  <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1" fill="#5a4126" opacity=".08"/><circle cx="25" cy="18" r=".8" fill="#fff" opacity=".12"/><path d="M0 31L36 27" stroke="#6f5535" opacity=".035"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#paper)"/><rect width="1600" height="1000" fill="url(#grain)"/>
<rect x="18" y="18" width="1564" height="964" rx="8" fill="none" stroke="#5b3d19" stroke-width="4"/><rect x="30" y="30" width="1540" height="940" rx="5" fill="none" stroke="#8a6735" stroke-width="1.5"/>
<!-- fachada: reaproveita a imagem canônica já publicada da Casa da Costa -->
<g filter="url(#shadow)"><rect x="55" y="58" width="755" height="365" rx="7" fill="#07111a"/><image href="fundo-painel.jpg" x="55" y="58" width="755" height="365" preserveAspectRatio="xMidYMid slice"/><rect x="55" y="58" width="755" height="365" rx="7" fill="url(#night)"/><rect x="55" y="58" width="755" height="365" rx="7" fill="none" stroke="#7b572a" stroke-width="5"/></g>
<g font-family="Georgia,serif" fill="#2e2115"><text x="855" y="112" font-size="58" letter-spacing="4">CASA DA COSTA</text><text x="858" y="157" font-size="25" font-weight="700">CONSTRUÇÃO: <tspan fill="#8a231e">1867</tspan></text><path d="M858 177H1480" stroke="#7b572a"/><text x="858" y="216" font-size="20">Residência da família Costa, erguida sobre o penhasco.</text><text x="858" y="247" font-size="20">Dois volumes altos flanqueiam um corpo central mais baixo;</text><text x="858" y="278" font-size="20">o mar e a tempestade cercam a casa por quase todos os lados.</text><text x="858" y="334" font-size="17" font-style="italic">Planta esquemática do inventário · não destinada a obras.</text></g>
<!-- selo Dragon Games -->
<g transform="translate(1320 332) rotate(-7)" opacity=".9"><circle r="78" fill="none" stroke="#8a231e" stroke-width="5"/><circle r="68" fill="none" stroke="#8a231e" stroke-width="2" stroke-dasharray="4 4"/><image href="icone-192.png" x="-34" y="-35" width="68" height="68" filter="url(#stamp)"/><text x="0" y="-50" text-anchor="middle" fill="#8a231e" font-family="Georgia,serif" font-size="13" font-weight="700">ARQUIVO DO DRAGON GAMES</text><text x="0" y="58" text-anchor="middle" fill="#8a231e" font-family="Georgia,serif" font-size="24" font-weight="700">1867</text></g>
<!-- Térreo -->
<g transform="translate(58 482)" font-family="Georgia,serif"><text x="330" y="-18" text-anchor="middle" font-size="24" font-weight="700" fill="#3c2c1c">TÉRREO</text><g fill="#ead7ad" stroke="#523b22" stroke-width="5"><rect x="0" y="0" width="660" height="375"/><rect x="250" y="120" width="170" height="135" fill="#c6ad79"/><rect x="420" y="0" width="240" height="150"/><rect x="420" y="150" width="240" height="225"/></g><g stroke="#7f6238" stroke-width="2"><path d="M215 0V375M0 178H250M420 150H660M420 285H660M250 0V120M420 255H250"/></g><g fill="#2e2115" font-size="18" text-anchor="middle"><text x="108" y="88">SALA DE JANTAR</text><text x="108" y="270">SALA DE ESTAR</text><text x="330" y="70">HALL</text><text x="330" y="188">ESCADA</text><text x="535" y="76">COZINHA</text><text x="535" y="217">DESPENSA</text><text x="535" y="332">CORREDOR</text></g><rect x="245" y="375" width="190" height="58" fill="#d0b784" stroke="#523b22" stroke-width="4"/><text x="340" y="410" text-anchor="middle" font-size="17" fill="#2e2115">VARANDA / PORTÃO</text><circle cx="535" cy="76" r="15" fill="none" stroke="#9a6b16" stroke-width="5"/><path d="M517 319l32 32m0-32l-32 32" stroke="#8e231f" stroke-width="7"/></g>
<!-- Primeiro andar -->
<g transform="translate(788 482)" font-family="Georgia,serif"><text x="265" y="-18" text-anchor="middle" font-size="24" font-weight="700" fill="#3c2c1c">1º ANDAR</text><g fill="#ead7ad" stroke="#523b22" stroke-width="5"><rect x="0" y="0" width="530" height="375"/><rect x="185" y="105" width="160" height="165" fill="#c6ad79"/></g><g stroke="#7f6238" stroke-width="2"><path d="M185 0V375M345 0V375M0 188H185M345 188H530"/></g><g fill="#2e2115" font-size="18" text-anchor="middle"><text x="92" y="95">QUARTO OESTE</text><text x="92" y="285">QUARTO SUL</text><text x="265" y="82">SACADA INTERNA</text><text x="265" y="194">CORREDOR</text><text x="437" y="95">QUARTO NORTE</text><text x="437" y="285">QUARTO LESTE</text></g><path d="M244 296l32 32m0-32l-32 32" stroke="#8e231f" stroke-width="7"/><path d="M60 60a15 15 0 1 0 1 0" fill="none" stroke="#9a6b16" stroke-width="5"/></g>
<!-- Sótão/quarto serviço -->
<g transform="translate(1350 505)" font-family="Georgia,serif"><text x="95" y="-18" text-anchor="middle" font-size="21" font-weight="700" fill="#3c2c1c">SÓTÃO</text><rect x="0" y="0" width="190" height="180" fill="#baa06f" stroke="#523b22" stroke-width="5"/><text x="95" y="95" text-anchor="middle" font-size="19" fill="#2e2115">VÃO DO SÓTÃO</text><path d="M76 36l32 32m0-32L76 68" stroke="#8e231f" stroke-width="7"/><text x="95" y="227" text-anchor="middle" font-size="18" font-weight="700" fill="#3c2c1c">QUARTO DE SERVIÇO</text><rect x="28" y="248" width="134" height="126" fill="#ead7ad" stroke="#523b22" stroke-width="5"/><text x="95" y="302" text-anchor="middle" font-size="15" fill="#2e2115">ATRÁS DO</text><text x="95" y="324" text-anchor="middle" font-size="15" fill="#2e2115">JARDIM INTERNO</text><circle cx="95" cy="345" r="14" fill="none" stroke="#476d3f" stroke-width="5"/></g>
<!-- caminho inferido -->
<path d="M1450 570 C1360 600 1240 630 1125 650 S925 716 710 730 S565 785 590 830" fill="none" stroke="#6b405f" stroke-width="5" stroke-dasharray="11 9" opacity=".86"/><path d="M585 824l6 20 16-14" fill="none" stroke="#6b405f" stroke-width="5"/>
<!-- legenda -->
<g transform="translate(810 892)" font-family="Arial,sans-serif" font-size="15" fill="#322316"><circle cx="0" cy="0" r="10" fill="none" stroke="#476d3f" stroke-width="4"/><text x="18" y="5">cômodo visitado</text><path d="M190 -10l20 20m0-20l-20 20" stroke="#8e231f" stroke-width="5"/><text x="220" y="5">sinal ainda não explicado</text><line x1="460" x2="510" y1="0" y2="0" stroke="#6b405f" stroke-width="4" stroke-dasharray="8 6"/><text x="520" y="5">trajeto inferido</text></g>
<text x="70" y="940" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#4f3821">A manhã conta entradas. A noite da tempestade obriga a contar presenças.</text>
</svg>