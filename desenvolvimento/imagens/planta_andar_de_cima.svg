<svg xmlns="http://www.w3.org/2000/svg" width="840" height="970" viewBox="0 0 840 970" font-family="Georgia,serif">
<rect width="100%" height="100%" fill="#f6efdc"/>
<text x="20" y="28" font-size="22" fill="#3a2a18">Casa da Costa · PROPOSTA de planta do andar de cima</text>
<rect x="308" y="194" width="280" height="378" fill="#d9e6d0" stroke="#3a2a18" stroke-width="2" stroke-dasharray="6 4" opacity="1"/><text x="448" y="387" font-size="13" fill="#3a2a18" text-anchor="middle" font-style="italic">vazio sobre o pátio</text><text x="448" y="402" font-size="13" fill="#3a2a18" text-anchor="middle" font-style="italic">(céu aberto)</text><rect x="84" y="194" width="42" height="420" fill="#efe3c6" stroke="#3a2a18" stroke-width="2" opacity="1"/><text x="105" y="362" font-size="11" fill="#3a2a18" text-anchor="middle">C</text><text x="105" y="375" font-size="11" fill="#3a2a18" text-anchor="middle">O</text><text x="105" y="388" font-size="11" fill="#3a2a18" text-anchor="middle">R</text><text x="105" y="401" font-size="11" fill="#3a2a18" text-anchor="middle">R</text><text x="105" y="414" font-size="11" fill="#3a2a18" text-anchor="middle">E</text><text x="105" y="427" font-size="11" fill="#3a2a18" text-anchor="middle">D</text><text x="105" y="440" font-size="11" fill="#3a2a18" text-anchor="middle">O</text><text x="105" y="453" font-size="11" fill="#3a2a18" text-anchor="middle">R</text><rect x="126" y="194" width="182" height="210" fill="#fffaf0" stroke="#3a2a18" stroke-width="2" opacity="1"/><text x="216" y="277" font-size="11" fill="#3a2a18" text-anchor="middle" font-weight="700">QUARTO NORTE</text><text x="216" y="290" font-size="11" fill="#3a2a18" text-anchor="middle" font-weight="700">"o quarto de cima"</text><text x="216" y="303" font-size="11" fill="#3a2a18" text-anchor="middle" font-weight="700">do proprietário (sem uso desde março)</text><rect x="126" y="404" width="182" height="168" fill="#fffaf0" stroke="#3a2a18" stroke-width="2" opacity="1"/><text x="216" y="492" font-size="12" fill="#3a2a18" text-anchor="middle" font-weight="700">QUARTO OESTE</text><rect x="84" y="614" width="224" height="154" fill="#fffaf0" stroke="#3a2a18" stroke-width="2" opacity="1"/><text x="196" y="694" font-size="12" fill="#3a2a18" text-anchor="middle" font-weight="700">QUARTO SUL</text><rect x="84" y="572" width="504" height="42" fill="#efe3c6" stroke="#3a2a18" stroke-width="2" opacity="1"/><text x="448" y="596" font-size="10" fill="#3a2a18" text-anchor="middle">galeria de cima</text><rect x="308" y="614" width="112" height="238" fill="#e8dcc0" stroke="#3a2a18" stroke-width="2" opacity="1"/><text x="364" y="717" font-size="10" fill="#3a2a18" text-anchor="middle" font-weight="700">SALA DA TORRE</text><text x="364" y="729" font-size="10" fill="#3a2a18" text-anchor="middle" font-weight="700">telefone vermelho</text><text x="364" y="741" font-size="10" fill="#3a2a18" text-anchor="middle" font-weight="700">mesa de mapas</text><rect x="420" y="614" width="168" height="154" fill="#fffaf0" stroke="#3a2a18" stroke-width="2" opacity="1"/><text x="504" y="694" font-size="12" fill="#3a2a18" text-anchor="middle" font-weight="700">QUARTO LESTE</text><rect x="588" y="516" width="168" height="252" fill="#fffaf0" stroke="#3a2a18" stroke-width="2" opacity="1"/><text x="672" y="639" font-size="11" fill="#3a2a18" text-anchor="middle">banheiro e</text><text x="672" y="652" font-size="11" fill="#3a2a18" text-anchor="middle">quarto de hóspedes</text><rect x="308" y="82" width="448" height="112" fill="#ddd" stroke="#3a2a18" stroke-width="2" stroke-dasharray="4 4" opacity="1"/><text x="532" y="142" font-size="11" fill="#3a2a18" text-anchor="middle" font-style="italic">ala norte: só telhado baixo (sótão sem uso)</text><rect x="588" y="194" width="168" height="322" fill="#ddd" stroke="#3a2a18" stroke-width="2" stroke-dasharray="4 4" opacity="1"/><text x="672" y="339" font-size="11" fill="#3a2a18" text-anchor="middle" font-style="italic">ala leste:</text><text x="672" y="352" font-size="11" fill="#3a2a18" text-anchor="middle" font-style="italic">só telhado</text><text x="672" y="365" font-size="11" fill="#3a2a18" text-anchor="middle" font-style="italic">baixo</text><text x="364" y="872" font-size="10" fill="#3a2a18" text-anchor="middle" font-style="italic">topo da torre: mirante com grade (decorativo, sem acesso)</text>
<text x="20" y="940" font-size="13" fill="#6b5234">Só as alas oeste e sul (e a torre) têm andar de cima. As alas norte e leste são térreas (o farol vê o pátio do alto).</text>
<g transform="translate(770,80)"><path d="M0 30 L10 0 L20 30 L10 22Z" fill="#3a2a18"/><text x="4" y="48" font-size="14">N</text></g>
<g transform="translate(20,952)"><rect width="140" height="5" fill="#3a2a18"/><text x="146" y="6" font-size="12">5 m</text></g>
</svg>