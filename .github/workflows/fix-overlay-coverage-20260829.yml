name: Completar cobertura de overlays 2026-08-29

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-overlay-coverage-20260829.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mosaico-web/package-lock.json

      - name: Instalar dependencias
        working-directory: mosaico-web
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Ampliar sincronizacao de overlays
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='var ids=["intro","pistas","cartao","carta","master","mestre","card"];'
          new='var ids=["intro","oito","pistas","cartao","carta","card","final","descanso","falha","master","mestre"];'
          files=[
            Path('mosaico-web/public/modulos/vidro-embacado.html'),
            Path('mosaico-web/public/modulos/janela-do-norte.html'),
            Path('mosaico-web/public/modulos/sala-as-escuras.html'),
          ]
          for p in files:
            s=p.read_text(encoding='utf-8')
            if old not in s:
              raise SystemExit(f'padrao ausente em {p}')
            p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Typecheck
        working-directory: mosaico-web
        run: npm run typecheck

      - name: Build Pages
        working-directory: mosaico-web
        run: npm run build:pages

      - name: Atualizar v2
        shell: bash
        run: |
          rm -rf v2/assets v2/modulos v2/media v2/audio v2/icons
          cp -a mosaico-web/dist/client/. v2/
          cp v2/_shell.html v2/index.html
          cp v2/_shell.html v2/404.html
          touch v2/.nojekyll
          grep -q '"oito"' v2/modulos/janela-do-norte.html
          grep -q '"falha"' v2/modulos/vidro-embacado.html
          grep -q '"final"' v2/modulos/vidro-embacado.html

      - name: Publicar e remover executor
        shell: bash
        run: |
          rm .github/workflows/fix-overlay-coverage-20260829.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Completa sincronizacao de overlays internos'
          git push origin main
