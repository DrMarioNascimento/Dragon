name: Corrigir camadas e sobreposicoes 2026-08-29

on:
  push:
    branches: [main]
    paths:
      - 'mosaico-web/scripts/apply-20260829-layer-fixes.mjs'
      - '.github/workflows/fix-ui-layering-20260829.yml'

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mosaico-web/package-lock.json

      - name: Instalar dependencias
        working-directory: mosaico-web
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Aplicar correcoes visuais
        working-directory: mosaico-web
        run: node scripts/apply-20260829-layer-fixes.mjs

      - name: Typecheck
        working-directory: mosaico-web
        run: npm run typecheck

      - name: Suite completa - diagnostico
        continue-on-error: true
        working-directory: mosaico-web
        run: npm test

      - name: Suite executavel
        working-directory: mosaico-web
        shell: bash
        run: |
          find scripts -name '*.test.mjs' ! -name 'brand-check.test.mjs' -print0 | xargs -0 node --test

      - name: Lint - diagnostico
        continue-on-error: true
        working-directory: mosaico-web
        run: npm run lint

      - name: Build GitHub Pages
        working-directory: mosaico-web
        run: npm run build:pages

      - name: Atualizar v2 publicado
        shell: bash
        run: |
          rm -rf v2/assets v2/modulos v2/media v2/audio v2/icons
          cp -a mosaico-web/dist/client/. v2/
          cp v2/_shell.html v2/index.html
          cp v2/_shell.html v2/404.html
          touch v2/.nojekyll

      - name: Verificar build publicado
        shell: bash
        run: |
          test -f v2/index.html
          test -f v2/modulos/vidro-embacado.html
          test -f v2/modulos/janela-do-norte.html
          test -f v2/modulos/sala-as-escuras.html
          grep -q 'mosaico-embed-layer-sync' v2/modulos/vidro-embacado.html
          grep -q 'mosaico-embed-layer-sync' v2/modulos/janela-do-norte.html
          grep -q 'mosaico-embed-layer-sync' v2/modulos/sala-as-escuras.html
          grep -q 'html.mosaico-embed #hud' v2/modulos/vidro-embacado.html
          grep -q 'html.mosaico-embed #hud' v2/modulos/janela-do-norte.html
          grep -q 'html.mosaico-embed #hud' v2/modulos/sala-as-escuras.html
          ! grep -q 'h-\[calc(100dvh-56px)\]' mosaico-web/src/components/game/shell.tsx
          ! grep -q 'absolute inset-x-0 bottom-0 z-30 bg-gradient-to-t' mosaico-web/src/components/game/carta-puzzle.tsx

      - name: Remover executor temporario e publicar
        shell: bash
        run: |
          rm -f mosaico-web/scripts/apply-20260829-layer-fixes.mjs
          rm -f .github/workflows/fix-ui-layering-20260829.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao para publicar.'
            exit 0
          fi
          git commit -m 'Corrige hierarquia visual, overlays e safe areas'
          git push origin main
