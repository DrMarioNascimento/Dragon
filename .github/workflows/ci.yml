name: Verificação

# O MOSAICO continua sendo HTML estático publicado pelo GitHub Pages: isto
# não constrói nada, apenas confere o que antes era conferido à mão.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  motor-e-caso:
    name: Motor de pontuação e sincronia do caso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Motor V5 e caso canônico
        run: npm test

  regras:
    name: Regras do Firestore no emulador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"   # o emulador do Firestore roda em Java
      - run: npm install --no-audit --no-fund
      - name: Matriz de segurança
        run: npm run test:regras
