name: Verificação

# O MOSAICO continua sendo HTML estático publicado pelo GitHub Pages: isto
# não constrói nada, apenas confere o que antes era conferido à mão.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  motor-e-caso:
    name: Motor de pontuação e sincronia do caso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Motor V5 e caso canônico
        run: npm test

  regras:
    name: Regras do Firestore no emulador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"   # o emulador do Firestore roda em Java
      - run: npm install --no-audit --no-fund
      - name: Matriz de segurança
        run: npm run test:regras

  noite:
    name: A noite (v2) — tipos e regras de jogo
    runs-on: ubuntu-latest
    # A v2 é a que está publicada e era a única sem verificação nenhuma no
    # push: typecheck, lint e testes existiam e ninguém os rodava. Foi assim
    # que uma fase inteira chegou ao ar sem imagem.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # o node --test lê TypeScript direto
      - name: Dependências da noite
        working-directory: mosaico-web
        run: npm install --no-audit --no-fund
      - name: Tipos
        working-directory: mosaico-web
        run: npm run typecheck
      - name: Máquina de fases e infraestrutura
        working-directory: mosaico-web
        run: npm test
