<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fragmento Guiado — v2</title>
<style>
  :root{
    --bg: #0b0f14;
    --panel: #121820;
    --line: #223040;
    --ember: #ff6a3d;
    --ember-dim: #ff6a3d55;
    --cold: #ff3b3b;
    --mid: #ffb020;
    --hot: #2ee67a;
    --text: #e8eef4;
    --text-dim: #7d8fa0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  header{
    text-align:center;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  h1{
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 6px;
  }
  #status-line{
    font-size: 15px;
    color: var(--text);
    min-height: 22px;
    font-weight: 500;
  }
  #stage{
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
  }
  #fragment-wrap{
    width: min(70vw, 300px);
    aspect-ratio: 1;
    position: relative;
  }
  #fragment-glow{
    position:absolute; inset: -32%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--ember-dim), transparent 70%);
    opacity: 0;
    transition: opacity 0.12s linear;
    filter: blur(6px);
    pointer-events: none;
  }
  #fragment{
    position: relative;
    width:100%; height:100%;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--panel);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  #fragment svg{
    width: 64%; height: 64%;
    opacity: 0.07;
    transition: opacity 0.2s linear, filter 0.2s linear;
    filter: blur(8px) grayscale(1);
  }
  #fragment.hot svg{
    opacity: 0.45;
    filter: blur(3px) grayscale(0.4);
  }
  #fragment.locked svg{
    opacity: 1;
    filter: blur(0) grayscale(0);
  }
  #fragment.locked{
    border-color: var(--ember);
    box-shadow: 0 0 50px 0 var(--ember-dim);
  }
  #hold-track{
    position: absolute;
    bottom: -26px; left: 12%; right: 12%;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow:hidden;
  }
  #hold-fill{
    height:100%;
    width:0%;
    background: var(--ember);
    transition: width 0.05s linear;
  }
  footer{
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  #bar-label{
    display:flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  #bar-track{
    width:100%;
    height: 14px;
    background: var(--line);
    border-radius: 7px;
    overflow:hidden;
    margin-bottom: 16px;
  }
  #bar-fill{
    height:100%;
    width:0%;
    border-radius: 7px;
    background: var(--cold);
    transition: width 0.1s linear, background-color 0.15s linear;
  }
  #controls{
    display:flex;
    gap: 10px;
  }
  button{
    flex:1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
  }
  button:active{ background: #1a232e; }
  #enable-btn{
    border-color: var(--ember);
    color: var(--ember);
  }
  #target-info{
    font-size: 11px;
    color: var(--text-dim);
    text-align:center;
    margin-top: 10px;
    letter-spacing: 0.03em;
  }
  #overlay{
    position:fixed; inset:0;
    background: var(--bg);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: 18px;
    padding: 32px;
    text-align:center;
    z-index: 10;
  }
  #overlay p{
    color: var(--text-dim);
    font-size: 15px;
    max-width: 280px;
    line-height:1.5;
    margin:0;
  }
  #overlay.hidden{ display:none; }
</style>
</head>
<body>
<div id="overlay">
  <h1 style="font-size:16px;color:var(--text);letter-spacing:0.08em;">FRAGMENTO</h1>
  <p>Incline o celular até o fragmento aparecer.<br>É sobre a procura, não sobre precisão.</p>
  <button id="enable-btn">Começar</button>
</div>

<div id="app">
  <header>
    <h1>Procura</h1>
    <div id="status-line">Incline o celular</div>
  </header>

  <div id="stage">
    <div id="fragment-wrap">
      <div id="fragment-glow"></div>
      <div id="fragment">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="50" cy="50" r="34" style="color:var(--ember)"/>
          <path d="M50 18 L50 82 M18 50 L82 50" style="color:var(--ember)"/>
          <circle cx="50" cy="50" r="9" style="color:var(--hot)" fill="var(--hot)"/>
        </svg>
      </div>
      <div id="hold-track"><div id="hold-fill"></div></div>
    </div>
  </div>

  <footer>
    <div id="bar-label">
      <span>Longe</span>
      <span>Perto</span>
    </div>
    <div id="bar-track"><div id="bar-fill"></div></div>
    <div id="controls">
      <button id="new-target-btn">Novo alvo</button>
      <button id="reset-btn">Reiniciar</button>
    </div>
    <div id="target-info">alvo oculto</div>
  </footer>
</div>

<script>
(function(){
  const TOLERANCE = 24;
  const HOLD_MS   = 1800;
  const MAX_DIST  = 95;
  const SMOOTH    = 0.2;

  const els = {
    overlay: document.getElementById('overlay'),
    enableBtn: document.getElementById('enable-btn'),
    status: document.getElementById('status-line'),
    fragment: document.getElementById('fragment'),
    glow: document.getElementById('fragment-glow'),
    barFill: document.getElementById('bar-fill'),
    holdFill: document.getElementById('hold-fill'),
    newTargetBtn: document.getElementById('new-target-btn'),
    resetBtn: document.getElementById('reset-btn'),
    targetInfo: document.getElementById('target-info'),
  };

  let target = { pitch: 0, roll: 0 };
  let holdStart = null;
  let locked = false;
  let wasInZone = false;
  let rafPending = false;
  let smoothPitch = 0;
  let smoothRoll  = 0;
  let hasReading  = false;

  function vibrate(ms){
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
  }

  function randomTarget(){
    target.pitch = Math.round(-50 + Math.random() * 110);
    target.roll  = Math.round(-55 + Math.random() * 110);
    locked = false;
    holdStart = null;
    wasInZone = false;
    els.fragment.classList.remove('locked', 'hot');
    els.holdFill.style.width = '0%';
    els.status.textContent = 'Incline o celular';
    els.targetInfo.textContent = 'alvo oculto';
  }

  function angularDistance(a, b){
    let d = Math.abs(a - b) % 360;
    if (d > 180) d = 360 - d;
    return d;
  }

  function handleOrientation(e){
    if (e.beta == null || e.gamma == null) return;

    const rawPitch = e.beta;
    const rawRoll  = e.gamma;

    if (!hasReading){
      smoothPitch = rawPitch;
      smoothRoll  = rawRoll;
      hasReading  = true;
    } else {
      smoothPitch += (rawPitch - smoothPitch) * SMOOTH;
      smoothRoll  += (rawRoll  - smoothRoll)  * SMOOTH;
    }

    if (!rafPending){
      rafPending = true;
      requestAnimationFrame(updateUI);
    }
  }

  function updateUI(){
    rafPending = false;
    if (locked) return;

    const dPitch = angularDistance(smoothPitch, target.pitch);
    const dRoll  = angularDistance(smoothRoll,  target.roll);
    const dist   = Math.sqrt(dPitch*dPitch + dRoll*dRoll);
    const closeness = Math.max(0, 1 - dist / MAX_DIST);

    els.barFill.style.width = (closeness * 100).toFixed(0) + '%';
    if (closeness < 0.35) {
      els.barFill.style.background = 'var(--cold)';
    } else if (closeness < 0.7) {
      els.barFill.style.background = 'var(--mid)';
    } else {
      els.barFill.style.background = 'var(--hot)';
    }

    els.glow.style.opacity = (closeness * 0.95).toFixed(2);
    if (closeness > 0.5) els.fragment.classList.add('hot');
    else els.fragment.classList.remove('hot');

    const within = dist <= TOLERANCE;

    if (within){
      if (!wasInZone){
        wasInZone = true;
        vibrate(40);
        els.status.textContent = 'Quase! Segure firme...';
      }
      if (holdStart === null) holdStart = performance.now();
      const elapsed = performance.now() - holdStart;
      const holdPct = Math.min(100, (elapsed / HOLD_MS) * 100);
      els.holdFill.style.width = holdPct + '%';

      if (elapsed >= HOLD_MS){
        locked = true;
        els.fragment.classList.add('locked');
        els.status.textContent = 'Fragmento revelado!';
        vibrate([50, 40, 80]);
      }
    } else {
      if (wasInZone){
        wasInZone = false;
        els.status.textContent = 'Continue inclinando...';
      }
      holdStart = null;
      els.holdFill.style.width = '0%';
      if (!locked){
        if (closeness > 0.65) els.status.textContent = 'Está quente...';
        else if (closeness > 0.35) els.status.textContent = 'Esquentando';
        else els.status.textContent = 'Incline o celular';
      }
    }
  }

  function enableSensor(){
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission()
        .then(state => {
          if (state === 'granted') startListening();
          else els.status.textContent = 'Permissão negada';
        })
        .catch(() => els.status.textContent = 'Erro de permissão');
    } else if ('DeviceOrientationEvent' in window){
      startListening();
    } else {
      els.status.textContent = 'Sensor não disponível';
    }
  }

  function startListening(){
    window.addEventListener('deviceorientation', handleOrientation);
    els.overlay.classList.add('hidden');
    randomTarget();
  }

  els.enableBtn.addEventListener('click', enableSensor);
  els.newTargetBtn.addEventListener('click', randomTarget);
  els.resetBtn.addEventListener('click', () => {
    locked = false;
    holdStart = null;
    wasInZone = false;
    els.fragment.classList.remove('locked', 'hot');
    els.holdFill.style.width = '0%';
    els.status.textContent = 'Incline o celular';
  });
})();
</script>
</body>
</html>
