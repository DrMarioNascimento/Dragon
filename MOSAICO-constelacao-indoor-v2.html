<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Constelação Indoor — v2</title>
<style>
  :root{
    --bg: #05070c;
    --panel: #0d1420;
    --line: #1c2836;
    --star: #ffd98a;
    --star-dim: #ffd98a44;
    --cold: #ff3b3b;
    --mid: #ffb020;
    --hot: #2ee67a;
    --text: #e8eef4;
    --text-dim: #7d8fa0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  header{
    text-align:center;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  h1{
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 6px;
  }
  #status-line{
    font-size: 15px;
    color: var(--text);
    min-height: 22px;
    font-weight: 500;
  }
  #stage{
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
  }
  #sky-wrap{
    width: min(78vw, 340px);
    aspect-ratio: 1;
    position: relative;
  }
  #sky-glow{
    position:absolute; inset: -30%;
    border-radius: 50%;
    background: radial-gradient(circle, var(--star-dim), transparent 70%);
    opacity: 0;
    transition: opacity 0.12s linear;
    filter: blur(6px);
    pointer-events: none;
  }
  #sky{
    position: relative;
    width:100%; height:100%;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    overflow:hidden;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  #sky svg{ width:100%; height:100%; }
  .star-dot{
    fill: var(--star);
    opacity: 0.12;
    transition: opacity 0.2s linear, r 0.2s linear;
  }
  .star-line{
    stroke: var(--star);
    stroke-width: 1.4;
    opacity: 0;
    transition: opacity 0.3s linear;
  }
  #sky.hot .star-dot{ opacity: 0.55; }
  #sky.locked .star-dot{ opacity: 1; }
  #sky.locked .star-line{ opacity: 0.9; }
  #sky.locked{
    border-color: var(--star);
    box-shadow: 0 0 60px 0 var(--star-dim);
  }
  #hold-track{
    position: absolute;
    bottom: -26px; left: 12%; right: 12%;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow:hidden;
  }
  #hold-fill{
    height:100%;
    width:0%;
    background: var(--star);
    transition: width 0.05s linear;
  }
  footer{
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  #bar-label{
    display:flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  #bar-track{
    width:100%;
    height: 14px;
    background: var(--line);
    border-radius: 7px;
    overflow:hidden;
    margin-bottom: 16px;
  }
  #bar-fill{
    height:100%;
    width:0%;
    border-radius: 7px;
    background: var(--cold);
    transition: width 0.1s linear, background-color 0.15s linear;
  }
  #controls{
    display:flex;
    gap: 10px;
  }
  button{
    flex:1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
  }
  button:active{ background: #16202c; }
  #enable-btn{
    border-color: var(--star);
    color: var(--star);
  }
  #target-info{
    font-size: 11px;
    color: var(--text-dim);
    text-align:center;
    margin-top: 10px;
    letter-spacing: 0.03em;
  }
  #overlay{
    position:fixed; inset:0;
    background: var(--bg);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: 18px;
    padding: 32px;
    text-align:center;
    z-index: 10;
  }
  #overlay p{
    color: var(--text-dim);
    font-size: 15px;
    max-width: 300px;
    line-height:1.5;
    margin:0;
  }
  #overlay.hidden{ display:none; }
</style>
</head>
<body>
<div id="overlay">
  <h1 style="font-size:16px;color:var(--text);letter-spacing:0.08em;">CONSTELAÇÃO</h1>
  <p>Gire o corpo e incline o celular até encontrar a constelação escondida.<br>É sobre se envolver, não sobre precisão.</p>
  <button id="enable-btn">Começar</button>
</div>

<div id="app">
  <header>
    <h1>Procura</h1>
    <div id="status-line">Gire o corpo e incline o celular</div>
  </header>

  <div id="stage">
    <div id="sky-wrap">
      <div id="sky-glow"></div>
      <div id="sky">
        <svg viewBox="0 0 100 100">
          <g class="star-line-group">
            <line class="star-line" x1="30" y1="70" x2="45" y2="45"/>
            <line class="star-line" x1="45" y1="45" x2="50" y2="20"/>
            <line class="star-line" x1="45" y1="45" x2="70" y2="50"/>
            <line class="star-line" x1="70" y1="50" x2="78" y2="75"/>
          </g>
          <circle class="star-dot" cx="30" cy="70" r="2.6"/>
          <circle class="star-dot" cx="45" cy="45" r="3.4"/>
          <circle class="star-dot" cx="50" cy="20" r="2.4"/>
          <circle class="star-dot" cx="70" cy="50" r="2.8"/>
          <circle class="star-dot" cx="78" cy="75" r="2.4"/>
        </svg>
      </div>
      <div id="hold-track"><div id="hold-fill"></div></div>
    </div>
  </div>

  <footer>
    <div id="bar-label">
      <span>Longe</span>
      <span>Perto</span>
    </div>
    <div id="bar-track"><div id="bar-fill"></div></div>
    <div id="controls">
      <button id="new-target-btn">Novo alvo</button>
      <button id="reset-btn">Reiniciar</button>
    </div>
    <div id="target-info">alvo oculto</div>
  </footer>
</div>

<script>
(function(){
  const HEADING_TOLERANCE = 40;
  const PITCH_TOLERANCE   = 25;
  const HOLD_MS           = 1800;
  const MAX_DIST          = 130;
  const SMOOTH            = 0.18;

  const els = {
    overlay: document.getElementById('overlay'),
    enableBtn: document.getElementById('enable-btn'),
    status: document.getElementById('status-line'),
    sky: document.getElementById('sky'),
    glow: document.getElementById('sky-glow'),
    barFill: document.getElementById('bar-fill'),
    holdFill: document.getElementById('hold-fill'),
    newTargetBtn: document.getElementById('new-target-btn'),
    resetBtn: document.getElementById('reset-btn'),
    targetInfo: document.getElementById('target-info'),
  };

  let target = { heading: 0, pitch: 0 };
  let holdStart = null;
  let locked = false;
  let wasInZone = false;
  let rafPending = false;
  let smoothHeading = 0;
  let smoothPitch = 0;
  let hasReading = false;

  function vibrate(ms){
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
  }

  function randomTarget(){
    target.heading = Math.round(Math.random() * 360);
    target.pitch   = Math.round(-25 + Math.random() * 80);
    locked = false;
    holdStart = null;
    wasInZone = false;
    els.sky.classList.remove('locked', 'hot');
    els.holdFill.style.width = '0%';
    els.status.textContent = 'Gire o corpo e incline o celular';
    els.targetInfo.textContent = 'alvo oculto';
  }

  function angularDistance(a, b){
    let d = Math.abs(a - b) % 360;
    if (d > 180) d = 360 - d;
    return d;
  }

  function computeHeading(event){
    if (typeof event.webkitCompassHeading === 'number'){
      return event.webkitCompassHeading;
    }
    if (event.absolute === true && typeof event.alpha === 'number'){
      return (360 - event.alpha) % 360;
    }
    return (event.alpha != null) ? (360 - event.alpha) % 360 : 0;
  }

  function handleOrientation(e){
    if (e.beta == null && e.alpha == null) return;

    const rawHeading = computeHeading(e);
    const rawPitch   = e.beta || 0;

    if (!hasReading){
      smoothHeading = rawHeading;
      smoothPitch = rawPitch;
      hasReading = true;
    } else {
      let deltaH = rawHeading - smoothHeading;
      if (deltaH > 180) deltaH -= 360;
      if (deltaH < -180) deltaH += 360;
      smoothHeading = (smoothHeading + deltaH * SMOOTH + 360) % 360;
      smoothPitch = smoothPitch + (rawPitch - smoothPitch) * SMOOTH;
    }

    if (!rafPending){
      rafPending = true;
      requestAnimationFrame(updateUI);
    }
  }

  function updateUI(){
    rafPending = false;
    if (locked) return;

    const dHeading = angularDistance(smoothHeading, target.heading);
    const dPitch   = angularDistance(smoothPitch, target.pitch);
    const dist     = Math.sqrt(dHeading*dHeading + dPitch*dPitch);
    const closeness = Math.max(0, 1 - dist / MAX_DIST);

    els.barFill.style.width = (closeness * 100).toFixed(0) + '%';
    if (closeness < 0.35) {
      els.barFill.style.background = 'var(--cold)';
    } else if (closeness < 0.7) {
      els.barFill.style.background = 'var(--mid)';
    } else {
      els.barFill.style.background = 'var(--hot)';
    }

    els.glow.style.opacity = (closeness * 0.95).toFixed(2);
    if (closeness > 0.55) els.sky.classList.add('hot');
    else els.sky.classList.remove('hot');

    const within = dHeading <= HEADING_TOLERANCE && dPitch <= PITCH_TOLERANCE;

    if (within){
      if (!wasInZone){
        wasInZone = true;
        vibrate(40);
        els.status.textContent = 'Quase! Segure firme...';
      }
      if (holdStart === null) holdStart = performance.now();
      const elapsed = performance.now() - holdStart;
      const holdPct = Math.min(100, (elapsed / HOLD_MS) * 100);
      els.holdFill.style.width = holdPct + '%';

      if (elapsed >= HOLD_MS){
        locked = true;
        els.sky.classList.add('locked');
        els.status.textContent = 'Constelação revelada!';
        vibrate([50, 40, 80]);
      }
    } else {
      if (wasInZone){
        wasInZone = false;
        els.status.textContent = 'Continue procurando...';
      }
      holdStart = null;
      els.holdFill.style.width = '0%';
      if (!locked){
        if (closeness > 0.65) els.status.textContent = 'Está quente...';
        else if (closeness > 0.35) els.status.textContent = 'Esquentando';
        else els.status.textContent = 'Gire o corpo e incline o celular';
      }
    }
  }

  function enableSensor(){
    const needsIOS =
      typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function';

    if (needsIOS){
      DeviceOrientationEvent.requestPermission()
        .then(state => {
          if (state === 'granted') startListening();
          else els.status.textContent = 'Permissão negada';
        })
        .catch(() => els.status.textContent = 'Erro de permissão');
    } else if ('DeviceOrientationEvent' in window){
      startListening();
    } else {
      els.status.textContent = 'Sensor não disponível';
    }
  }

  function startListening(){
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);
    els.overlay.classList.add('hidden');
    randomTarget();
  }

  els.enableBtn.addEventListener('click', enableSensor);
  els.newTargetBtn.addEventListener('click', randomTarget);
  els.resetBtn.addEventListener('click', () => {
    locked = false;
    holdStart = null;
    wasInZone = false;
    els.sky.classList.remove('locked', 'hot');
    els.holdFill.style.width = '0%';
    els.status.textContent = 'Gire o corpo e incline o celular';
  });
})();
</script>
</body>
</html>
