<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b12"><title>A Sala às Escuras — Carro-Forte</title>
<link rel="stylesheet" href="atividade.css?v=20260905-cena1"></head>
<body>
<header><span id="kicker">MOSAICO</span><h1>A Sala às Escuras</h1><p>O corredor dos arquivos, durante a zona cega. Varra o facho pelo espaço: o que o facho não tocar, você não leva. Objeto no chão não é culpa de ninguém — é objeto no chão.</p></header>
<main>
  <div id="room" class="room" aria-label="Corredor às escuras">
    <div id="beam" class="beam"></div>
  </div>
  <div class="placar"><b id="conta">0 de 0</b><span>fragmentos alcançados</span></div>
  <div id="lista" class="lista"></div>
  <!-- Nasce escondido. Ele não é mais "concluir" — a atividade acaba pelo
       relógio da mesa, e este botão só reaparece no fim, como a volta. Ver
       atividade.js: o antigo Concluir ficava a um dedo de "Abrir atividade" e
       encerrava tudo antes de a pessoa ver a primeira tela. -->
  <button id="finish" class="primary" hidden>← Voltar à Mesa</button>
</main>
<script src="fragmentos.js?v=20260901-colheita1"></script>
<script src="atividade.js?v=20260905-cena1"></script>
<script>
/* O facho revela por proximidade e nada mais: não há botão que percorra os
   pontos por você. O antigo #scan fazia exatamente isso — quatro cliques, na
   ordem certa, e a mecânica inteira virava decoração.

   E não há mais como concluir: a atividade acaba quando o tempo da mesa acaba.
   Sair com dois de quatro continua sendo possível — só não é mais um botão.
   O custo aparece no dossiê, e o relógio é igual para todos. */
(function(){
  const A=window.MosaicoAtividade, itens=A.itens('escura');
  const room=document.getElementById('room'), beam=document.getElementById('beam');
  const achados=new Set();
  const RAIO=110;

  const pontos=itens.map((cod,i)=>{
    const el=document.createElement('div');
    el.className='obj';
    el.style.left=(12+((i*37)%64))+'%';
    el.style.top=(16+((i*29)%62))+'%';
    /* O texto entra só quando o facho alcança. Deixá-lo no DOM desde o começo
       seria o mesmo vazamento do Vidro antigo: legível no inspetor sem gesto. */
    room.appendChild(el);
    return {cod,el};
  });

  function varrer(x,y){
    beam.style.left=(x-90)+'px';
    beam.style.top=(y-90)+'px';
    const base=room.getBoundingClientRect();
    for(const p of pontos){
      if(achados.has(p.cod))continue;
      const r=p.el.getBoundingClientRect();
      const cx=r.left-base.left+r.width/2, cy=r.top-base.top+r.height/2;
      if(Math.hypot(cx-x,cy-y)<RAIO){
        p.el.innerHTML=`<b>${p.cod}</b><span>${A.texto(p.cod)}</span>`;
        p.el.classList.add('found');achados.add(p.cod);A.marcar(achados,itens);
      }
    }
  }
  const local=e=>{const r=room.getBoundingClientRect();varrer(e.clientX-r.left,e.clientY-r.top)};
  room.addEventListener('pointermove',local);
  room.addEventListener('pointerdown',local);

  A.iniciar({sensor:'escura',itens,achados});
})();
</script>
</body></html>
