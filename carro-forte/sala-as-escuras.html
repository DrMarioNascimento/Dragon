<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A Sala às Escuras — Carro-Forte</title><style>body{margin:0;background:#020406;color:#f2f5f4;font-family:system-ui;min-height:100dvh;display:grid;place-items:center;padding:20px;box-sizing:border-box}main{max-width:620px;width:100%}small{color:#d4ad68;letter-spacing:.16em}h1{font:44px Georgia;margin:.2em 0}p{color:#9da9a8;line-height:1.55}.room{height:390px;border:1px solid #28373b;position:relative;background:linear-gradient(#071014,#030607);overflow:hidden}.beam{position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#fff8d955 0,#ffd58b22 45%,transparent 72%);left:calc(50% - 90px);top:calc(50% - 90px);pointer-events:none;transition:.12s}.obj{position:absolute;border:1px solid #4a5e60;background:#0d1b1d;padding:9px 11px;font-size:12px;color:#dbe7e5;opacity:.22}.obj.found{opacity:1;border-color:#d4ad68}.o1{left:8%;top:14%}.o2{right:8%;top:30%}.o3{left:18%;bottom:14%}.o4{right:16%;bottom:10%}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,a{border:1px solid #496065;background:#0d1a1d;color:#eef4f3;padding:13px 16px;border-radius:5px;text-decoration:none;font:inherit}.primary{background:#d4ad68;color:#17201e;border:0;font-weight:700}</style></head><body><main><small>MOSAICO · A MANHÃ DO CARRO-FORTE</small><h1>A Sala às Escuras</h1><p>Procure vestígios da zona cega. Encontrar um objeto não diz quem o usou nem por quê. O fato precisa ser relacionado.</p><div id="room" class="room"><div class="obj o1" data-id="1">Saco vazio · 0,4 kg</div><div class="obj o2" data-id="2">Lacre ML-8842 rompido</div><div class="obj o3" data-id="3">Marcas de água: mesa ↔ arquivos</div><div class="obj o4" data-id="4">Sensor da porta · 7h58min24s</div><div id="beam" class="beam"></div></div><div class="actions"><button id="scan">Mover lanterna por toque</button><button id="finish" class="primary" disabled>Concluir atividade</button><a href="index.html">Voltar à Mesa</a></div></main><script>const room=document.getElementById('room'),beam=document.getElementById('beam'),finish=document.getElementById('finish');let found=new Set(),step=0;function reveal(x,y){beam.style.left=`${x-90}px`;beam.style.top=`${y-90}px`;document.querySelectorAll('.obj').forEach(o=>{const r=o.getBoundingClientRect(),rr=room.getBoundingClientRect(),cx=r.left-rr.left+r.width/2,cy=r.top-rr.top+r.height/2;if(Math.hypot(cx-x,cy-y)<120){o.classList.add('found');found.add(o.dataset.id)}});if(found.size===4)finish.disabled=false}room.addEventListener('pointermove',e=>{const r=room.getBoundingClientRect();reveal(e.clientX-r.left,e.clientY-r.top)});room.addEventListener('pointerdown',e=>{const r=room.getBoundingClientRect();reveal(e.clientX-r.left,e.clientY-r.top)});document.getElementById('scan').onclick=()=>{const pts=[[70,70],[500,130],[130,330],[470,330]];const p=pts[step++%pts.length];reveal(p[0],p[1])};finish.onclick=()=>{localStorage.setItem('mosaico-cf-escura','done');finish.textContent='Concluída ✓'}</script></body></html>
