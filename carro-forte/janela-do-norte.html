<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A Janela do Norte — Carro-Forte</title><style>body{margin:0;background:#05090c;color:#eef4f3;font-family:system-ui;min-height:100dvh;display:grid;place-items:center;padding:22px;box-sizing:border-box}main{max-width:560px;width:100%}small{color:#d4ad68;letter-spacing:.16em}h1{font:44px Georgia;margin:.2em 0}p{color:#9eb0ad;line-height:1.55}.compass{width:280px;height:280px;border:1px solid #355257;border-radius:50%;margin:28px auto;position:relative;background:radial-gradient(circle,#0e1c20,#071114 70%)}.needle{position:absolute;width:4px;height:120px;background:#d4ad68;left:138px;top:20px;transform-origin:2px 120px;transition:.15s}.target{position:absolute;inset:18px;border:1px dashed #66b7a5;border-radius:50%}.read{background:#0d1a1d;border:1px solid #294044;padding:16px;margin:10px 0}.read b{color:#66b7a5}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a{border:1px solid #496065;background:#0d1a1d;color:#eef4f3;padding:13px 16px;border-radius:5px;text-decoration:none;font:inherit}button.primary{background:#d4ad68;color:#17201e;border:0;font-weight:700}.done{border-color:#66b7a5}</style></head><body><main><small>MOSAICO · A MANHÃ DO CARRO-FORTE</small><h1>A Janela do Norte</h1><p>Oriente o aparelho. Cada setor fixa uma posição e um horário. A direção é um fato; o significado vem depois.</p><div class="compass"><div class="target"></div><div id="needle" class="needle"></div></div><div id="reads"></div><div class="actions"><button id="tap">Avançar setor por toque</button><button id="finish" class="primary" disabled>Concluir atividade</button><a href="index.html">Voltar à Mesa</a></div></main><script>const facts=['ENTRADA · carro-forte chega às 7h47','CORREDOR OPOSTO · Vigilância é deslocada às 7h58min05s','CÂMERA 3 · imagem cai às 7h58min12s','ARQUIVOS · porta abre às 7h58min24s','MESA DE CUSTÓDIA · malote retorna antes das 8h00'];let i=0;const needle=document.getElementById('needle'),reads=document.getElementById('reads'),finish=document.getElementById('finish');function show(){needle.style.transform=`rotate(${i*72}deg)`;reads.innerHTML=facts.slice(0,i+1).map((x,n)=>`<div class="read"><b>SETOR ${n+1}</b><br>${x}</div>`).join('');if(i===facts.length-1)finish.disabled=false}document.getElementById('tap').onclick=()=>{i=Math.min(facts.length-1,i+1);show()};window.addEventListener('deviceorientation',e=>{if(e.alpha==null)return;needle.style.transform=`rotate(${e.alpha}deg)`});finish.onclick=()=>{localStorage.setItem('mosaico-cf-norte','done');finish.textContent='Concluída ✓';finish.classList.add('done')};show()</script></body></html>
