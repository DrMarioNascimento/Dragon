<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b12"><title>A Janela do Norte — Carro-Forte</title>
<link rel="stylesheet" href="atividade.css?v=20260901-colheita1"></head>
<body>
<header><span id="kicker">MOSAICO</span><h1>A Janela do Norte</h1><p>Cada setor da agência guarda um registro, e só se abre quando o aparelho aponta para ele. Gire o telefone e segure a direção até o setor fixar.</p></header>
<main>
  <button id="permitir" class="ghost" hidden>Permitir a bússola deste aparelho</button>
  <div id="dica" class="dica">Procurando a bússola…</div>
  <div id="bussola" class="bussola"><div id="agulha" class="agulha"></div><div class="grau" id="grau">—</div></div>
  <div class="placar"><b id="conta">0 de 0</b><span>setores fixados</span></div>
  <div id="lista" class="lista"></div>
  <button id="finish" class="primary">Concluir</button>
</main>
<script src="fragmentos.js?v=20260901-colheita1"></script>
<script src="atividade.js?v=20260901-colheita1"></script>
<script>
/* Antes a agulha girava com o `deviceorientation` e não gateava nada: os fatos
   saíam de um botão "próximo" que só incrementava um contador. Dava para jogar
   com o telefone virado para baixo na mesa. O sensor era enfeite.

   Agora cada setor tem um rumo, e fixa quando o aparelho aponta para ele e
   permanece apontando. O botão saiu.

   Nem todo aparelho tem bússola — o telão não tem, o desktop não tem, e o iOS
   exige permissão pedida dentro de um gesto. Quando não há leitura em um
   segundo e meio, a mesma roda passa a ser girada com o dedo: continua sendo
   um gesto por setor, e não uma lista que avança sozinha. */
(function(){
  const A=window.MosaicoAtividade, itens=A.itens('norte');
  const agulha=document.getElementById('agulha'), grau=document.getElementById('grau');
  const bussola=document.getElementById('bussola'), dica=document.getElementById('dica');
  const permitir=document.getElementById('permitir');
  const achados=new Set();
  const TOLERANCIA=20, PARADA=600;
  const passo=360/itens.length;

  const setores=itens.map((cod,i)=>{
    const rumo=Math.round(i*passo);
    const el=document.createElement('div');
    el.className='setor';
    el.style.transform=`rotate(${rumo}deg) translateY(-2px)`;
    el.textContent=`${rumo}°`;
    bussola.appendChild(el);
    return {cod,rumo,el,desde:0};
  });

  let rumoAtual=0, temSensor=false;
  const distancia=(a,b)=>{const d=Math.abs(((a-b)%360+540)%360-180);return d};

  /* `conta` distingue desenhar a agulha de contar permanência. O desenho
     inicial da roda não pode valer como tempo apontando: sem isso, o setor de
     0° já nascia meio fixado, e o primeiro toque o fechava de graça. */
  function apontar(valor,conta=true){
    rumoAtual=((valor%360)+360)%360;
    agulha.style.transform=`rotate(${rumoAtual}deg)`;
    grau.textContent=Math.round(rumoAtual)+'°';
    if(!conta){for(const s of setores)s.desde=0;return}
    const agora=Date.now();
    for(const s of setores){
      if(achados.has(s.cod)){continue}
      if(distancia(rumoAtual,s.rumo)<=TOLERANCIA){
        if(!s.desde)s.desde=agora;
        s.el.style.color='#efc878';
        if(agora-s.desde>=PARADA){
          achados.add(s.cod);
          s.el.style.color='#8ce4b0';
          A.marcar(achados,itens);
        }
      }else{s.desde=0;s.el.style.color='#5d7386'}
    }
    if(achados.size<itens.length){
      const alvo=setores.find(s=>!achados.has(s.cod));
      dica.textContent=`Aponte para ${alvo.rumo}° e segure.`;
    }else dica.textContent='Todos os setores fixados.';
  }

  function ligarSensor(){
    addEventListener('deviceorientation',e=>{
      const v=(e.webkitCompassHeading!=null)?e.webkitCompassHeading:e.alpha;
      if(v==null)return;
      temSensor=true;permitir.hidden=true;
      apontar(v);
    });
  }
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    permitir.hidden=false;
    permitir.onclick=async()=>{
      try{if(await DeviceOrientationEvent.requestPermission()==='granted')ligarSensor()}catch(e){}
    };
  }else ligarSensor();

  /* Sem leitura em 1,5 s, a roda passa a ser girada com o dedo. */
  setTimeout(()=>{
    if(temSensor)return;
    dica.textContent='Sem bússola neste aparelho — gire a roda com o dedo.';
    const centro=()=>{const r=bussola.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}};
    const girar=e=>{
      if(e.pointerType==='mouse'&&!e.buttons)return;
      const c=centro();
      apontar(Math.atan2(e.clientX-c.x,c.y-e.clientY)*180/Math.PI);
    };
    bussola.addEventListener('pointermove',girar);
    bussola.addEventListener('pointerdown',girar);
    apontar(0,false);
  },1500);

  A.iniciar({sensor:'norte',itens,achados});
})();
</script>
</body></html>
