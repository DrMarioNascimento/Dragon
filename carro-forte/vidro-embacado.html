<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b12"><title>O Vidro Embaçado — Carro-Forte</title>
<link rel="stylesheet" href="atividade.css?v=20260904-tempo1"></head>
<body>
<header><span id="kicker">MOSAICO</span><h1>O Vidro Embaçado</h1><p>Cada faixa do vidro esconde um registro. Passe o dedo — ou o ponteiro — sobre a faixa até ela abrir. O que continuar embaçado não vai para o dossiê.</p></header>
<main>
  <div id="glass" class="glass" aria-label="Vidro embaçado"></div>
  <div class="placar"><b id="conta">0 de 0</b><span>fragmentos limpos</span></div>
  <div id="lista" class="lista"></div>
  <!-- Nasce escondido. Ele não é mais "concluir" — a atividade acaba pelo
       relógio da mesa, e este botão só reaparece no fim, como a volta. Ver
       atividade.js: o antigo Concluir ficava a um dedo de "Abrir atividade" e
       encerrava tudo antes de a pessoa ver a primeira tela. -->
  <button id="finish" class="primary" hidden>← Voltar à Mesa</button>
</main>
<script src="fragmentos.js?v=20260901-colheita1"></script>
<script src="atividade.js?v=20260904-tempo1"></script>
<script>
/* Antes: os quatro fatos entravam no DOM no carregamento, cobertos por uma
   camada embaçada, e dois cliques num botão "limpar" abriam tudo de uma vez.
   O texto estava lá para quem abrisse o inspetor, e o gesto não separava nada.

   Agora cada fragmento tem a sua faixa, o texto só é inserido quando a faixa
   abre, e abrir exige movimento continuado sobre aquela faixa. Limpar um canto
   e sair é uma jogada válida: você lê o peso e não lê a tabela — e sem o par,
   R-A não fecha. */
(function(){
  const A=window.MosaicoAtividade, itens=A.itens('vidro');
  const glass=document.getElementById('glass');
  const achados=new Set();
  const ESFORCO=14;

  const faixas=itens.map(cod=>{
    const el=document.createElement('div');
    el.className='faixa';
    el.dataset.cod=cod;
    el.innerHTML='<div class="conteudo"></div><div class="embacado"><div class="gotas"></div></div>';
    glass.appendChild(el);
    return {cod,el,passes:0};
  });

  function limpar(faixa){
    if(achados.has(faixa.cod))return;
    if(++faixa.passes<ESFORCO)return;
    faixa.el.querySelector('.conteudo').innerHTML=`<b>${faixa.cod} · ${A.titulo(faixa.cod)}</b>${A.texto(faixa.cod)}`;
    faixa.el.classList.add('limpa');
    achados.add(faixa.cod);
    A.marcar(achados,itens);
  }
  function esfregar(e){
    if(e.pointerType==='mouse'&&!e.buttons)return;
    const alvo=e.target.closest('.faixa');
    if(!alvo)return;
    const f=faixas.find(x=>x.el===alvo);
    if(f)limpar(f);
  }
  glass.addEventListener('pointermove',esfregar);
  glass.addEventListener('pointerdown',esfregar);

  A.iniciar({sensor:'vidro',itens,achados});
})();
</script>
</body></html>
