function execucaoTarefaSensor(tipo){
  var campo=tipo==="inclinacao"?"inclinacaoAbertaMs":"constelacaoAbertaMs";
  var aberta=Number(STATE.doc&&STATE.doc[campo])||0;
  var variante=tipo==="constelacao"?tarefaInteriorAtual():"janela";
  var codigo=(STATE.mesa&&STATE.mesa.codigo)||(STATE.eu&&STATE.eu.codigo)||"MOSAICO";
  var runId=[codigo,variante,aberta].join("-");
  return {runId:runId,semente:runId};
}
function urlTarefaSensor(cfg,tipo){
  var base=String((cfg&&cfg.arquivo)||"");
  var ex=execucaoTarefaSensor(tipo), sep=base.indexOf("?")>=0?"&":"?";
  return base+sep+"s="+encodeURIComponent(ex.semente)+"&run="+encodeURIComponent(ex.runId);
}
function sincronizarControleTarefa(frame,tipo){
  if(!frame||!frame.contentWindow) return;
  var ex=execucaoTarefaSensor(tipo), acao=partidaPausada()?"pausar":"retomar";
  if(frame.dataset.controle===acao) return;
  frame.dataset.controle=acao;
  /* Se isto falhar em silencio, o mestre pausa a partida e a tarefa segue
     rodando no aparelho do jogador — sem sinal nenhum de que se perderam. */
  try{frame.contentWindow.postMessage({mosaico:"controle-tarefa",runId:ex.runId,acao:acao},location.origin);}
  catch(e){console.error("controle da tarefa não chegou ao quadro ("+acao+")",e);}
}

function formatarCronometroFragmento(ms){
  var total=Math.max(0,Math.floor((Number(ms)||0)/1000));
  var min=Math.floor(total/60), seg=total%60;
  return String(min).padStart(2,'0')+':'+String(seg).padStart(2,'0');
}
function instanteMs(v){return v&&v.toMillis?v.toMillis():(Number(v)||0);}
function tempoFragmentoMs(){
  var inicio=Number(STATE.doc&&STATE.doc.mosaicoAbertoMs)||Date.now(), n=documentoMeuFragmento();
  var fim=n&&instanteMs(n.concluidoEm);
  var agora=STATE.doc&&STATE.doc.pausada?(Number(STATE.doc.pausaIniciadaMs)||Date.now()):Date.now();
  return Math.max(0,(fim||agora)-inicio);
}
function cronometroFragmentoHTML(){
  return '<span class="fragmento-cronometro" data-cronometro-fragmento>'+formatarCronometroFragmento(tempoFragmentoMs())+'</span>';

  document.querySelectorAll('[data-cronometro-fragmento]').forEach(function(el){el.textContent=formatarCronometroFragmento(tempoFragmentoMs());});

}

  var rascunho=(nucleo&&nucleo.rascunho)||{};

/* ---------- porta do mestre ----------
   AVISO HONESTO: qualquer senha guardada numa pagina web e verificavel
   por quem abrir o codigo-fonte. Isto serve para impedir que alguem
   abra mesas por engano ou por curiosidade — nao e seguranca de fato.
   O que protege os DADOS sao as Regras do Firestore.                   */
var SENHA_HASH="2ff22e27b070d318da49f2ba1062cfef81e85e7cb826a5e761cbdb5f07c62472";

async function sha256hex(txt){
  var buf=new TextEncoder().encode(txt);
  var h=await crypto.subtle.digest("SHA-256",buf);
  return Array.prototype.map.call(new Uint8Array(h),function(b){
    return b.toString(16).padStart(2,"0");
  }).join("");
}
function jaEhMestre(){

}

function fecharSenha(){ STATE.senhaAberta=false; render(); }

async function conferirSenha(){
  var campo=document.getElementById("senha");
  var erro=document.getElementById("senha-erro");
  if(!campo) return;
  var txt=(campo.value||"").trim();
  if(!txt){ erro.textContent="Escreva a senha."; return; }
  var ok=false;
  try{ ok = (await sha256hex(txt))===SENHA_HASH; }
  catch(e){ erro.textContent="Este navegador não permite conferir a senha."; return; }
  if(!ok){
    erro.textContent="Senha incorreta.";
    campo.value=""; campo.focus();
    return;
  }
  try{ sessionStorage.setItem("mosaico_mestre","1"); }catch(e){}
  STATE.senhaAberta=false;
  criarMesa(STATE.modoMesa);
}

/* ---------- tela cheia ----------
   So funciona a partir de um gesto da pessoa — nenhum navegador deixa
   entrar em tela cheia sozinho. E no iPhone o Safari nao implementa a
   API: la o caminho e "Adicionar a Tela de Inicio", que abre sem barra
   nenhuma por causa do manifest e das metatags.                      */
function telaCheia(){
  var el=document.documentElement;
  var f=el.requestFullscreen||el.webkitRequestFullscreen||
        el.mozRequestFullScreen||el.msRequestFullscreen;
  /* Os dois devolvem Promise: o try/catch sozinho nao pega a rejeicao, e
     ela vira "Uncaught (in promise)" em todo aparelho que nao implementa
     a trava de orientacao. Nenhum dos dois e essencial ao jogo.       */
  if(f){ try{ var pf=f.call(el); if(pf&&pf.catch)pf.catch(function(){}); }catch(e){} }
  if(screen.orientation && screen.orientation.lock){
    try{ var po=screen.orientation.lock("portrait"); if(po&&po.catch)po.catch(function(){}); }
    catch(e){}
  }
}
function jaEmTelaCheia(){
  return !!(document.fullscreenElement||document.webkitFullscreenElement);
}
function alternarTelaCheia(){
  if(jaEmTelaCheia()){
    var s=document.exitFullscreen||document.webkitExitFullscreen;
    if(s){ try{ s.call(document); }catch(e){} }
  } else telaCheia();
}

/* writeText devolve Promise: o try/catch sozinho nao pega a recusa, e o
   botao ficava dizendo "Copiar link" sem copiar nada e sem avisar. Safari
   e Firefox negam a area de transferencia em varios contextos, entao o
   caminho de falha precisa levar a algum lugar — aqui, ao proprio link. */
function copiarLink(){
  if(!STATE.mesa) return;
  var link=STATE.mesa.link;
  function falhou(){
    avisa("Não consegui copiar automaticamente. O link da sala é:\n\n"+link,
          {aceitar:"Fechar"});
  }
  try{
    var p=navigator.clipboard && navigator.clipboard.writeText(link);
    if(p && p.then) p.then(function(){ avisa("Link copiado.",{aceitar:"Fechar"}); }, falhou);
    else falhou();
  }catch(e){ falhou(); }
}

async function esperarFB(){
  if(!window.MosaicoFB && !window.MOSAICO_SEM_CONFIG){
    await new Promise(function(r){
      window.addEventListener("mosaicofb-ready",r,{once:true});
    });
  }
  if(!window.MosaicoFB){
    throw new Error(
      "O Firebase deste jogo ainda não foi configurado.\n\n"+
      "Abra o final do arquivo MOSAICO-mesa.html e cole a config do "+
      "projeto do Mosaico no bloco firebaseConfig.");
  }
  return window.MosaicoFB;
}

function desligarOuvintes(){
  if(_unsubJog) _unsubJog(); if(_unsubMesa) _unsubMesa();
  if(_unsubVotos) _unsubVotos(); if(_unsubPub) _unsubPub();
  _unsubV5.forEach(function(f){try{f();}catch(e){}}); _unsubV5=[];
  _unsubJog=_unsubMesa=_unsubVotos=_unsubPub=null;
}
function assinarSala(codigo,comoJogador){
  esperarFB().then(function(FB){
    desligarOuvintes();
    _unsubJog=FB.ouvirJogadores(codigo,function(l){
      STATE.jogadores=l; processarAcoesMestre(); comoJogador?sincronizarJogador():render();
    });
    _unsubMesa=FB.ouvirMesa(codigo,function(d){
      var repeticaoAntes=Number(STATE.doc&&STATE.doc.apuracaoRepeticao)||0;
      STATE.doc=d||{ativa:false,fase:"sala",vez:0};
      if(d&&d.fase==="resultado"&&Number(d.apuracaoRepeticao||0)!==repeticaoAntes)STATE.resultadoVista="podio";
      processarAcoesMestre();
      if(comoJogador) sincronizarJogador();
      else if(!d||d.ativa===false){ limparReconexao(); STATE.tela="inicio"; STATE.mesa=null; render(); }
      else render();
    });
    var receberVotos=function(v){
      STATE.votos=v;
      STATE.jaVotei=!!STATE.eu&&v.some(function(x){return x.id===STATE.eu.id||x.de===STATE.eu.id;});
      render();
    };
    _unsubVotos=souMestreDaMesa()?FB.ouvirVotos(codigo,receberVotos)

async function tentarReconectar(codigoUrl){
  var jogador=lerLocal("mosaico_reconexao");
  var mestre=lerLocal("mosaico_mestre_reconexao");
  var alvo=(jogador&&jogador.codigo)||(mestre&&mestre.codigo)||"";
  if(!alvo || (codigoUrl&&codigoUrl!==alvo)) return false;
  STATE.tela="reconectando"; render();
  try{
    var FB=await esperarFB(), uid=FB.uid&&FB.uid();
    var mesa=await FB.obterMesa(alvo);
    if(!mesa||mesa.ativa!==true){limparReconexao();STATE.tela=codigoUrl?"entrar":"inicio";render();return false;}

    if(jogador&&jogador.codigo===alvo&&jogador.id===uid){
      var salvo=await FB.obterJogador(alvo,jogador.id);
      if(salvo){
        STATE.eu={codigo:alvo,id:jogador.id,nome:salvo.nome,personagem:salvo.personagem,forma:salvo.forma};
        STATE.mesa={codigo:alvo,link:linkDaSala(alvo),fb:true,modo:mesa.modo||"com-telao"};
        STATE.modoMesa=mesa.modo||"com-telao"; STATE.doc=mesa;
        try{sessionStorage.setItem("mosaico_eu",JSON.stringify(STATE.eu));}catch(e){}
        if(mestre&&mestre.codigo===alvo&&mestre.uid===uid&&mesa.mestreUid===uid){
          try{sessionStorage.setItem("mosaico_mestre_codigo",alvo);}catch(e){}
        }
        assinarSala(alvo,true); sincronizarJogador(); return true;
      }
    }
    if(mestre&&mestre.codigo===alvo&&mestre.uid===uid&&mesa.mestreUid===uid){
      STATE.mesa={codigo:alvo,link:linkDaSala(alvo),fb:true,modo:mesa.modo||"com-telao"};
      STATE.modoMesa=mesa.modo||"com-telao"; STATE.doc=mesa; STATE.tela="painel";
      try{sessionStorage.setItem("mosaico_mestre_codigo",alvo);}catch(e){}
      assinarSala(alvo,false); render(); return true;
    }
    limparReconexao(); STATE.tela=codigoUrl?"entrar":"inicio"; render(); return false;
  }catch(e){
    console.error("reconexão",e); STATE.tela=codigoUrl?"entrar":"inicio"; render(); return false;
  }
}

/* A casa escolhe: sorteia entre os personagens ainda livres na mesa. */
function sortearPersonagem(ocupados){
  var maxCopias=((((CASO||{}).configuracao||{}).jogadores||{}).copiasPorPersonagem)||2;
  var contagem={}; PERSONAGENS.forEach(function(p){contagem[p.id]=0;});
  (ocupados||[]).forEach(function(id){if(contagem[id]!=null)contagem[id]++;});
  var menor=Math.min.apply(null,Object.keys(contagem).map(function(id){return contagem[id];}));
  var candidatos=PERSONAGENS.filter(function(p){return contagem[p.id]===menor&&contagem[p.id]<maxCopias;});
  if(!candidatos.length) return null;
  return candidatos[(Math.random()*candidatos.length)|0].id;
}

async function entrarNaMesa(){
  var codigo=(document.getElementById("cod").value||"").trim().toUpperCase();
  var nome=(document.getElementById("nome").value||"").trim();
  if(codigo.length!==6){ avisa("O código tem 6 caracteres."); return; }
  if(!nome){ avisa("Escreva seu nome."); return; }
  if(!STATE.forma){ avisa("Escolha como a casa vai te chamar."); return; }
  /* "tanto faz" tambem e escolha: a casa decide, como decide o resto */
  var forma = STATE.forma==="?" ? (Math.random()<0.5?"m":"f") : STATE.forma;

  telaCheia();   /* quem entra pelo QR nao passa pelo portao: o gesto e aqui */
  fecharCortina("A porta abriu. A casa está decidindo quem você é.");
  var entrouEm=Date.now();

  var id=novoId();
  try{
    var F0=await esperarFB();
    if(F0.uid && F0.uid()) id=F0.uid();   /* uid anonimo: permite regra por dono */
  }catch(e){ abrirCortina(); avisa(e.message||e); return; }

  try{
    var FB=await esperarFB();
    var existe=await FB.mesaAtiva(codigo);
    if(!existe){ abrirCortina(); avisa("Mesa não encontrada ou encerrada."); return; }

    /* quem ja esta na casa define o que sobrou para sortear */
    var jaEstao=await FB.listarJogadores(codigo);
    var maxJogadores=((CASO.configuracao&&CASO.configuracao.jogadores||{}).maximo)||12;
    if(jaEstao.filter(function(j){return j.id!==id;}).length>=maxJogadores){
      abrirCortina(); avisa("A mesa já atingiu o limite deste caso."); return;
    }
    var ocupados=[];
    for(var j=0;j<jaEstao.length;j++)
      if(jaEstao[j].id!==id && jaEstao[j].personagem) ocupados.push(jaEstao[j].personagem);
    var sorteado=sortearPersonagem(ocupados);

    STATE.eu={codigo:codigo,id:id,nome:nome,personagem:sorteado,forma:forma};
    try{ sessionStorage.setItem("mosaico_eu",JSON.stringify(STATE.eu)); }catch(e){}
    try{ localStorage.setItem("mosaico_reconexao",JSON.stringify(STATE.eu)); }catch(e){}

    await FB.entrarJogador(codigo,id,{
      nome:nome, personagem:sorteado, forma:forma,
      pronto:false,          /* so o proprio jogador se declara pronto */
      entrouMs:Date.now(), votos:0,
      moedas:((CASO.configuracao||{}).moedasIniciais||9), total:0
    });
    assinarSala(codigo,true);
    STATE.tela="esperando";
    render();

    /* a cortina fica no minimo 2,4s mesmo que a rede responda na hora:
       se ela piscar, nao e um momento, e um engasgo */
    var jaPassou=Date.now()-entrouEm;
    setTimeout(function(){
      abrirCortina();
      STATE.revelando=true;   /* a animacao so comeca com a cortina subindo */
      render();
      abrirAberturaParticipante(function(){
        STATE.orientacaoParticipanteAberta=true;
        render();
      });
    }, Math.max(0, 2400-jaPassou));
  }catch(e){
    console.error(e);
    abrirCortina();
    avisa("Não foi possível entrar.\n\n"+((e&&(e.message||e.code))||e));
  }
}

/* o jogador segue a fase que o painel publicou */
/* Entradas simultaneas podem escolher o mesmo papel antes do snapshot.
   A pessoa mais recente do papel excedente migra para um dos menos usados.
   Duplicidade equilibrada e intencional (7–12) permanece intacta. */
function resolverColisao(){
  if(!STATE.eu) return;
  var maxCopias=((((CASO||{}).configuracao||{}).jogadores||{}).copiasPorPersonagem)||2;
  var meu=STATE.jogadores.find(function(j){return j.id===STATE.eu.id;}), contagem={};
  PERSONAGENS.forEach(function(p){contagem[p.id]=0;});
  STATE.jogadores.forEach(function(j){if(contagem[j.personagem]!=null)contagem[j.personagem]++;});
  if(!meu) return;
  var valores=Object.keys(contagem).map(function(id){return contagem[id];}), menor=Math.min.apply(null,valores);
  if(contagem[meu.personagem]<=menor+1&&contagem[meu.personagem]<=maxCopias) return;
  var iguais=STATE.jogadores.filter(function(j){return j.personagem===meu.personagem;}).sort(function(a,b){return ((a.entrouMs||0)-(b.entrouMs||0))||String(a.id).localeCompare(String(b.id));});
  if(iguais[iguais.length-1].id!==meu.id) return;
  var ocupados=STATE.jogadores.filter(function(j){return j.id!==meu.id;}).map(function(j){return j.personagem;});
  var novo=sortearPersonagem(ocupados);
  if(!novo) return;
  if(novo===STATE.eu.personagem) return;
  STATE.eu.personagem=novo;
  try{ sessionStorage.setItem("mosaico_eu",JSON.stringify(STATE.eu)); }catch(e){}
  try{ localStorage.setItem("mosaico_reconexao",JSON.stringify(STATE.eu)); }catch(e){}
  esperarFB().then(function(FB){
    FB.atualizarJogador(STATE.eu.codigo,STATE.eu.id,{personagem:novo});
  }).catch(function(){});
}

function sincronizarJogador(){
  if(!STATE.eu) return;
  /* a mesa foi encerrada no painel: ninguem fica preso em tela morta */
  if(STATE.doc && STATE.doc.ativa===false){
    limparReconexao();
    STATE.travaTela=false;
    STATE.tela="encerrada";
    render();
    return;
  }
  resolverColisao();
  if(STATE.travaTela){ render(); return; }   /* revelacao segura a tela */
  var fase=(STATE.doc&&STATE.doc.fase)||"sala";
  var nova = fase==="sala"      ? "esperando"
           : fase==="encenacao" ? "encenacao"
           : fase==="votacao"   ? "votacao"
           : fase==="constelacao"? "constelacao"
           : fase==="inclinacao" ? "inclinacao"
           : fase==="mosaico"   ? "mosaico"
           : fase==="cooperacao"? "cooperacao"
           : fase==="mercado"   ? "mercado"
           : fase==="deducao"   ? "deducao"
           : "resultado";

  if(nova==="encenacao" && !introducaoEncenacaoPendente() && STATE.tela!=="encenacao"){
    var js=ordenados(STATE.jogadores);
    var atual=js[(STATE.doc.vez||0)];
    if(atual&&atual.id===STATE.eu.id) iniciarContagem();
  }
  if(nova==="encenacao" && !introducaoEncenacaoPendente() && STATE.tela==="encenacao"){
    var js2=ordenados(STATE.jogadores);
    var at2=js2[(STATE.doc.vez||0)];
    if(at2&&at2.id===STATE.eu.id&&STATE.contando===0&&!_timerContagem) iniciarContagem();
  }
  STATE.tela=nova;
  render();
}

function iniciarContagem(){
  STATE.contando=3;
  clearInterval(_timerContagem);
  _timerContagem=setInterval(function(){
    STATE.contando--;
    if(STATE.contando<=0){ clearInterval(_timerContagem); _timerContagem=null; }
    render();
  },1000);
}

}

async function terminei(){
  if(partidaPausada()) return;

     mas quem acabou de atuar fica vendo quem era e a propria pista */
  STATE.travaTela=true;

  render();
  /* A pista privada entra no Arquivo aqui, e nao so no clique do botao:
     ninguem deve ficar sem ela por ter recarregado a tela. */
  registrarPistaPrivada();
  var FB=await esperarFB();

}

/* ---------- pistas do jogador ----------
   Ficam no documento do proprio jogador no Firestore, nao so na tela.
   Assim sobrevivem a queda de conexao e podem ser relidas a qualquer
   momento — num jogo de deducao, consultar o que se recebeu e o jogo. */
function minhasPistas(){
  if(!STATE.eu) return [];
  for(var i=0;i<STATE.jogadores.length;i++)
    if(STATE.jogadores[i].id===STATE.eu.id) return STATE.jogadores[i].pistas||[];
  return [];
}

/* A gravacao da pista privada foi separada do destravamento da tela.

   O botao "Adicionar ao Arquivo" e um clique manual depois da atuacao:
   quem recarregasse a pagina, saisse da tela ou tivesse a fase avancada
   pelo mestre ficava SEM a pista privada — e, no Mercado, acabava
   oferecendo uma pista de tarefa no lugar dela. Agora terminei() ja
   registra a pista ao entrar na revelacao, e o botao e so confirmacao. */
async function registrarPistaPrivada(){
  var p = PISTA_PRIVADA[STATE.eu && STATE.eu.personagem];
  if(!p || !STATE.eu) return;
  var repetida = minhasPistas().some(function(x){ return x.hora===p.hora && x.txt===p.txt; });
  if(repetida) return;
  try{
    var FB=await esperarFB();
    await FB.acrescentarPista(STATE.eu.codigo, STATE.eu.id,
      { id:p.id||('priv-'+STATE.eu.personagem), hora:p.hora, txt:p.txt, adquirida:false });
  }catch(e){ console.error("registrarPistaPrivada", e); }
}

function desenhaPistas(){

/* O modulo sensorial ainda envia tempoMs, e a Mesa continua conferindo que
   ele e plausivel — mas o valor NAO e mais gravado. Ele era auto-reportado
   pelo aparelho de quem joga e nada no placar o consumia: um numero
   validado, guardado e inutil e uma armadilha para quem vier depois e
   assumir que da para confiar nele. Se algum dia o tempo das tarefas
   entrar na pontuacao, ele tera de vir de serverTimestamp nas duas pontas,
   na abertura e na conclusao.                                          */
async function concluirTarefaSensor(tipo,tempoMs,runId){
  if(!STATE.eu||!STATE.doc||STATE.doc.pausada||STATE.doc.fase!==tipo) return;
  var esperado=execucaoTarefaSensor(tipo).runId;
  tempoMs=Number(tempoMs);
  if(String(runId||"")!==esperado||!Number.isFinite(tempoMs)||tempoMs<=0||tempoMs>3600000) return;
  var id=STATE.eu.id+'_'+tipo;
  if((STATE.v5.tarefas||[]).some(function(t){return t.id===id&&tarefaConcluida(t);})) return;
  var FB=await esperarFB(), cfg=configTarefaSensor(tipo), pista=cfg&&cfg.pista;
  if(pista){
    var repetida=minhasPistas().some(function(p){return p.id===pista.id;});
    if(!repetida) await FB.acrescentarPista(STATE.eu.codigo,STATE.eu.id,
      {id:pista.id,hora:pista.hora,txt:pista.txt,adquirida:false,origem:'tarefa'});
  }
  /* O registro que pode disparar o avanço vem por último: assim o
     fragmento já está no Arquivo quando a rodada termina. */
  await FB.gravarServidor(STATE.eu.codigo,"tarefas",id,{tarefa:tipo,jogadorId:STATE.eu.id,runId:esperado},"concluidoEm");
}
window.addEventListener('message',function(event){
  if(event.origin!==location.origin||!event.data) return;
  if(event.data.mosaico!=='tarefa-ok') return;
  var tipo=STATE.doc&&STATE.doc.fase;
  if(tipo!=='constelacao'&&tipo!=='inclinacao') return;
  var frame=document.querySelector('iframe.tarefa-frame[data-tarefa="'+tipo+'"]');
  if(!frame||event.source!==frame.contentWindow) return;
  concluirTarefaSensor(tipo,event.data.tempoMs,event.data.runId).catch(function(e){console.error('concluir tarefa',e);});
});

async function prepararMosaico(){
  var FB=await esperarFB(), distribuicao=MosaicoV5.distribuirNucleos(STATE.jogadores);
  var compartilhado=STATE.jogadores.length<=3;
  for(var i=0;i<distribuicao.length;i++){
    await FB.atualizarJogador(STATE.mesa.codigo,distribuicao[i].id,{nucleo:distribuicao[i].nucleo,fragmentoPronto:false,fragmentoProntoMs:0});
  }
  var numeros=Array.from(new Set(distribuicao.map(function(d){return d.nucleo;})));
  for(var n=0;n<numeros.length;n++){
    var membros=distribuicao.filter(function(d){return d.nucleo===numeros[n];});

      numero:numeros[n],portadorId:sorteado.id,portadoresCompartilhados:compartilhado,
      rascunho:{},rascunhoMs:0
    });
    /* Cada Fragmento recebe as seis peças da cronologia, distribuídas entre
       os Arquivos de seus integrantes. Ninguém enxerga sozinho o conjunto. */
    for(var m=0;m<membros.length;m++){
      var jogador=STATE.jogadores.find(function(j){return j.id===membros[m].id;}), atuais=(jogador&&jogador.pistas)||[];
      var preservadas=atuais.filter(function(p){return p.origem!=='mosaico-coletivo';});

      });
      await FB.atualizarJogador(STATE.mesa.codigo,membros[m].id,{pistas:preservadas.concat(pecas)});

  await FB.atualizarMesa(STATE.mesa.codigo,{
    fase:'mosaico',mosaicoAbertoMs:Date.now(),fragmentosLiberados:compartilhado,
    fragmentosLiberadosMs:compartilhado?Date.now():0
  });

async function selecionarPistaMosaico(pistaId){

  var n=documentoMeuFragmento(), indice=String(STATE.mosaicoEscolha), rascunho=Object.assign({},(n&&n.rascunho)||{});
  var atual=rascunho[indice]||'', outro=chavesRespostaMosaico(rascunho).find(function(k){return k!==indice&&rascunho[k]===pistaId;});

async function enviarMosaico(){
  if(!souPortadorFragmento())return;
  var n=documentoMeuFragmento(), rascunho=(n&&n.rascunho)||{}, dicas=dicasMosaico(), ordem=[];
  for(var i=0;i<dicas.length;i++)ordem.push(rascunho[String(i)]||'');
  if(ordem.some(function(id){return !id;})){avisa('Preencha os seis horários antes de enviar.');return;}
  var correta=((CASO.mosaico||{}).ordemCorreta||[]);
  if(!await confirmar('Enviar esta ordem como resposta final do Fragmento?\n\nDepois do envio, ela não poderá ser alterada.',
      {aceitar:'Enviar',recusar:'Revisar',perigo:true}))return;
  var acertos=ordem.reduce(function(total,id,indice){return total+(id===correta[indice]?1:0);},0);
  var eu=meuJogador(), FB=await esperarFB();
  var rascunhoFinal=Object.assign({},rascunho,{_acertos:acertos,_totalItens:correta.length,_enviadoMs:Date.now()});
  await FB.concluirNucleo(STATE.eu.codigo,String(eu.nucleo),{numero:eu.nucleo,rascunho:rascunhoFinal,rascunhoMs:Date.now()});
  /* Com até três jogadores há um único Fragmento compartilhado. Portanto,
     esta entrega já conclui todos os Fragmentos e não deve depender da
     chegada de outro snapshot para destravar a partida automática. */
  if(STATE.jogadores.length<=3&&!ritmoConduzido()&&!partidaPausada()){

async function finalizarPartida(){
  var sol=CASO.solucao||{}, deducoes=STATE.v5.deducoes.map(function(d){
    var campos=['motivo','acao','prova','lacuna'].reduce(function(n,k){return n+(d[k]===sol[k]?1:0);},0);
    var submetidoMs=d.submetidoEm&&d.submetidoEm.toMillis?d.submetidoEm.toMillis():(d.submetidoMs||0);
    return Object.assign({},d,{submetidoMs:submetidoMs,suspeitoCorreto:d.suspeito===sol.suspeito,camposCorretos:campos,usouPistaAdquirida:(d.pistasUsadas||[]).length>0});
  });
  var perf=MosaicoV5.dividirVoto(STATE.votos,STATE.jogadores.map(function(j){return j.id;}),5);
  var coopInd={};
  STATE.jogadores.forEach(function(j){coopInd[j.id]=0;});
  var numeros=Array.from(new Set(STATE.jogadores.map(function(j){return j.nucleo;})));
  numeros.forEach(function(n){
    var ids=STATE.jogadores.filter(function(j){return j.nucleo===n;}).map(function(j){return j.id;});
    var pontos;
    if(STATE.jogadores.length<=3)pontos=Object.fromEntries(ids.map(function(id){return [id,0];}));
    else if(ids.length===2) pontos=Object.fromEntries(ids.map(function(id){return [id,5];}));
    else pontos=MosaicoV5.dividirVoto(STATE.v5.cooperacao.filter(function(v){return v.nucleo===n;}),ids,10);
    Object.assign(coopInd,pontos);
  });
  /* Só o carimbo do servidor vale como hora de entrega. O antigo recurso a
     concluidoMs nunca era gravado por concluirNucleo, entao devolvia zero —
     e zero ordenava como o Fragmento MAIS RAPIDO de todos. Enquanto o
     serverTimestamp nao confirma, o Fragmento simplesmente ainda nao
     entregou; Infinity garante que ele nunca vença o desempate.        */
  function msNucleo(n){
    var t=n&&n.concluidoEm;
    return t&&t.toMillis?t.toMillis():Infinity;
  }
  var concluidos=STATE.v5.nucleos.filter(function(n){return n.concluidoEm&&n.concluidoEm.toMillis;}).sort(function(a,b){
    return acertosMosaico(b)-acertosMosaico(a)||msNucleo(a)-msNucleo(b);
  });
  var escala=[20,16,12,8], coletivo={};
  if(STATE.jogadores.length<=3){
    var inicioMosaico=Number(STATE.doc&&STATE.doc.mosaicoAbertoMs)||0;
    var duracaoMosaico=concluidos.length&&inicioMosaico?Math.max(0,msNucleo(concluidos[0])-inicioMosaico):Infinity;
    var bonusTempo=duracaoMosaico<=150000?2:duracaoMosaico<=300000?1:0;
    var pontosAbsolutos=Math.min(20,acertosMosaico(concluidos[0])*3+bonusTempo);
    STATE.jogadores.forEach(function(j){coletivo[j.id]=pontosAbsolutos;});
  }else{
    STATE.jogadores.forEach(function(j){
      var pos=concluidos.findIndex(function(n){return Number(n.id)===Number(j.nucleo);});
      var base=pos<0?0:(escala[pos]==null?4:escala[pos]);
      coletivo[j.id]=base;
    });
  }
  var negociacoes=STATE.v5.negociacoes.map(function(n){
    var pista=Object.keys(CASO.pistas||{}).map(function(k){return CASO.pistas[k];}).find(function(p){return p.id===n.pistaId;});
    return Object.assign({},n,{qualidade:(pista&&pista.qualidade)||'mediana'});
  });
  var placar=MosaicoV5.calcular({jogadores:STATE.jogadores,deducoes:deducoes,negociacoes:negociacoes,coopColetiva:coletivo,coopIndividual:coopInd,performance:perf});
  var FB=await esperarFB();
  await FB.gravarPlacar(STATE.mesa.codigo,placar);
  var agora=Date.now();
  await FB.atualizarMesa(STATE.mesa.codigo,{fase:'resultado',revelacaoEtapa:0,reveladaEmMs:agora,solucao:sol,encerramentoIniciadoMs:0,encerramentoConcluido:true,encerramentoConcluidoMs:0});
}

/* ============================================================
   ABERTURA
   O mesmo elemento de video serve as duas funcoes: primeiro toca
   inteiro, com som, em tela cheia; depois vira pano de fundo mudo
   e em loop. Assim o arquivo de 10 MB e baixado uma vez so.
   ============================================================ */
(function ligaVideo(){
  var v=document.getElementById("video-abertura");
  var portao=document.getElementById("portao");
  if(!v||!portao) return;

  var jaViu=false;
  try{ jaViu = sessionStorage.getItem("mosaico_abertura")==="1"; }catch(e){}
  var entrandoNaSala=false;
  try{ entrandoNaSala = !!new URLSearchParams(location.search).get("sala"); }catch(e){}

  /* quem chega pelo QR quer entrar na mesa, nao assistir abertura */
  if(jaViu || entrandoNaSala){ semPortao(); }
  else { document.body.classList.add("portao"); }

  function sincronizaIconeSom(){
    var b=document.getElementById("btn-som");
    if(!b) return;
    b.innerHTML = v.muted ? "&#128263;" : "&#128266;";
    b.classList.toggle("on", !v.muted);
  }

  function semPortao(){
    document.body.classList.remove("portao");
    portao.classList.add("saindo");
    /* pulando a abertura, o video ja entra como fundo: mudo e em loop */
    v.muted=true; v.loop=true;
    sincronizaIconeSom();
    setTimeout(function(){ portao.style.display="none"; },1300);
  }

  function viraFundo(){
    try{ sessionStorage.setItem("mosaico_abertura","1"); }catch(e){}
    v.muted=true; v.loop=true;
    var t=v.play(); if(t&&t.catch) t.catch(function(){});
    semPortao();
  }

  /* o toque libera o som: e a unica porta que o navegador aceita */
  var comecouEm=0;
  function abrirComSom(){
    telaCheia();          /* o toque do portao e o gesto que libera as duas coisas */
    portao.classList.add("tocando");
    v.muted=false; v.loop=false; v.volume=1;
    comecouEm=Date.now();

    function arranca(){
      var t=v.play();
      if(t&&t.catch) t.catch(function(){
        v.muted=true; sincronizaIconeSom(); v.play();
      });
    }
    /* Rebobinar e assincrono. Se der play antes do seek terminar, o video
       toca no fim e dispara um "ended" na hora — que apagaria o som que a
       pessoa acabou de liberar. Por isso espera o seeked.               */
    if(v.currentTime>0.2){
      var aoVoltar=function(){ v.removeEventListener("seeked",aoVoltar); arranca(); };
      v.addEventListener("seeked",aoVoltar);
      try{ v.currentTime=0; }
      catch(e){ v.removeEventListener("seeked",aoVoltar); arranca(); }
    } else {
      arranca();
    }
    sincronizaIconeSom();
  }

  portao.addEventListener("click",function(e){
    if(e.target.id==="btn-pular"){ viraFundo(); return; }
    if(!portao.classList.contains("tocando")) abrirComSom();
  });

  /* Controle remoto de TV: nao ha toque. OK/Enter/Espaco fazem o mesmo,
     e o botao recebe foco sozinho para o primeiro OK ja valer.        */
  document.addEventListener("keydown",function(e){
    if(portao.style.display==="none") return;
    var k=e.key;
    if(k==="Enter"||k===" "||k==="Spacebar"||k==="OK"||e.keyCode===13||e.keyCode===32){
      e.preventDefault();
      if(portao.classList.contains("tocando")) viraFundo();
      else abrirComSom();
    }
  });
  if(document.body.classList.contains("portao")){
    setTimeout(function(){
      var b=document.getElementById("btn-comecar");
      if(b) try{ b.focus(); }catch(e){}
    },400);
  }

  /* controles soltos na tela de abertura */
  window.repetirAbertura=function(){
    portao.style.display="";
    portao.classList.remove("saindo");
    portao.classList.add("tocando");
    document.body.classList.add("portao");
    abrirComSom();
  };
  window.alternarSom=function(){
    v.muted=!v.muted;
    if(!v.muted){ v.volume=1; var t=v.play(); if(t&&t.catch) t.catch(function(){}); }
    sincronizaIconeSom();
  };
  var bR=document.getElementById("btn-repetir");
  var bS=document.getElementById("btn-som");
  if(bR) bR.addEventListener("click",function(){ window.repetirAbertura(); });
  if(bS) bS.addEventListener("click",function(){ window.alternarSom(); });
  var bC=document.getElementById("btn-cheia");
  if(bC) bC.addEventListener("click",function(){
    alternarTelaCheia();
    setTimeout(function(){ bC.classList.toggle("on", jaEmTelaCheia()); },300);
  });

  /* cinto de seguranca: "ended" logo apos rebobinar e espurio, ignora */
  v.addEventListener("ended", function(){
    if(Date.now()-comecouEm < 1200) return;
    viraFundo();
  });
  v.addEventListener("canplay",function(){
    v.classList.add("tocando");
    document.body.classList.add("com-video");
    if(!document.body.classList.contains("portao")){
      var t=v.play(); if(t&&t.catch) t.catch(function(){});
    }
  });
  v.addEventListener("error",function(){
    v.classList.remove("tocando");
    document.body.classList.remove("com-video");
    semPortao();   /* sem video, nao existe portao */
  });
  v.src="img/abertura.mp4";
  setTimeout(function(){ if(!v.readyState) semPortao(); },8000);
})();

   As Regras dizem QUEM pode escrever. Elas nao dizem de ONDE veio a
   chamada: qualquer pessoa autenticada anonimamente pode criar salas
   num laco, e a senha do mestre e barreira de tela, nao de servidor.
   O App Check resolve isso atestando que a chamada veio deste site.

   Para ligar, em tres passos:

     1. console.firebase.google.com -> projeto mosaico-game
        -> Compilacao -> App Check -> registre o app da Web
        -> provedor reCAPTCHA v3  -> copie a CHAVE DO SITE;
     2. cole a chave em CHAVE_APPCHECK, abaixo;
     3. no mesmo painel, marque Cloud Firestore como "Aplicado".

   Enquanto a chave nao for colada, o bloco abaixo nao faz nada e o jogo
   continua funcionando exatamente como antes — nao ha meia ativacao.
   ══════════════════════════════════════════════════════════════════ */
const CHAVE_APPCHECK = "";

if(CONFIGURADO && CHAVE_APPCHECK){
  try{
    initializeAppCheck(app, {
      provider: new ReCaptchaV3Provider(CHAVE_APPCHECK),
      isTokenAutoRefreshEnabled: true
    });
  }catch(e){
    /* Chave errada ou dominio nao autorizado derrubariam a mesa inteira.
       Melhor seguir sem atestacao e deixar o motivo no console. */
    console.error("App Check não iniciou — o jogo segue sem atestação.", e);
  }
} else if(CONFIGURADO){
  console.warn("MOSAICO: App Check desligado. Veja CHAVE_APPCHECK em MOSAICO-mesa.html.");
}

const db   = CONFIGURADO ? getFirestore(app) : null;
const auth = CONFIGURADO ? getAuth(app) : null;

/* login anonimo: ninguem cria conta, mas as Regras podem exigir
   request.auth != null em vez de deixar a colecao aberta ao mundo.

   O login e PREGUICOSO de proposito. Quando ele acontecia no carregamento
   da pagina, toda visita criava uma conta anonima permanente no projeto —
   inclusive de quem so abriu o link por curiosidade. Agora ele so dispara
   no primeiro gesto real (criar mesa, entrar, ouvir uma sala), e por isso
   TODO metodo de MosaicoFB precisa comecar por `await autenticar()`.    */
let _uid = null;
let _prontoAuth = null;
function autenticar(){
  if(_prontoAuth) return _prontoAuth;
  if(!CONFIGURADO) return (_prontoAuth = Promise.resolve(null));
  _prontoAuth = new Promise(res => {
    onAuthStateChanged(auth, u => { if(u){ _uid = u.uid; res(u.uid); } });
    signInAnonymously(auth).catch(e => {
      console.error("Login anônimo falhou — ative Authentication > Anônimo", e);
      res(null);
    });
  });
  return _prontoAuth;
}

/* Os ouvintes devolvem a funcao de cancelamento na hora, entao nao podem
   esperar o login com await. Este envelope mantem exatamente o mesmo
   contrato de fora: assina assim que a autenticacao termina e, se alguem
   cancelar antes disso, nunca chega a assinar.                          */
function ouvinteAdiado(iniciar){
  let cancelar=null, cancelado=false;
  autenticar().then(() => { if(!cancelado) cancelar=iniciar(); });
  return () => { cancelado=true; if(cancelar){ cancelar(); cancelar=null; } };
}

if(CONFIGURADO) window.MosaicoFB = {
  db,
  async pronto(){ return autenticar(); },
  uid(){ return _uid; },
  async criarMesa(codigo, modo, ritmo){
    await autenticar();
    await setDoc(doc(db, RAIZ, codigo), {
      ativa:true, fase:"sala", vez:0, modo:modo||"com-telao",
      mestreUid:_uid,
      criadaEm:serverTimestamp(), criadaEmMs:Date.now()
    });
    /* Compatível também com a regra anterior, que ainda não aceitava
       `ritmo` no CREATE. Depois de criada, somente o mestre pode atualizar. */
    await updateDoc(doc(db, RAIZ, codigo), {
      ritmo:ritmo==="conduzido"?"conduzido":"automatico"
    });
    return codigo;
  },
  async mesaAtiva(codigo){
    await autenticar();
    const s = await getDoc(doc(db, RAIZ, codigo));
    return s.exists() && s.data().ativa === true;
  },
  async obterMesa(codigo){
    await autenticar();
    const s=await getDoc(doc(db,RAIZ,codigo));
    return s.exists()?s.data():null;
  },
  async obterJogador(codigo,id){
    await autenticar();
    const s=await getDoc(doc(db,RAIZ,codigo,"jogadores",id));
    return s.exists()?{id:s.id,...s.data()}:null;
  },
  async atualizarMesa(codigo, dados){
    await autenticar();
    await updateDoc(doc(db, RAIZ, codigo), dados);
  },
  ouvirMesa(codigo, cb){
    return ouvinteAdiado(() => onSnapshot(doc(db, RAIZ, codigo),
      s => cb(s.exists() ? s.data() : null),
      e => { console.error("ouvirMesa", e); }));
  },
  async entrarJogador(codigo, id, dados){
    await autenticar();
    await setDoc(doc(db, RAIZ, codigo, "jogadores", id),
                 { ...dados, atualizadoEmMs: Date.now() }, { merge:true });
  },
  async atualizarJogador(codigo, id, dados){
    await autenticar();
    await setDoc(doc(db, RAIZ, codigo, "jogadores", id),
                 { ...dados, atualizadoEmMs: Date.now() }, { merge:true });
  },
  /* Acrescenta UMA pista sem reescrever o Arquivo inteiro.

     Antes, quem ganhava uma pista lia o proprio array, concatenava e
     regravava tudo. Se duas gravacoes se cruzassem — conclusao de tarefa
     e "Adicionar ao Arquivo", ou um snapshot atrasado depois de uma
     reconexao — a ultima apagava a outra e a pista sumia sem erro. Num
     jogo de deducao, perder uma pista e perder a rodada.

     ATENCAO: arrayUnion compara por igualdade profunda, campo a campo e
     na mesma ordem. Se alguem reordenar o literal em guardarPista ou em
     concluirTarefaSensor, a mesma pista passa a entrar duas vezes.     */
  async acrescentarPista(codigo, id, pista){
    await autenticar();
    await updateDoc(doc(db, RAIZ, codigo, "jogadores", id),
                    { pistas: arrayUnion(pista), atualizadoEmMs: Date.now() });
  },
  /* O placar inteiro numa transacao de escrita so: ou a mesa toda recebe
     os pontos, ou ninguem recebe. Antes eram N idas ao servidor em
     sequencia, e uma queda no meio deixava metade da mesa pontuada.    */
  async gravarPlacar(codigo, linhas){
    await autenticar();
    const lote = writeBatch(db);
    linhas.forEach(l => lote.set(doc(db, RAIZ, codigo, "jogadores", l.id), {
      total: l.total, pontuacao: l.componentes, economiaDetalhe: l.economia,
      atualizadoEmMs: Date.now()
    }, { merge:true }));
    await lote.commit();
  },
  ouvirJogadores(codigo, cb){
    return ouvinteAdiado(() => onSnapshot(collection(db, RAIZ, codigo, "jogadores"), snap => {
      const l = []; snap.forEach(d => l.push({ id:d.id, ...d.data() })); cb(l);
    }, e => { console.error("ouvirJogadores", e); cb([]); }));
  },
  async listarJogadores(codigo){
    await autenticar();
    const snap = await getDocs(collection(db, RAIZ, codigo, "jogadores"));
    const l = []; snap.forEach(d => l.push({ id:d.id, ...d.data() }));
    return l;
  },
  async votar(codigo, deId, paraId){
    await autenticar();
    await setDoc(doc(db, RAIZ, codigo, "votos", deId),
                 { de:deId, para:paraId, ms:Date.now() });
  },
  ouvirVotos(codigo, cb){
    return ouvinteAdiado(() => onSnapshot(collection(db, RAIZ, codigo, "votos"), snap => {
      const l = []; snap.forEach(d => l.push({ id:d.id, ...d.data() })); cb(l);
    }, e => { console.error("ouvirVotos", e); cb([]); }));
  },
  async publicar(codigo, ordem, dados){
    await autenticar();
    await setDoc(doc(db, RAIZ, codigo, "publicas", String(ordem)), dados);
  },
  ouvirPublicas(codigo, cb){
    return ouvinteAdiado(() => onSnapshot(collection(db, RAIZ, codigo, "publicas"), snap => {
      const l = []; snap.forEach(d => l.push({ id:d.id, ...d.data() })); cb(l);
    }, e => { console.error("ouvirPublicas", e); cb([]); }));
  },
  async gravar(codigo, colecao, id, dados){
    await autenticar();
    await setDoc(doc(db, RAIZ, codigo, colecao, id), dados, {merge:true});
  },
  async gravarServidor(codigo, colecao, id, dados, campo){
    await autenticar();
    await setDoc(doc(db, RAIZ, codigo, colecao, id), {...dados,[campo]:serverTimestamp()}, {merge:true});
  },
  ouvirColecao(codigo, nome, cb){
    return ouvinteAdiado(() => onSnapshot(collection(db, RAIZ, codigo, nome), snap => {
      const l=[]; snap.forEach(d=>l.push({id:d.id,...d.data()})); cb(l);
    }, e=>{ console.error("ouvirColecao "+nome,e); cb([]); }));
  },
  ouvirDocumento(codigo, nome, id, cb){
    return ouvinteAdiado(() => onSnapshot(doc(db,RAIZ,codigo,nome,id),s=>cb(s.exists()?{id:s.id,...s.data()}:null),
      e=>{console.error("ouvirDocumento "+nome,e);cb(null);}));
  },
  async concluirNucleo(codigo, id, dados){
    await autenticar();
    const ref=doc(db,RAIZ,codigo,"nucleos",id);
    await runTransaction(db,async tx=>{
      const atual=await tx.get(ref);
      if(atual.exists()&&(atual.data().concluidoEm)) return;
      tx.set(ref,{...dados,concluidoEm:serverTimestamp()},{merge:true});
    });
  },
  async comprarOferta(codigo, ofertaId, compradorId){
    await autenticar();
    const ofertaRef=doc(db,RAIZ,codigo,"ofertas",ofertaId);
    const compradorRef=doc(db,RAIZ,codigo,"jogadores",compradorId);
    await runTransaction(db,async tx=>{
      const ofertaSnap=await tx.get(ofertaRef);
      if(!ofertaSnap.exists()||ofertaSnap.data().status!=="aberta") throw new Error("Oferta indisponível.");
      const oferta=ofertaSnap.data();
      if(oferta.vendedorId===compradorId) throw new Error("Você não pode comprar a própria pista.");
      const vendedorRef=doc(db,RAIZ,codigo,"jogadores",oferta.vendedorId);
      const compradorSnap=await tx.get(compradorRef), vendedorSnap=await tx.get(vendedorRef);
      if(!compradorSnap.exists()||!vendedorSnap.exists()) throw new Error("Jogador desconectado.");
      const comprador=compradorSnap.data(), vendedor=vendedorSnap.data();
      if((comprador.moedas||0)<oferta.preco) throw new Error("Moedas insuficientes.");
      const pista=(vendedor.pistas||[]).find(p=>p.id===oferta.pistaId);
      if(!pista) throw new Error("Pista não encontrada.");
      const jaTem=(comprador.pistas||[]).some(p=>p.id===pista.id);
      const novas=jaTem?(comprador.pistas||[]):(comprador.pistas||[]).concat([{...pista,adquirida:true,compradaDe:oferta.vendedorId}]);
      tx.set(compradorRef,{moedas:(comprador.moedas||0)-oferta.preco,pistas:novas,ultimaNegociacao:ofertaId},{merge:true});
      tx.set(vendedorRef,{moedas:(vendedor.moedas||0)+oferta.preco,ultimaNegociacao:ofertaId},{merge:true});
      tx.set(ofertaRef,{status:"comprada",compradorId,compradaMs:Date.now()},{merge:true});
      tx.set(doc(db,RAIZ,codigo,"negociacoes",ofertaId),{...oferta,status:"comprada",compradorId,compradaMs:Date.now()});
    });
  }
};

window.dispatchEvent(new Event("mosaicofb-ready"));
console.log("MosaicoFB ready");
</script>
