<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070c">
<!-- Instalado pela "Tela de Inicio", abre sem barra nenhuma. E o unico
     jeito de ter tela cheia de verdade no iPhone, onde o Safari nao
     implementa a Fullscreen API. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icone-192.png">
<meta name="apple-mobile-web-app-title" content="MOSAICO">
<title>MOSAICO — A Casa da Costa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --breu:#05070c; --painel:#0c121a; --linha:#1b2634;
    --nevoa:#8fa3b8; --ambar:#e8a44c; --frio:#7fd4ff;
    --texto:#e6ecf2; --dim:#6d7f90; --vermelho:#e0674f;
    --barra-reserva:max(116px,calc(92px + env(safe-area-inset-bottom)));
    --serif:"Cormorant Garamond",Georgia,"Noto Serif","Times New Roman",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{
    min-height:100%;color:var(--texto);
    font-family:var(--sans);overscroll-behavior-y:none;
  }
  /* O fundo mora no html. Se o body tambem pintasse, ele cobriria o
     #arte (que fica em camada de fundo) e a arte nunca apareceria. */
  html{
    background:radial-gradient(ellipse 130% 70% at 50% 0%,#0b1119 0%,#05070c 60%) fixed,
               var(--breu);
  }
  body{background:transparent}

  /* ---------- arte-chave ----------
     capa-vertical.jpg  -> abertura no celular (o poster ja traz o nome)
     fundo-painel.jpg   -> atmosfera do painel projetado (versao sem texto) */
  #arte{
    position:fixed;inset:0;z-index:0;
    background-position:center;background-size:cover;background-repeat:no-repeat;
    opacity:0;transition:opacity 1.4s ease;
  }
  #arte::after{
    content:"";position:absolute;inset:0;
  }
  body.t-inicio #arte{
    background-image:url("img/capa-vertical.jpg");
    opacity:1;
  }
  /* video de abertura: se img/abertura.mp4 existir, cobre o poster.
     Se nao existir, o <video> some sozinho e o poster continua valendo. */
  #video-abertura{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;opacity:0;transition:opacity 1.6s ease;
  }
  /* o video segura o clima ate o jogo comecar: abertura e sala.
     Da fase seguinte em diante quem manda e o papel de parede. */
  body.t-inicio #video-abertura.tocando,
  body.t-painel.fase-sala #video-abertura.tocando{opacity:1}
  body.t-painel.fase-sala #arte{background-image:none;opacity:1}
  body.t-painel.fase-sala #arte::after{
    background:linear-gradient(180deg,
      rgba(5,7,12,.78) 0%, rgba(5,7,12,.40) 22%,
      rgba(5,7,12,.30) 60%, rgba(5,7,12,.80) 100%);
  }

  /* Cada arte na orientacao em que nasceu.
     Celular (tela vertical): o poster vertical, inteiro, com o nome no topo.
     O video e 16:9 — em 9:16 perderia ~70% da largura, entao nao entra aqui.
     Tela larga (computador / telao): o video toma a tela, proporcao bate.   */
  @media (max-aspect-ratio: 1/1){
    #video-abertura{display:none}
  }

  /* Tela larga: o video e o protagonista. O bloco de criar a mesa
     sai do centro e vai para o canto, pequeno, para nao tapar a cena. */
  @media (min-aspect-ratio: 1/1) and (min-width:820px){
    #app.capa{
      max-width:26em;margin:0 auto 0 0;
      padding-left:4vw;padding-bottom:5vh;
      background:linear-gradient(to top right,
        rgba(5,7,12,.94) 0%, rgba(5,7,12,.80) 32%,
        rgba(5,7,12,.42) 58%, transparent 82%);
    }
    #app.capa h1{font-size:clamp(13px,1.15vw,17px);letter-spacing:.34em;margin-bottom:12px}
    #app.capa .lead{font-size:clamp(16px,1.35vw,21px);line-height:1.4;margin-bottom:22px}
    #app.capa .btn{font-size:clamp(12px,.95vw,14px);padding:15px 22px;margin-bottom:9px}
    #app.capa .muted{font-size:clamp(12px,.9vw,14px);margin-top:16px}
    #app.capa .aviso{font-size:clamp(12px,.95vw,15px);padding:12px 14px}
  }
  /* veu leve so para dar unidade; quem garante a leitura e o
     degrade do proprio #app.capa, que fica por cima da arte */
  body.t-inicio #arte::after{
    background:linear-gradient(180deg,
      rgba(5,7,12,.04) 0%, rgba(5,7,12,.10) 40%, rgba(5,7,12,.22) 100%);
  }
  body.t-painel #arte{
    background-image:url("img/fundo-painel.jpg");
    opacity:.92;
  }
  /* escurece so onde ha leitura: faixa do relogio em cima, rodape embaixo.
     O meio fica limpo para a casa e o penhasco aparecerem. */
  body.t-painel #arte::after{
    background:linear-gradient(180deg,
      rgba(5,7,12,.86) 0%,
      rgba(5,7,12,.62) 16%,
      rgba(5,7,12,.34) 42%,
      rgba(5,7,12,.50) 72%,
      rgba(5,7,12,.88) 100%);
  }

  /* abertura: o poster manda, o texto ancora embaixo */
  #app.capa{
    min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;
    padding-bottom:max(34px,env(safe-area-inset-bottom));
    /* a mancha de leitura: o topo fica limpo para o nome e a tempestade,
       e a base fica solida o bastante para o texto nao brigar com o raio */
    background:linear-gradient(180deg,
      transparent 0%, rgba(5,7,12,.18) 20%, rgba(5,7,12,.72) 36%,
      rgba(5,7,12,.93) 50%, #05070c 66%);
  }
  #app.capa h1{
    font-size:clamp(15px,4vw,19px);letter-spacing:.4em;text-transform:uppercase;
    font-family:var(--sans);font-weight:600;color:var(--ambar);
    margin-bottom:16px;text-shadow:0 2px 20px rgba(0,0,0,.9);
  }
  #app.capa .lead{
    text-shadow:0 2px 24px rgba(0,0,0,.95);margin-bottom:30px;
  }
  #app.capa .eyebrow{display:none}
  #app{
    position:relative;z-index:1;
    max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;
    padding:max(24px,env(safe-area-inset-top)) 20px var(--barra-reserva);
  }
  /* o painel e projetado: precisa de largura e de leitura a distancia */
  #app.largo{max-width:1180px;padding-left:28px;padding-right:28px}
  .painel-cols{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
  .rodada-telao{text-align:center;margin:2px auto 18px;padding:13px 22px;
    width:min(92%,820px);border:1px solid rgba(72,190,210,.65);border-radius:8px;
    background:linear-gradient(135deg,rgba(25,91,107,.9),rgba(9,35,49,.94));
    color:#bdf5ff;box-shadow:0 0 34px rgba(72,190,210,.18)}
  .rodada-telao .rotulo{display:block;font-size:clamp(10px,2vw,13px);font-weight:800;
    letter-spacing:.3em;text-transform:uppercase;color:var(--ambar);margin-bottom:5px}
  .rodada-telao .nome{display:block;font-family:var(--serif);font-size:clamp(28px,5vw,52px);
    line-height:1.05;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .rodada-celular{margin:0 auto 8px;padding:10px 14px;width:100%}
  .rodada-celular .nome{font-size:clamp(22px,7vw,32px)}
  .dinamica-nivel{width:min(86%,620px);margin:-2px auto 18px;padding:8px 14px 9px;text-align:center;
    border:1px solid rgba(232,164,76,.5);border-radius:7px;
    background:linear-gradient(135deg,rgba(67,44,17,.94),rgba(28,24,21,.94));
    box-shadow:0 9px 24px rgba(0,0,0,.28)}
  .dinamica-nivel .dn-titulo{display:block;color:#ffd18d;font:800 clamp(11px,2.8vw,14px) var(--sans);
    letter-spacing:.12em;text-transform:uppercase;line-height:1.2}
  .dinamica-nivel .dn-sub{display:block;color:#fff;font:600 clamp(13px,3.5vw,17px) var(--serif);
    letter-spacing:.04em;line-height:1.25;margin-top:3px}
  .dinamica-nivel.equipe{border-color:rgba(127,212,255,.58);
    background:linear-gradient(135deg,rgba(18,67,88,.94),rgba(12,34,49,.94))}
  .dinamica-nivel.equipe .dn-titulo{color:#bdeeff}
  .dinamica-nivel.mercado{border-color:rgba(224,103,79,.65);
    background:linear-gradient(135deg,rgba(91,34,27,.95),rgba(48,20,20,.95))}
  .dinamica-nivel.mercado .dn-titulo{color:#ffb1a2}
  .dinamica-nivel.caso{border-color:rgba(180,148,225,.62);
    background:linear-gradient(135deg,rgba(55,39,79,.95),rgba(29,24,43,.95))}
  .dinamica-nivel.caso .dn-titulo{color:#d9c2ff}
  #app.largo>.dinamica-nivel{width:min(72%,680px);margin:-8px auto 12px}

  /* Encontro presencial dos Fragmentos: a mesma arte recebe uma cor por grupo. */
  body.busca-fragmento{min-height:100dvh;overflow-x:hidden;overflow-y:auto}
  body.busca-fragmento #arte{opacity:1;background-position:center;background-size:cover;background-repeat:no-repeat}
  body.busca-fragmento.fragmento-cor-1 #arte{
    background-image:linear-gradient(rgba(151,24,31,.72),rgba(74,8,14,.82)),url("img/capa-vertical.jpg");
    background-blend-mode:color,multiply}
  body.busca-fragmento.fragmento-cor-2 #arte{
    background-image:linear-gradient(rgba(17,83,161,.72),rgba(5,29,78,.84)),url("img/capa-vertical.jpg");
    background-blend-mode:color,multiply}
  body.busca-fragmento.fragmento-cor-3 #arte{
    background-image:linear-gradient(rgba(194,128,10,.68),rgba(83,49,2,.84)),url("img/capa-vertical.jpg");
    background-blend-mode:color,multiply}
  body.busca-fragmento.fragmento-cor-4 #arte{
    background-image:linear-gradient(rgba(112,42,157,.72),rgba(44,12,70,.84)),url("img/capa-vertical.jpg");
    background-blend-mode:color,multiply}
  body.busca-fragmento #arte::after{background:linear-gradient(180deg,rgba(5,7,12,.12),rgba(5,7,12,.4))}
  body.busca-fragmento #app{max-width:560px;min-height:100dvh;padding:24px 20px var(--barra-reserva);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
  body.busca-fragmento .rodada-celular{flex:0 0 auto;width:100%;max-width:500px;margin:0 auto 9px}
  body.busca-fragmento .dinamica-nivel{flex:0 0 auto;width:100%;max-width:460px;margin:0 auto 14px}
  .fragmento-encontro{position:relative;z-index:2;width:min(100%,500px);text-align:center;
    border:2px solid rgba(255,255,255,.74);border-radius:12px;padding:24px 20px;
    background:rgba(5,7,12,.68);box-shadow:0 22px 58px rgba(0,0,0,.56);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .fragmento-encontro .fe-selo{display:block;color:rgba(255,255,255,.82);font:800 12px var(--sans);
    letter-spacing:.28em;text-transform:uppercase;margin-bottom:10px}
  .fragmento-encontro h2{font-family:var(--serif);font-size:clamp(35px,10vw,54px);line-height:1;
    color:#fff;margin:0 0 22px;text-shadow:0 2px 20px rgba(0,0,0,.75)}
  .fragmento-encontro .fe-cor{display:block;margin:0 auto 9px;color:#fff;font:900 clamp(20px,6vw,30px) var(--sans);
    letter-spacing:.16em;text-transform:uppercase}
  .fragmento-encontro .fe-instrucao{font-family:var(--serif);font-size:clamp(23px,6.2vw,31px);
    line-height:1.28;color:#fff;margin-bottom:20px}
  .fragmento-encontro .fe-explica{color:rgba(255,255,255,.78);font-size:14px;line-height:1.5;margin-bottom:20px}
  .fragmento-encontro .btn{border-color:rgba(255,255,255,.76);background:rgba(5,7,12,.56);color:#fff}
  .fragmento-confirmado{display:grid;gap:6px;padding:15px 14px;border:1px solid rgba(255,255,255,.65);
    border-radius:7px;background:rgba(5,7,12,.55);color:#fff}
  .fragmento-confirmado b{font:800 14px var(--sans);letter-spacing:.12em;color:#fff}
  .fragmento-confirmado span{font:600 14px var(--serif);color:rgba(255,255,255,.82)}
  .fe-pontos{margin:8px 0 5px;color:#fff;font:900 clamp(15px,4vw,19px)/1.25 var(--sans);
    letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 14px #000}
  .fe-corra{margin:0 0 4px;color:rgba(255,255,255,.9);font:700 16px/1.35 var(--serif)}
  .fragmento-cronometro{display:block;margin:5px auto 12px;color:#f7c94a;
    font:800 clamp(44px,13vw,66px)/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.08em;
    text-shadow:0 0 5px #fffbe0,0 0 18px rgba(247,201,74,.92),0 0 34px rgba(217,154,34,.6);
    animation:cronometroUrgente 1.6s ease-in-out infinite}
  @keyframes cronometroUrgente{
    0%,100%{filter:drop-shadow(0 0 2px rgba(176,20,24,.18))}
    50%{filter:drop-shadow(0 0 13px rgba(224,35,38,.9)) drop-shadow(0 0 25px rgba(139,8,14,.72))}
  }
  .btn-fragmento-bloqueado{visibility:hidden}
  .fe-liberacao{display:block;min-height:20px;margin-top:5px;color:rgba(255,255,255,.82);
    font:700 13px/1.35 var(--sans);letter-spacing:.05em}

  /* Reconstrução coletiva: duas telas, leitura do grupo e controle do Portador. */
  body.mosaico-reconstrucao #app{padding-bottom:var(--barra-reserva)}
  body.mosaico-reconstrucao .rodada-celular{margin-bottom:5px;padding:7px 11px}
  body.mosaico-reconstrucao .rodada-celular .rotulo{display:none}
  body.mosaico-reconstrucao .rodada-celular .nome{font-size:clamp(20px,6vw,28px)}
  body.mosaico-reconstrucao .dinamica-nivel{margin-bottom:7px;padding:6px 10px}
  .mosaico-tarefa{width:100%;max-width:520px;margin:0 auto}
  .mosaico-tarefa-topo{text-align:center;margin-bottom:7px}
  .mosaico-tarefa-topo .fragmento-nome{display:block;color:#fff;font:700 clamp(20px,6vw,28px)/1.1 var(--serif)}
  .mosaico-tarefa .fragmento-cronometro{font-size:clamp(38px,11vw,54px);margin:5px auto 8px}
  .cronometro-legenda{display:block;margin:-4px 0 6px;color:#ffe0df;font:800 10px/1.2 var(--sans);
    letter-spacing:.1em;text-transform:uppercase}
  .mosaico-orientacao{padding:9px 11px;margin-bottom:8px;border:1px solid rgba(127,212,255,.34);
    border-radius:8px;background:rgba(10,19,28,.84);text-align:center}
  .mosaico-orientacao b{display:block;color:#bdeeff;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .mosaico-orientacao p{margin:4px 0 0;color:var(--texto);font:600 14px/1.3 var(--serif)}
  .portador-identidade{display:flex;align-items:center;justify-content:center;gap:9px}
  .peca-portador{width:34px;height:34px;flex:0 0 34px;filter:drop-shadow(0 0 7px rgba(247,201,74,.9));
    animation:pecaPortador 1.6s ease-in-out infinite}
  @keyframes pecaPortador{0%,100%{transform:rotate(-2deg) scale(.96);filter:drop-shadow(0 0 5px rgba(217,154,34,.6))}
    50%{transform:rotate(2deg) scale(1.06);filter:drop-shadow(0 0 12px rgba(255,232,137,1))}}
  .mosaico-dicas,.mosaico-campos{display:grid;gap:5px}
  .mosaico-dica{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;min-height:49px;
    padding:7px 9px;border:1px solid rgba(127,212,255,.22);border-radius:7px;background:rgba(9,17,25,.78)}
  .mosaico-dica time{color:#f7c94a;font:900 17px/1 var(--sans);font-variant-numeric:tabular-nums}
  .mosaico-dica span{color:#fff;font:600 14px/1.22 var(--serif)}
  .mosaico-campo{display:grid;gap:2px}
  .mosaico-campo time{color:#f7c94a;font:900 15px/1 var(--sans);font-variant-numeric:tabular-nums}
  .mosaico-escolher{width:100%;min-height:44px;padding:8px 12px;border:1px solid rgba(232,164,76,.48);
    border-radius:7px;background:rgba(9,14,21,.94);color:#fff;text-align:left;font:700 13px/1.2 var(--sans);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mosaico-escolher.vazio{color:var(--dim);font-weight:600}
  .mosaico-progresso{text-align:center;margin:7px 0 5px;color:#bdeeff;font:800 11px/1.2 var(--sans);
    letter-spacing:.12em;text-transform:uppercase}
  .mosaico-enviar{min-height:52px;margin:0}
  .mosaico-regra-pontos{margin:7px 0;color:#ffd18d;text-align:center;font:700 12px/1.35 var(--sans)}
  .mosaico-aguarde{text-align:center;color:var(--dim);font:700 13px/1.35 var(--serif);margin:8px 0 0}
  .mosaico-opcoes-fundo{position:fixed;inset:0;z-index:70;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
    display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,7,.9);backdrop-filter:blur(8px)}
  .mosaico-opcoes{width:min(100%,560px);max-height:calc(100dvh - max(28px,env(safe-area-inset-top)) - max(28px,env(safe-area-inset-bottom)));
    overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 14px;border:1px solid rgba(232,164,76,.5);
    border-radius:14px 14px 8px 8px;background:linear-gradient(170deg,#111820,#070a0f);box-shadow:0 -20px 70px rgba(0,0,0,.68)}
  .mosaico-opcoes h2{font-size:clamp(25px,7vw,34px);margin-bottom:11px;text-align:center}
  .mosaico-opcao{display:block;width:100%;margin:0 0 8px;padding:12px;text-align:left;border:1px solid rgba(232,164,76,.3);
    border-radius:8px;background:rgba(255,255,255,.035);color:#fff}
  .mosaico-opcao .mo-topo{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;color:#f7c94a;
    font:800 11px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase}
  .mosaico-opcao .mo-texto{display:block;font:600 16px/1.32 var(--serif)}
  .mosaico-opcao.usada{border-color:rgba(127,212,255,.32);background:rgba(49,107,132,.1)}
  .mosaico-opcoes .btn{margin-top:5px}
  @media(prefers-reduced-motion:reduce){.fragmento-cronometro,.peca-portador{animation:none}}
  /* Telao deitado: duas colunas lado a lado. */
  @media(min-width:900px) and (min-aspect-ratio: 1/1){
    .painel-cols{grid-template-columns:1.25fr .75fr;gap:34px}
    #app.largo .grade{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  }
  /* Telao em pe: uma coluna so, e tudo cresce — quem le esta longe. */
  @media(min-width:820px) and (max-aspect-ratio: 1/1){
    #app.largo{max-width:100%;padding-left:5vw;padding-right:5vw;
               display:flex;flex-direction:column}
    /* espalha o conteudo pela altura em vez de amontoar no topo */
    .painel-cols{grid-template-columns:1fr;gap:5vh;flex:1;align-content:space-between}
    #app.largo .grade{grid-template-columns:repeat(auto-fit,minmax(15vw,1fr));gap:1.6vw}
    #app.largo .relogio .hh{font-size:11vw}
    #app.largo .relogio .cap{font-size:1.7vw;letter-spacing:.3em}
    #app.largo .eyebrow{font-size:1.7vw}
    #app.largo .jog .av{font-size:5vw}
    #app.largo .jog .nm{font-size:2.2vw}
    #app.largo .jog .pers{font-size:2.4vw}
    #app.largo .jog .est{font-size:1.3vw}
    #app.largo .publica .ph{font-size:1.7vw}
    #app.largo .publica .pt{font-size:3.4vw;line-height:1.3}
    #app.largo .publica .pq{font-size:1.9vw}
    #app.largo .publicas-vazio,#app.largo .vazio{font-size:2.6vw}
    #app.largo .barra .conta{font-size:2vw}
    #app.largo .rodada-telao .rotulo{font-size:1.4vw}
    #app.largo .rodada-telao .nome{font-size:4vw}
    #app.largo .btn{font-size:1.8vw;padding:2.4vh 3vw}
    #app.largo .muted{font-size:1.8vw}
  }

  /* ---------- relogio da casa ---------- */
  .relogio{
    text-align:center;padding:8px 0 26px;
  }
  .relogio .hh{
    font-family:var(--serif);font-size:clamp(52px,13vw,92px);line-height:1;
    letter-spacing:.1em;color:var(--nevoa);font-variant-numeric:tabular-nums;
    text-shadow:0 0 44px rgba(143,163,184,.3);
  }
  .relogio .cap{
    font-size:clamp(11px,3vw,14px);letter-spacing:.34em;text-transform:uppercase;

    content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--linha);
  }
  .jog.st-pronto::before{background:var(--frio)}
  .jog.st-atuando::before{background:var(--ambar)}
  .jog.st-atuando{border-color:rgba(232,164,76,.45)}
  .jog .av{font-size:clamp(30px,8vw,40px);line-height:1;margin-bottom:10px}
  .jog .nm{
    font-size:clamp(15px,4vw,18px);font-weight:600;margin-bottom:5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .jog .pers{
    font-family:var(--serif);font-style:italic;
    font-size:clamp(16px,4.3vw,20px);color:var(--nevoa);
  }
  .jog .est{
    font-size:clamp(11px,2.9vw,13px);letter-spacing:.18em;text-transform:uppercase;
    color:var(--dim);margin-top:9px;
  }
  .jog .pt{
    font-size:clamp(22px,6vw,28px);font-weight:600;color:var(--ambar);margin-top:8px;
    font-variant-numeric:tabular-nums;
  }
  .vazio{
    grid-column:1/-1;text-align:center;padding:44px 20px;
    font-family:var(--serif);font-style:italic;color:var(--dim);
    font-size:clamp(19px,5.2vw,25px);line-height:1.5;
  }

  /* ---------- painel vivo do telão ---------- */
  .painel-lateral,.painel-pistas{min-width:0}
  .painel-pistas{display:flex;min-height:0;flex-direction:column}
  .mural-feed{min-height:0;overflow:hidden;flex:1}
  .mural-trilho{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end}
  @media(min-width:820px) and (min-aspect-ratio:1/1){
    body.t-painel.painel-em-jogo{height:100dvh;overflow:hidden}
    body.t-painel.painel-em-jogo #app.largo{
      width:100%;max-width:none;height:100dvh;min-height:0;overflow:hidden;
      padding:10px 20px 14px;display:flex;flex-direction:column
    }
    body.t-painel.painel-em-jogo .rodada-telao{flex:0 0 auto;margin:0 auto 7px;padding:7px 18px}
    body.t-painel.painel-em-jogo .rodada-telao .rotulo{font-size:9px;margin-bottom:2px}
    body.t-painel.painel-em-jogo .rodada-telao .nome{font-size:clamp(25px,2.6vw,38px)}
    body.t-painel.painel-em-jogo .barra{flex:0 0 auto;padding-bottom:6px;margin-bottom:7px;gap:8px}
    body.t-painel.painel-em-jogo .barra .conta{font-size:13px}
    body.t-painel.painel-em-jogo .barra .btn{padding:8px 12px;font-size:10px}
    body.t-painel.painel-em-jogo .painel-cols{
      flex:1;min-height:0;grid-template-columns:minmax(220px,24vw) minmax(0,1fr);
      gap:22px;align-items:stretch;overflow:hidden
    }
    body.t-painel.painel-em-jogo .painel-lateral{
      min-height:0;overflow:hidden;display:flex;flex-direction:column
    }
    body.t-painel.painel-em-jogo .relogio{flex:0 0 auto;padding:0 0 7px}
    body.t-painel.painel-em-jogo .relogio .hh{font-size:clamp(34px,4.5vw,64px)}
    body.t-painel.painel-em-jogo .relogio .cap{font-size:9px;margin-top:3px}
    body.t-painel.painel-em-jogo .grade{
      grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-bottom:7px;min-height:0
    }
    body.t-painel.painel-em-jogo .jog{padding:6px 5px}
    body.t-painel.painel-em-jogo .jog .av{font-size:20px;margin-bottom:3px}
    body.t-painel.painel-em-jogo .jog .nm{font-size:11px;margin-bottom:1px}
    body.t-painel.painel-em-jogo .jog .pers{display:none}
    body.t-painel.painel-em-jogo .jog .est{font-size:8px;margin-top:2px;letter-spacing:.08em}
    body.t-painel.painel-em-jogo .vazio{padding:18px 8px;font-size:clamp(20px,2.6vw,34px)}
    body.t-painel.painel-em-jogo .acao-painel{margin-top:auto;flex:0 0 auto}
    body.t-painel.painel-em-jogo .acao-painel .card{padding:10px;margin-bottom:6px}
    body.t-painel.painel-em-jogo .acao-painel .lead{font-size:18px;margin:2px 0 4px}
    body.t-painel.painel-em-jogo .acao-painel .muted{font-size:11px;line-height:1.3}
    body.t-painel.painel-em-jogo .acao-painel .btn{padding:10px 12px;margin-bottom:5px;font-size:10px}
    body.t-painel.painel-em-jogo .painel-pistas>.eyebrow{flex:0 0 auto;margin-bottom:5px}
    body.t-painel.painel-em-jogo .publica{padding-left:12px;margin-bottom:12px}
    body.t-painel.painel-em-jogo .publica .ph{font-size:10px}
    body.t-painel.painel-em-jogo .publica .pt{font-size:clamp(18px,2vw,28px);line-height:1.2;margin-top:4px}
    body.t-painel.painel-em-jogo .publica .pq{font-size:10px;margin-top:3px}
    body.t-painel.painel-em-jogo .publicas-vazio{font-size:clamp(18px,2vw,28px);padding:18px 0}
  }

  /* ---------- abertura exclusiva do participante ---------- */
  #abertura-participante{
    position:fixed;inset:0;z-index:65;background:#020305;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  #abertura-participante.hidden{display:none}
  #abertura-participante video{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    background:#020305;
  }
  .abertura-participante-portao{
    position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:36px 24px;
    background:linear-gradient(180deg,rgba(3,5,9,.28),rgba(3,5,9,.78));
  }
  .abertura-participante-portao h2{
    font-size:clamp(31px,9vw,48px);margin:8px 0 14px;
    text-shadow:0 3px 24px rgba(0,0,0,.95);
  }
  .abertura-participante-portao .lead{
    max-width:19em;margin-bottom:25px;text-shadow:0 2px 20px #000;
  }
  #abertura-participante.tocando .abertura-participante-intro{display:none}
  #btn-pular-participante{
    display:none;position:absolute;right:16px;
    bottom:max(22px,env(safe-area-inset-bottom));width:auto;margin:0;
    padding:12px 18px;border-radius:100px;background:rgba(5,7,12,.68);
    border:1px solid rgba(232,164,76,.45);color:var(--ambar);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #abertura-participante.tocando .abertura-participante-portao{
    background:transparent;pointer-events:none;
  }
  #abertura-participante.tocando #btn-pular-participante{
    display:block;pointer-events:auto;
  }

  /* ---------- portao: a tela-titulo antes do video ----------
     O toque aqui e o que libera o som. Navegador nenhum deixa video
     com audio comecar sozinho — entao o primeiro toque e a chave.   */
  #portao{
    position:fixed;inset:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 30px;
    background:linear-gradient(180deg,rgba(5,7,12,.35) 0%,rgba(5,7,12,.72) 100%);
    transition:opacity 1.2s ease, background 1.2s ease;
  }
  /* durante o video o Pular vai para o canto: no centro ele cai
     exatamente onde legenda e texto do video costumam aparecer */
  #portao.tocando{
    background:transparent;
    justify-content:flex-end;align-items:flex-end;
    padding-right:18px;
  }
  #portao.saindo{opacity:0;pointer-events:none}
  body.portao #app{opacity:0;pointer-events:none;transition:opacity .8s ease}
  #portao-toque{
    font-family:var(--serif);font-style:italic;
    font-size:clamp(26px,6.8vw,38px);color:var(--texto);
    text-shadow:0 2px 30px rgba(0,0,0,.95);margin-bottom:28px;
    animation:respira 3s ease-in-out infinite;
  }
  #portao #btn-comecar{width:auto;min-width:14em;margin-bottom:16px}
  /* foco visivel: na TV a pessoa navega as cegas sem isso */
  #portao #btn-comecar:focus,#btn-pular:focus{
    outline:none;border-color:var(--ambar);
    box-shadow:0 0 0 3px rgba(232,164,76,.35),0 0 34px rgba(232,164,76,.3);
  }
  #portao-sub{
    font-size:clamp(11px,3vw,14px);letter-spacing:.26em;text-transform:uppercase;
    color:var(--nevoa);opacity:.65;
    text-shadow:0 2px 20px rgba(0,0,0,.95);
  }
  @keyframes respira{0%,100%{opacity:.6}50%{opacity:1}}
  #portao.tocando #portao-toque,
  #portao.tocando #portao-sub,
  #portao.tocando #btn-comecar{display:none}
  #btn-pular{
    display:none;pointer-events:auto;
    font-family:var(--sans);font-size:clamp(11px,3vw,13px);font-weight:600;
    letter-spacing:.22em;text-transform:uppercase;
    padding:13px 24px;border-radius:100px;
    border:1px solid rgba(232,164,76,.35);
    background:rgba(5,7,12,.6);color:var(--ambar);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    margin-bottom:max(24px,env(safe-area-inset-bottom));
  }
  #portao.tocando #btn-pular{display:block}

  /* ---------- menu de pistas do jogador ---------- */
  #btn-pistas{
    position:fixed;z-index:22;
    right:14px;bottom:max(16px,env(safe-area-inset-bottom));
    display:none;align-items:center;gap:9px;
    padding:12px 18px;border-radius:100px;cursor:pointer;
    border:1px solid rgba(232,164,76,.32);
    background:rgba(5,7,12,.66);color:var(--ambar);
    font-family:var(--sans);font-size:clamp(11px,3vw,14px);font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  #btn-pistas.on{display:flex}
  #btn-pistas b{
    font-size:clamp(14px,3.8vw,18px);letter-spacing:0;color:#fff;
    font-variant-numeric:tabular-nums;
  }
  #btn-pistas:focus{outline:none;border-color:var(--ambar);
    box-shadow:0 0 0 3px rgba(232,164,76,.3)}
  #pistas{
    position:fixed;inset:0;z-index:42;
    background:linear-gradient(170deg,#0a0f16,#05070c);
    padding:max(22px,env(safe-area-inset-top)) 20px var(--barra-reserva);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    opacity:0;pointer-events:none;transition:opacity .45s ease;
  }
  #pistas.on{opacity:1;pointer-events:auto}
  #pistas h2{
    font-family:var(--sans);font-size:clamp(12px,3.2vw,15px);font-weight:600;
    letter-spacing:.34em;text-transform:uppercase;color:var(--dim);
    text-align:center;margin:8px 0 10px;
  }
  .pista-item{
    border-left:2px solid rgba(232,164,76,.45);
    padding:2px 0 2px 15px;margin-bottom:22px;
  }
  .pista-item .ph{
    display:block;font-size:clamp(25px,6.8vw,30px);font-weight:800;letter-spacing:.12em;
    color:#f7c94a;font-variant-numeric:tabular-nums;
    text-shadow:0 0 16px rgba(247,201,74,.42);
  }
  .pista-item .pt{
    font-family:var(--serif);font-size:clamp(20px,5.5vw,25px);line-height:1.32;
    color:var(--texto);margin-top:7px;
  }
  #pistas-vazio{
    font-family:var(--serif);font-style:italic;color:var(--dim);
    font-size:clamp(20px,5.4vw,27px);text-align:center;margin-top:20vh;line-height:1.5;
  }

  /* ---------- controles de abertura, no cantinho ---------- */
  #ctrl-abertura{
    position:fixed;z-index:20;
    top:max(14px,env(safe-area-inset-top));right:14px;
    display:none;gap:8px;
  }
  body.t-inicio #ctrl-abertura{display:flex}
  body.portao #ctrl-abertura{display:none}
  #ctrl-abertura button{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;line-height:1;cursor:pointer;
    border:1px solid rgba(143,163,184,.22);
    background:rgba(5,7,12,.55);color:var(--nevoa);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:border-color .25s ease,background .25s ease;
  }
  #ctrl-abertura button:focus,#ctrl-abertura button:active{
    outline:none;border-color:var(--ambar);background:rgba(232,164,76,.14);
  }
  #ctrl-abertura button.on{border-color:var(--ambar)}

  /* ---------- escolha da forma de tratamento ---------- */
  .formas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
  .forma-op{
    border:1px solid var(--linha);border-radius:3px;background:var(--painel);
    color:var(--texto);padding:16px 8px;cursor:pointer;text-align:center;
    transition:border-color .25s ease,background .25s ease;
  }
  .forma-op[class*="on"]{border-color:var(--ambar);background:rgba(232,164,76,.09)}
  .forma-op b{
    display:block;font-size:clamp(34px,9vw,46px);
    line-height:1.1;font-weight:400;
  }
  .forma-op span{
    display:block;margin-top:8px;font-family:var(--serif);font-style:italic;
    font-size:clamp(14px,3.8vw,17px);line-height:1.3;color:var(--nevoa);
  }

  /* ---------- personagens ---------- */
  .pers-lista{display:grid;gap:10px;margin-bottom:24px}
  .pers-op{
    display:flex;align-items:flex-start;gap:16px;text-align:left;
    border:1px solid var(--linha);border-radius:3px;background:var(--painel);
    padding:16px 18px;cursor:pointer;width:100%;color:var(--texto);
    transition:border-color .25s ease;
  }
  .pers-op[aria-pressed="true"]{border-color:var(--ambar);background:rgba(232,164,76,.07)}
  .pers-op:disabled{opacity:.3;cursor:default}
  .pers-op .av{font-size:clamp(28px,7.5vw,36px);line-height:1}
  .pers-op .txt{display:block;flex:1;min-width:0}
  .pers-op .nm{
    display:block;font-family:var(--serif);font-size:clamp(24px,6.4vw,30px);line-height:1.15;
  }
  .pers-op .desc{
    display:block;font-family:var(--serif);font-style:italic;color:var(--nevoa);
    font-size:clamp(16px,4.3vw,20px);line-height:1.35;margin-top:3px;
  }

  /* Barra inferior única: Caso | Sala | Arquivo. */
  .barra-jogo{position:fixed;z-index:45;left:12px;right:12px;
    bottom:max(8px,env(safe-area-inset-bottom));display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:stretch;
    padding:6px;border:1px solid rgba(127,212,255,.18);border-radius:18px;
    background:rgba(3,6,11,.94);box-shadow:0 10px 34px rgba(0,0,0,.5);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none}
  .barra-jogo .btn-caso,.barra-jogo .btn-menu-mestre,.barra-jogo #btn-pistas{
    position:static;left:auto;right:auto;bottom:auto;transform:none;width:100%;min-width:0;
    grid-row:1;min-height:52px;margin:0;padding:9px 3px;display:none;align-items:center;justify-content:center;
    border-radius:12px;background:transparent;box-shadow:none;
    font-size:clamp(9px,2.65vw,12px);letter-spacing:.07em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;pointer-events:auto}
  .barra-jogo .btn-caso{grid-column:1;display:flex}
  .barra-jogo .btn-menu-mestre{grid-column:2;display:flex}
  .barra-jogo #btn-pistas{grid-column:3}
  .barra-jogo #btn-pistas.on{display:flex}
  .barra-jogo button.ativo{background:rgba(127,212,255,.1);border-color:rgba(127,212,255,.8);
    color:#bdeeff;box-shadow:inset 0 0 18px rgba(127,212,255,.08)}
  .barra-jogo #btn-pistas.ativo{background:rgba(232,164,76,.1);border-color:rgba(232,164,76,.72);color:#ffd18d}

  /* ---------- roteiro de cinema ---------- */
  #escuro{
    position:fixed;inset:0;z-index:40;background:#020304;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 30px;
  }
  #escuro .quem{
    font-family:var(--serif);font-size:clamp(30px,8.4vw,44px);
    color:var(--nevoa);line-height:1.25;margin-bottom:18px;
  }
  #escuro .sub{
    font-size:clamp(12px,3.2vw,15px);letter-spacing:.28em;text-transform:uppercase;
    color:#33414f;
  }
  .pulso{
    width:9px;height:9px;border-radius:50%;background:var(--nevoa);
    margin:0 auto 30px;animation:resp 3.4s ease-in-out infinite;
  }
  @keyframes resp{0%,100%{opacity:.12;transform:scale(1)}50%{opacity:.55;transform:scale(1.5)}}
  #contagem{
    font-family:var(--serif);font-size:clamp(90px,26vw,150px);
    color:var(--ambar);line-height:1;
  }
  .roteiro{
    border-left:2px solid var(--ambar);padding-left:20px;margin:0 0 30px;
  }
  .roteiro .quem{
    font-size:clamp(13px,3.5vw,16px);font-weight:600;letter-spacing:.3em;
    text-transform:uppercase;color:var(--ambar);margin-bottom:14px;
  }
  /* a rubrica e lida em pe, de longe e na penumbra: nao pode ser miuda */
  .roteiro .rub{
    font-family:var(--serif);font-style:italic;color:var(--nevoa);
    font-size:clamp(23px,6.2vw,30px);line-height:1.42;margin-bottom:18px;
  }
  .roteiro .tom{
    display:inline-block;font-size:clamp(15px,4vw,18px);font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;color:var(--vermelho);
    border:1px solid rgba(224,103,79,.4);border-radius:2px;
    padding:10px 16px;margin-bottom:20px;
  }
  .roteiro .fala{
    font-family:var(--serif);font-size:clamp(38px,11vw,62px);line-height:1.14;
    color:var(--texto);margin-bottom:18px;
  }
  .roteiro .pos{
    font-family:var(--serif);font-style:italic;color:var(--nevoa);opacity:.78;
    font-size:clamp(21px,5.6vw,27px);line-height:1.42;
  }
  .roteiro-blocos{display:grid;gap:12px;margin:14px 0 24px}
  .roteiro-etapa{border:2px solid transparent;border-radius:9px;padding:17px 18px;
    box-shadow:0 12px 28px rgba(0,0,0,.24)}
  .roteiro-etapa .etapa-rotulo{display:block;font-size:clamp(11px,3vw,13px);font-weight:800;
    letter-spacing:.22em;text-transform:uppercase;margin-bottom:9px}
  .roteiro-etapa .etapa-texto{font-family:var(--serif);font-size:clamp(21px,5.7vw,28px);
    line-height:1.34;color:#fff}
  .roteiro-etapa.preparo{border-color:rgba(127,212,255,.82);
    background:linear-gradient(135deg,rgba(22,76,101,.97),rgba(12,46,66,.97))}
  .roteiro-etapa.preparo .etapa-rotulo{color:#bdeeff}
  .roteiro-etapa.acao{border-color:rgba(232,164,76,.9);
    background:linear-gradient(135deg,rgba(103,65,17,.97),rgba(67,40,10,.97))}
  .roteiro-etapa.acao .etapa-rotulo{color:#ffd18d}
  .roteiro-etapa.fala{border-color:rgba(224,103,79,.92);
    background:linear-gradient(135deg,rgba(105,38,31,.98),rgba(67,20,20,.98))}
  .roteiro-etapa.fala .etapa-rotulo{color:#ffb1a2}
  .roteiro-etapa.fala .etapa-tom{font-size:clamp(12px,3.2vw,15px);font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;color:#ffd0c7;margin-bottom:10px}
  .roteiro-etapa.fala .etapa-fala{font-family:var(--serif);font-size:clamp(25px,6.8vw,39px);
    line-height:1.22;color:#fff}

  /* Na encenação, apenas o aparelho de quem atua recebe informação. */
  body.encenacao-passiva{background:#020407;overflow:hidden}
  body.encenacao-passiva #arte{background-image:url("img/capa-vertical.jpg");opacity:.78}
  body.encenacao-passiva #arte::after{background:rgba(2,4,7,.58)}
  body.encenacao-passiva #app{max-width:none;min-height:100dvh;padding:0;display:flex;
    align-items:center;justify-content:center}
  body.encenacao-passiva #btn-pistas{display:none!important}
  .encenacao-aguarde{position:relative;z-index:2;padding:15px 24px;border:1px solid rgba(230,236,242,.48);
    border-radius:100px;background:rgba(5,7,12,.72);color:#fff;text-align:center;
    font:800 clamp(18px,5vw,27px) var(--sans);letter-spacing:.28em;text-indent:.28em;
    text-shadow:0 2px 18px #000;box-shadow:0 12px 34px rgba(0,0,0,.45);
    animation:aguardeRespira 2.2s ease-in-out infinite}
  @keyframes aguardeRespira{0%,100%{opacity:.66}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.encenacao-aguarde{animation:none}}

  /* ---------- modal QR ---------- */
  .modal-fundo{
    position:fixed;inset:0;z-index:50;background:rgba(3,5,9,.9);
    display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }

<!-- CARIMBO DE CACHE — um lugar so.
     Ao publicar uma mudanca que precise furar o cache dos aparelhos, troque
     a data no ?v= da linha abaixo. O caso e o video releem esse mesmo valor
     de window.MOSAICO_VERSAO, entao nao ha um segundo lugar para esquecer. -->
<script src="js/mosaico-v5.js?v=20260825-integridade"></script>
<script src="js/qr.js?v=20260825-integridade"></script>
<script>
window.MOSAICO_VERSAO=(function(){
  var s=document.querySelector('script[src*="mosaico-v5.js"]');
  var m=s&&/[?&]v=([^&"]+)/.exec(s.getAttribute("src")||"");
  return m?m[1]:"dev";
})();

/* ── SERVICE WORKER — escrito, DESLIGADO por padrão ──────────────────
   sw.js guarda vídeo, áudio e imagens entre partidas. Sem ele, cada
   participante rebaixa 13,6 MB de abertura toda vez, e uma mesa de doze
   puxa ~165 MB antes da primeira cena. Ele também é o que faz o Chrome no
   Android oferecer a instalação.

   Está desligado porque NÃO FOI POSSÍVEL EXERCITÁ-LO: o navegador usado na
   auditoria bloqueia registro de Service Worker, e um erro no handler de
   fetch derruba TODOS os pedidos de quem já o tiver instalado — num jogo
   presencial isso encerra a noite, e desinstalar à distância não é opção.

   Para ligar, depois de testar em http(s) real num celular:
     1. troque para true;
     2. abra o jogo, confirme em DevTools > Application > Service Workers
        que ele ativou e que a mídia aparece no cache "mosaico-midia-…";
     3. corte a rede e confirme que o jogo ainda abre;
     4. publique uma mudança no HTML e confirme que ela chega na hora —
        código é rede-primeiro, e isso é o que não pode falhar.

   Com false, qualquer Service Worker já instalado é REMOVIDO. É essa a
   válvula: voltar a false e publicar desfaz a instalação nos aparelhos. */
var ATIVAR_SERVICE_WORKER = false;

if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){
    if(ATIVAR_SERVICE_WORKER){
      navigator.serviceWorker.register("sw.js?v="+window.MOSAICO_VERSAO)
        .catch(function(e){ console.warn("Service Worker não registrou — o jogo segue normalmente.", e); });
    }else{
      navigator.serviceWorker.getRegistrations().then(function(regs){
        regs.forEach(function(r){ r.unregister(); });
      }).catch(function(){});
    }
  });
}
</script>
<script>
/* ============================================================
   MOSAICO — mesa, painel e encenacao
   Convencoes herdadas do Learning-lab (Laboratorio do Pesquisador):
   codigo de 6 caracteres sem 0/O/1/I, link ?sala=, QR gerado localmente,
   Firestore publicado em window.MosaicoFB por um script type=module.
   ============================================================ */
"use strict";

/* ---------- flexao de genero ----------
   O texto guarda as duas formas: {masculino|feminino}. A escolha e do
   jogador, feita na entrada, antes de saber qual arquetipo vai receber.
   Jornalista e Policial nao mudam de palavra — so o artigo — por isso
   o rotulo inteiro fica escrito, em vez de trocar sufixo por regra.   */
function flex(txt, forma){
  return String(txt==null?"":txt).replace(/\{([^|}]*)\|([^}]*)\}/g,
    function(_,m,f){ return forma==="f" ? f : m; });
}

/* ---------- arquetipos (Cap. 3 — Os Seis Convidados) ---------- */

  { id:"investigador", av:"🔎",

  { id:"morador", av:"🏠",

  { id:"jornalista", av:"🎤",

    desc:"Segura a bolsa com força. Algo lá dentro importa mais que a noite." },
  { id:"policial", av:"🚓",

  { id:"menina", av:"🧸",
    nome:"{O Menino|A Menina}",
    desc:"{O último|A última}. Vê tudo. Não diz nada." }
];

function nomePers(p, forma){ return p ? flex(p.nome, forma) : "—"; }
function nomePersFragmento(j, lista){
  var p=personagemPor(j&&j.personagem), base=nomePers(p,j&&j.forma);
  var iguais=ordenados(lista||STATE.jogadores).filter(function(x){return x.personagem===j.personagem;});
  if(iguais.length<2) return base;
  return base+' · fragmento '+(iguais.findIndex(function(x){return x.id===j.id;})+1);
}
function descPers(p, forma){ return p ? flex(p.desc, forma) : ""; }

/* ---------- roteiros da encenacao (Cap. 1 e 3) ---------- */
var ROTEIRO = {

    pos:"Depois da fala, mantenha o olhar fixo no alto por um instante, como se ainda esperasse uma resposta."
  },
  herdeiro:{

    acao:"Entre com segurança. Examine lentamente os cantos da sala. Ao encontrar o cofre, fixe o olhar nele, aproxime-se e toque a trava com o indicador.",

/* ---------- dialogos da casa ----------
   `avisa` era chamado em tres lugares e nunca existiu: cada chamada era um
   ReferenceError, inclusive a do erro de carregamento do caso, que por isso
   nunca chegava a avisar ninguem.

   Aqui ele passa a existir, junto de `confirmar`, e os dois substituem
   alert() e confirm(). Vivem fora de #app porque render() reescreve #app a
   cada snapshot do Firestore, e prendem o foco enquanto estao abertos —
   sem isso, o leitor de tela continua lendo a pagina atras do dialogo. */
var _dialogoAberto=null;

function fecharDialogo(resposta){
  if(!_dialogoAberto) return;
  var d=_dialogoAberto; _dialogoAberto=null;
  document.removeEventListener("keydown",d.tecla,true);
  if(d.raiz.parentNode) d.raiz.parentNode.removeChild(d.raiz);
  try{ if(d.focoAnterior && d.focoAnterior.focus) d.focoAnterior.focus(); }catch(e){}
  d.resolver(resposta);
}

function abrirDialogo(texto, opcoes){
  opcoes=opcoes||{};
  /* Um dialogo por vez: o anterior se resolve como recusa, nunca como
     confirmacao acidental de algo que a pessoa nao chegou a ler. */
  if(_dialogoAberto) fecharDialogo(false);

  var raiz=document.createElement("div");
  raiz.className="dialogo-fundo";
  raiz.setAttribute("role","dialog");
  raiz.setAttribute("aria-modal","true");
  raiz.setAttribute("aria-label",opcoes.rotulo||"Aviso da casa");

  var botoes=opcoes.pergunta
    ? '<button class="btn btn-fantasma" data-resposta="nao">'+esc(opcoes.recusar||"Voltar")+'</button>'+
      '<button class="btn '+(opcoes.perigo?"btn-perigo":"btn-ambar")+'" data-resposta="sim">'+esc(opcoes.aceitar||"Confirmar")+'</button>'
    : '<button class="btn btn-ambar" data-resposta="sim">'+esc(opcoes.aceitar||"Entendi")+'</button>';

  raiz.innerHTML='<div class="dialogo-card'+(opcoes.perigo?" perigo":"")+'">'+
    '<p class="dialogo-texto">'+esc(texto)+'</p>'+
    '<div class="dialogo-botoes">'+botoes+'</div></div>';

  raiz.addEventListener("click",function(ev){
    var b=ev.target.closest&&ev.target.closest("[data-resposta]");
    if(b) fecharDialogo(b.dataset.resposta==="sim");
    else if(ev.target===raiz && opcoes.pergunta) fecharDialogo(false);
  });

  var resolver;
  var promessa=new Promise(function(res){ resolver=res; });

  function tecla(ev){
    if(ev.key==="Escape"){ ev.preventDefault(); fecharDialogo(false); return; }
    if(ev.key!=="Tab") return;
    /* Armadilha de foco: sem isto o Tab sai do dialogo e passeia pela
       tela de tras, que continua no DOM. */
    var focaveis=raiz.querySelectorAll("button");
    if(!focaveis.length) return;
    var primeiro=focaveis[0], ultimo=focaveis[focaveis.length-1];
    if(ev.shiftKey && document.activeElement===primeiro){ ev.preventDefault(); ultimo.focus(); }
    else if(!ev.shiftKey && document.activeElement===ultimo){ ev.preventDefault(); primeiro.focus(); }
  }

  _dialogoAberto={raiz:raiz,resolver:resolver,tecla:tecla,focoAnterior:document.activeElement};
  document.body.appendChild(raiz);
  document.addEventListener("keydown",tecla,true);

  var inicial=raiz.querySelector('[data-resposta="'+(opcoes.pergunta?"nao":"sim")+'"]');
  if(inicial) setTimeout(function(){ try{ inicial.focus(); }catch(e){} },30);

  return promessa;
}

/* Aviso simples. Não bloqueia: quem chama segue em frente. */
function avisa(texto, opcoes){
  return abrirDialogo(texto, opcoes||{});
}

/* Pergunta de sim ou não. Devolve Promise<boolean>, então quem chama
   precisa de `await` — todos os antigos confirm() já eram async. */
function confirmar(texto, opcoes){
  return abrirDialogo(texto, Object.assign({pergunta:true}, opcoes||{}));
}

/* ---------- QR da sala ----------
   Gerado aqui dentro, em SVG. Antes vinha de api.qrserver.com: servico de
   terceiros, sem SLA, no caminho pelo qual as pessoas entram na mesa — e o
   link da sala saia do dominio a cada geracao. Se por algum motivo a
   geracao falhar, o codigo de 6 caracteres continua na tela logo acima, e
   e por ele que da para entrar. */
function qrSvg(link, rotulo){
  try{
    return MosaicoQR.svg(link, { nivel:"M", margem:2, rotulo:rotulo||"QR da sala",
                                 fundo:"#ffffff", tinta:"#05070c" });
  }catch(e){
    console.error("qrSvg", e);
    return '<div class="qr-falhou">QR indispon&iacute;vel &mdash; use o c&oacute;digo</div>';
  }
}

/* ---------- utilidades ---------- */
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function gerarCodigo(){
  var chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", c="";
  for(var i=0;i<6;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function gerarCodigoDiferente(anterior){
  var codigo=gerarCodigo();
  while(codigo===anterior) codigo=gerarCodigo();
  return codigo;
}
function linkDaSala(codigo){
  var u=new URL(window.location.href);
  u.searchParams.set("sala",codigo);
  u.hash="";
  return u.toString();
}
function novoId(){
  return "j_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);
}
function personagemPor(id){
  for(var i=0;i<PERSONAGENS.length;i++) if(PERSONAGENS[i].id===id) return PERSONAGENS[i];
  return null;
}
function ordenados(lista){
  return (lista||[]).slice().sort(function(a,b){
    return (a.entrouMs||0)-(b.entrouMs||0);
  });
}

/* Herdado do Learning-lab: em file:// o QR aponta para um endereco que
   nenhum outro aparelho alcanca. E a causa mais comum de "QR nao funciona". */
function avisoLocal(){
  var loc=window.location||{}, p=loc.protocol||"", h=loc.hostname||"";
  if(p!=="http:" && p!=="https:"){
    return '<div class="aviso"><b>Esta p&aacute;gina est&aacute; aberta como arquivo local.</b> '+
           'O QR e o link apontam para um endere&ccedil;o que s&oacute; existe neste aparelho. '+
           'Publique no GitHub Pages antes de usar com a mesa.</div>';
  }
  /* localhost tambem quebra o QR: no celular, "localhost" e o PROPRIO celular.
     Este era o caso mais comum de "le o QR e nao entra".                      */
  if(h==="localhost" || h==="127.0.0.1" || h==="[::1]"){
    return '<div class="aviso"><b>O endere&ccedil;o &eacute; localhost.</b> '+
           'Ao ler o QR, o celular tenta abrir <i>o pr&oacute;prio celular</i> &mdash; '+
           'e n&atilde;o acha nada. Publique no GitHub Pages para a mesa funcionar.</div>';
  }
  /* IP de rede local funciona entre aparelhos no mesmo Wi-Fi, mas nao fora dele
     e o Firebase exige o dominio autorizado. */
  if(/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h)){
    return '<div class="aviso"><b>Endere&ccedil;o de rede local.</b> '+
           'S&oacute; funciona para quem estiver no mesmo Wi-Fi, e o Firebase pode recusar '+

function carregarVozNivel(chave){
  if(!_audioNivel||!ARQUIVOS_VOZ_NIVEL[chave])return Promise.resolve(null);
  if(_vozesNivel[chave])return _vozesNivel[chave];
  _vozesNivel[chave]=fetch(ARQUIVOS_VOZ_NIVEL[chave]).then(function(r){
    if(!r.ok)throw new Error("Áudio não encontrado: "+ARQUIVOS_VOZ_NIVEL[chave]);
    return r.arrayBuffer();
  }).then(function(dados){return _audioNivel.decodeAudioData(dados);}).catch(function(e){
    console.warn("voz de fase",chave,e);delete _vozesNivel[chave];return null;
  });

function prepararVozesNivel(){

}
function tocarVozDeNivel(chave,atraso,aoTerminar){
  if(!souMestreDaMesa()||partidaPausada())return;
  habilitarAudioNivel();
  if(!_audioNivel||_audioNivel.state!=="running")return;
  carregarVozNivel(chave).then(function(buffer){
    if(!buffer||!_audioNivel||_audioNivel.state!=="running"){
      if(typeof aoTerminar==="function")aoTerminar();
      return;
    }
    var fonte=_audioNivel.createBufferSource(), ganho=_audioNivel.createGain();
    fonte.buffer=buffer;ganho.gain.value=.92;
    fonte.connect(ganho);ganho.connect(_audioNivel.destination);
    if(typeof aoTerminar==="function"){
      fonte.onended=function(){aoTerminar();};
    }
    fonte.start(_audioNivel.currentTime+Math.max(0,Number(atraso)||0));
  });
}
function tocarAberturaComAmbiente(aoTerminar){
  if(!souMestreDaMesa()||partidaPausada()){
    if(typeof aoTerminar==="function")aoTerminar();
    return;
  }
  habilitarAudioNivel();
  if(!_audioNivel||_audioNivel.state!=="running"){
    if(typeof aoTerminar==="function")aoTerminar();
    return;
  }
  Promise.all([
    carregarVozNivel("tempestade"),
    carregarVozNivel("abertura"),
    carregarVozNivel("chuva")
  ]).then(function(buffers){
    if(!_audioNivel||_audioNivel.state!=="running"){
      if(typeof aoTerminar==="function")aoTerminar();
      return;
    }
    function prepararFonte(buffer,volume,repetir){
      if(!buffer)return null;
      var fonte=_audioNivel.createBufferSource(), ganho=_audioNivel.createGain();
      fonte.buffer=buffer;fonte.loop=!!repetir;ganho.gain.value=volume;
      fonte.connect(ganho);ganho.connect(_audioNivel.destination);
      return fonte;
    }
    var trovao=prepararFonte(buffers[0],.10,true);
    var abertura=prepararFonte(buffers[1],1.0,false);
    var chuva=prepararFonte(buffers[2],.06,true);
    function pararAmbiente(){
      [trovao,chuva].forEach(function(fonte){if(fonte){try{fonte.stop();}catch(e){}}});
    }
    if(!abertura){
      pararAmbiente();
      if(typeof aoTerminar==="function")aoTerminar();
      return;
    }
    abertura.onended=function(){
      pararAmbiente();
      if(typeof aoTerminar==="function")aoTerminar();
    };
    var inicio=_audioNivel.currentTime+.08;
    if(trovao)trovao.start(inicio);
    if(chuva)chuva.start(inicio);
    abertura.start(inicio);
  });

function emitirSomDeNivel(){
  habilitarAudioNivel();
  if(!_audioNivel||_audioNivel.state!=="running") return;
  var agora=_audioNivel.currentTime;

  /* Sirene de nevoeiro: 1,2 s + 2 s de intervalo + 1,2 s = 4,4 s.
     O fundamental cria distância; os harmônicos mantêm o som audível no celular. */
  function chamadaDeNevoeiro(inicio){
    [[110,.055,"sine"],[220,.036,"triangle"],[330,.014,"sine"]].forEach(function(parcial){
      var osc=_audioNivel.createOscillator(), ganho=_audioNivel.createGain();
      osc.type=parcial[2];
      osc.frequency.setValueAtTime(parcial[0]*.985,inicio);
      osc.frequency.exponentialRampToValueAtTime(parcial[0],inicio+.24);
      osc.frequency.exponentialRampToValueAtTime(parcial[0]*.975,inicio+1.2);
      ganho.gain.setValueAtTime(.0001,inicio);
      ganho.gain.exponentialRampToValueAtTime(parcial[1],inicio+.16);
      ganho.gain.setValueAtTime(parcial[1],inicio+.78);
      ganho.gain.exponentialRampToValueAtTime(.0001,inicio+1.2);
      osc.connect(ganho);ganho.connect(_audioNivel.destination);
      osc.start(inicio);osc.stop(inicio+1.2);
    });
  }

  chamadaDeNevoeiro(agora);
  chamadaDeNevoeiro(agora+3.2);
}
function verificarTrocaDeNivel(fase){
  /* Um unico emissor evita o eco de varios celulares recebendo o snapshot em tempos diferentes. */

  if(fase==="resultado"){_nivelSonoroAnterior="resultado";return;}
  var voz=vozDaFase(fase), atual=fase==="cooperacao"?"mosaico":(fase==="constelacao"?(fase+":"+voz):fase);
  if(!atual) return;
  if(_nivelSonoroAnterior===null){_nivelSonoroAnterior=atual;return;}
  if(atual!==_nivelSonoroAnterior){
    _nivelSonoroAnterior=atual;
    if(fase==="encenacao"){

function dadosAutomacao(){
  var fase=(STATE.doc&&STATE.doc.fase)||"", cfg=(CASO.configuracao&&CASO.configuracao.limitesSegundos)||{};
  if(fase==="votacao") return {fase:fase,recebidos:STATE.votos.length,total:STATE.jogadores.length,inicio:STATE.doc.votacaoAbertaMs||0,limite:(cfg.performance||60)*1000,acao:abrirInclinacao};
  if(fase==="inclinacao") return {fase:fase,recebidos:tarefasConcluidas('inclinacao').length,total:STATE.jogadores.length,inicio:STATE.doc.inclinacaoAbertaMs||0,limite:(cfg.inclinacao||180)*1000,acao:abrirConstelacao};
  if(fase==="constelacao") return {fase:fase,recebidos:tarefasConcluidas('constelacao').length,total:STATE.jogadores.length,inicio:STATE.doc.constelacaoAbertaMs||0,limite:(cfg.constelacao||180)*1000,acao:prepararMosaico};
  if(fase==="mercado") return {fase:fase,recebidos:0,total:1,inicio:STATE.doc.mercadoAbertoMs||0,limite:(cfg.mercado||480)*1000,acao:abrirDeducao,somentePrazo:true};
  if(fase==="deducao") return {fase:fase,recebidos:STATE.v5.deducoes.length,total:STATE.jogadores.length,inicio:STATE.doc.deducaoAbertaMs||0,limite:(cfg.deducao||300)*1000,acao:finalizarPartida};
  return null;
}
async function verificarAutomacoes(){
  if(!souMestreDaMesa()||ritmoConduzido()||partidaPausada()) return;
  var d=dadosAutomacao(), fase=(STATE.doc&&STATE.doc.fase)||"";
  if(_autoFasePendente&&_autoFasePendente!==fase) _autoFasePendente=null;
  if(!d||_autoFasePendente===d.fase||!d.total) return;
  var prazoTerminou=d.inicio&&Date.now()>=d.inicio+d.limite;
  if(d.somentePrazo&&!prazoTerminou) return;
  if(!d.somentePrazo&&d.recebidos<d.total&&!prazoTerminou) return;
  _autoFasePendente=d.fase;
  try{await d.acao();}catch(e){_autoFasePendente=null;console.error("automação da fase",e);}
}
async function verificarEncontroFragmentos(){
  if(_liberandoFragmentos||!souMestreDaMesa()||ritmoConduzido()||partidaPausada()||!STATE.doc||STATE.doc.fase!=="mosaico"||STATE.doc.fragmentosLiberados) return;
  var total=STATE.jogadores.length, prontos=fragmentosConfirmados();
  if(!total||prontos<total) return;
  _liberandoFragmentos=true;
  try{
    var FB=await esperarFB();
    await FB.atualizarMesa(STATE.mesa.codigo,{fragmentosLiberados:true,fragmentosLiberadosMs:Date.now()});
  }catch(e){console.error("liberar Fragmentos",e);}
  finally{_liberandoFragmentos=false;}
}
function totalFragmentos(){
  return new Set(STATE.jogadores.map(function(j){return j.nucleo;}).filter(Boolean)).size;
}
function fragmentosComTarefaConcluida(){
  return STATE.v5.nucleos.filter(function(n){return n.concluidoEm;}).length;
}
function jogadoresComCooperacaoConcluida(){
  return STATE.jogadores.filter(function(j){
    var tamanho=STATE.jogadores.filter(function(x){return x.nucleo===j.nucleo;}).length;
    return tamanho===2||STATE.v5.cooperacao.some(function(v){return v.de===j.id;});
  }).length;
}
async function verificarEtapasColetivas(){
  if(!souMestreDaMesa()||ritmoConduzido()||partidaPausada()||_autoFasePendente||!STATE.doc) return;
  var fase=STATE.doc.fase, pronto=false, acao=null;
  if(fase==="mosaico"&&STATE.doc.fragmentosLiberados){
    pronto=totalFragmentos()>0&&fragmentosComTarefaConcluida()>=totalFragmentos();
    acao=STATE.jogadores.length<=3?abrirMercado:abrirVotoCooperacao;
  }else if(fase==="cooperacao"){
    pronto=STATE.jogadores.length>0&&jogadoresComCooperacaoConcluida()>=STATE.jogadores.length;acao=abrirMercado;
  }
  if(!pronto||!acao) return;
  _autoFasePendente=fase;
  try{await acao();}catch(e){_autoFasePendente=null;console.error("automação coletiva",e);}
}
async function liberarTarefaFragmentos(){
  if(!souMestreDaMesa()||!STATE.doc||STATE.doc.fase!=="mosaico") return;
  var FB=await esperarFB();
  await FB.atualizarMesa(STATE.mesa.codigo,{fragmentosLiberados:true,fragmentosLiberadosMs:Date.now()});
}
function agendarAutomacoes(){
  if(!souMestreDaMesa()) return;
  if(partidaPausada()){
    if(_autoTimer)clearTimeout(_autoTimer);_autoTimer=null;_autoTimerChave="";
    return;
  }
  verificarEncontroFragmentos();
  verificarEtapasColetivas();
  var d=dadosAutomacao();
  if(!d){if(_autoTimer)clearTimeout(_autoTimer);_autoTimer=null;_autoTimerChave="";return;}
  verificarAutomacoes();
  if(!d.inicio||(!d.somentePrazo&&d.recebidos>=d.total)||ritmoConduzido()) return;
  var chave=d.fase+":"+d.inicio;
  if(_autoTimerChave===chave) return;
  if(_autoTimer)clearTimeout(_autoTimer);
  _autoTimerChave=chave;
  _autoTimer=setTimeout(function(){_autoTimer=null;_autoTimerChave="";verificarAutomacoes();},Math.max(0,d.inicio+d.limite-Date.now())+100);
}

function orientacaoCaso(fase){
  var js=ordenados(STATE.jogadores), atual=js[(STATE.doc&&STATE.doc.vez)||0];
  if(fase==="sala") return souPronto()?"Você está pronto. Aguarde o início da partida.":"Confirme que está pronto para participar.";
  if(fase==="encenacao") return atual&&STATE.eu&&atual.id===STATE.eu.id?"Leia sua instrução no celular, proteja a tela e faça sua apresentação.":"Proteja sua tela, observe o ambiente e escute os sons.";
  if(fase==="votacao") return "Registre seu voto de Performance. Você não pode votar em si.";
  if(fase==="constelacao") return "Ative o movimento e conclua "+nomeTarefaSensor("constelacao")+".";
  if(fase==="inclinacao") return "Ative o movimento e conclua A Janela do Norte.";
  if(fase==="mosaico"){
    var n=STATE.jogadores.length;
    if(n===1) return "Você é o Portador do Fragmento. Consulte o Arquivo e organize os acontecimentos na ordem correta.";
    if(n<=3) return "Todos fazem parte do mesmo Fragmento. Organizem juntos os acontecimentos; qualquer integrante pode selecionar e enviar.";
    return "Encontre as telas da mesma cor e junte-se ao seu Fragmento para reconstruir os acontecimentos.";
  }
  if(fase==="cooperacao") return "Registre em segredo quem mais colaborou com o seu Fragmento.";
  if(fase==="mercado") return "Avalie as ofertas. Comprar, vender ou recusar são decisões possíveis.";
  if(fase==="deducao") return "Complete sua acusação final. Depois de enviar, a resposta não poderá ser alterada.";
  if(fase==="resultado") return etapaRevelacao()<4?"Acompanhe a reconstrução final do caso.":"Confira o placar final da investigação.";
  return "Acompanhe as instruções desta rodada.";
}

   TELAS

var _faseRolagem=null;
function limparBarraInferior(){
  var barra=document.getElementById("barra-jogo");
  if(!barra)return;
  barra.querySelectorAll(".btn-caso,.btn-menu-mestre").forEach(function(el){el.remove();});
}
function organizarBarraInferior(){
  var barra=document.getElementById("barra-jogo"), app=document.getElementById("app");
  if(!barra||!app)return;
  var caso=app.querySelector(".btn-caso"), sala=app.querySelector(".btn-menu-mestre");
  if(caso)barra.appendChild(caso);
  if(sala)barra.appendChild(sala);
}
function render(forcar){
  var app=document.getElementById("app");
  limparBarraInferior();
  var esperandoPronto = STATE.tela==="esperando" && !souPronto();
  app.className = (STATE.tela==="painel") ? "largo"
                : (STATE.tela==="inicio") ? "capa"
                : (STATE.tela==="esperando") ? "espera" : "";
  document.body.classList.toggle("t-espera", esperandoPronto);
  document.body.classList.toggle("t-pronto", STATE.tela==="esperando" && !esperandoPronto);
  if(typeof desenhaPistas==="function") desenhaPistas();
  /* toggle em vez de sobrescrever: com-video precisa sobreviver ao render */
  document.body.classList.toggle("t-painel", STATE.tela==="painel");
  document.body.classList.toggle("t-inicio", STATE.tela==="inicio");
  document.body.classList.toggle("t-entrar", STATE.tela==="entrar");
  document.body.classList.toggle("modo-sem-telao", modoAtual()==="sem-telao");
  /* enquanto a sala espera, o painel continua com o video */
  var faseAgora=(STATE.doc&&STATE.doc.fase)||"sala";
  var faseMudou=!!STATE.eu&&_faseRolagem!==faseAgora;
  if(STATE.eu)_faseRolagem=faseAgora;
  if(partidaPausada()){
    if(_timerContagem)clearInterval(_timerContagem);
    _timerContagem=null;STATE.contando=0;
  }
  verificarTrocaDeNivel(faseAgora);
  if(encerramentoPendente())sincronizarAudioEncerramento();
  else if(_fonteEncerramento||_timerEncerramento)pararAudioEncerramento();
  var encenacaoPassiva=false;
  if(STATE.eu&&STATE.tela==="encenacao"&&faseAgora==="encenacao"){
    var ordemEncenacao=ordenados(STATE.jogadores), atorEncenacao=ordemEncenacao[(STATE.doc&&STATE.doc.vez)||0];
    encenacaoPassiva=introducaoEncenacaoPendente()||
      (!!atorEncenacao&&atorEncenacao.id!==STATE.eu.id);
  }
  document.body.classList.toggle("fase-sala",
    STATE.tela==="painel" && faseAgora==="sala");
  document.body.classList.toggle("fase-sensor",
    STATE.tela==="constelacao" || STATE.tela==="inclinacao");
  document.body.classList.toggle("painel-em-jogo",
    STATE.tela==="painel" && faseAgora!=="sala" && faseAgora!=="resultado");
  document.body.classList.toggle("resultado-podio",
    STATE.tela==="painel" && faseAgora==="resultado" && etapaRevelacao()>=4);
  document.body.classList.toggle("encenacao-passiva",encenacaoPassiva);
  var emBuscaFragmento=STATE.tela==="mosaico"&&faseAgora==="mosaico"&&!(STATE.doc&&STATE.doc.fragmentosLiberados);
  document.body.classList.toggle("busca-fragmento",emBuscaFragmento);
  document.body.classList.toggle("mosaico-reconstrucao",
    STATE.tela==="mosaico"&&faseAgora==="mosaico"&&!!(STATE.doc&&STATE.doc.fragmentosLiberados));
  for(var corFragmento=1;corFragmento<=4;corFragmento++){
    document.body.classList.toggle("fragmento-cor-"+corFragmento,
      emBuscaFragmento&&meuJogador()&&Number(meuJogador().nucleo)===corFragmento);
  }
  /* Os snapshots do Firebase podem chegar várias vezes durante uma rodada.
     Recriar o iframe a cada snapshot descarrega o módulo, perde a permissão
     do sensor e devolve o jogador à introdução. Enquanto a mesma tarefa
     continua aberta, preservamos o iframe já iniciado. */
  var tipoSensor=(STATE.tela==="constelacao"||STATE.tela==="inclinacao")?STATE.tela:"";
  var frameSensor=tipoSensor&&app.querySelector('iframe.tarefa-frame[data-tarefa="'+tipoSensor+'"]');
  var sensorConcluido=tipoSensor&&(STATE.v5.tarefas||[]).some(function(t){
    return t.id===((STATE.eu&&STATE.eu.id)+'_'+tipoSensor)&&tarefaConcluida(t);
  });
  if(!forcar&&frameSensor&&!sensorConcluido){
    sincronizarControleTarefa(frameSensor,tipoSensor);
    var pausaExistente=app.querySelector('.partida-pausada');
    if(partidaPausada()&&!pausaExistente)app.insertAdjacentHTML('beforeend',painelPartidaPausada());
    else if(!partidaPausada()&&pausaExistente)pausaExistente.remove();
    if(faseMudou)requestAnimationFrame(function(){window.scrollTo(0,0);});
    agendarAutomacoes();
    return;
  }
  var h="";
  switch(STATE.tela){
    case "inicio":      h=telaInicio(); break;
    case "reconectando":h=telaReconectando(); break;
    case "entrar":      h=telaEntrar(); break;
    case "painel":      h=telaPainel(); break;
    case "esperando":   h=telaEsperando(); break;
    case "encenacao":   h=telaEncenacao(); break;
    case "revelacao":   h=telaRevelacao(); break;
    case "encerrada":   h=telaEncerrada(); break;
    case "votacao":     h=telaVotacao(); break;
    case "constelacao": h=telaTarefaSensor("constelacao"); break;
    case "inclinacao":  h=telaTarefaSensor("inclinacao"); break;
    case "mosaico":     h=telaMosaico(); break;
    case "cooperacao":  h=telaCooperacao(); break;
    case "mercado":     h=telaMercado(); break;
    case "deducao":     h=telaDeducao(); break;
    case "resultado":   h=telaResultado(); break;
    default:            h=telaInicio();
  }
  if(STATE.eu&&!encenacaoPassiva){
    h=cabecalhoRodada((STATE.doc&&STATE.doc.fase)||"sala","rodada-celular")+h;
    if(modoAtual()==="sem-telao") h+=muralColetivoMovel();
  }
  if(STATE.eu&&!encenacaoPassiva) h+=painelCasoMovel();
  if(souMestreDaMesa()&&((STATE.eu&&modoAtual()==="sem-telao")||(STATE.tela==="painel"&&faseAgora==="resultado"&&etapaRevelacao()>=4))) h+=controlesMestreMovel();
  if(souMestreDaMesa()) h+=modalOrientacaoMestre();
  if(STATE.eu) h+=modalOrientacaoParticipante();
  h+=painelPartidaPausada();
  app.innerHTML=h;
  if(tipoSensor&&!sensorConcluido)sincronizarControleTarefa(app.querySelector('iframe.tarefa-frame[data-tarefa="'+tipoSensor+'"]'),tipoSensor);
  organizarBarraInferior();
  if(faseMudou)requestAnimationFrame(function(){window.scrollTo(0,0);});
  iniciarApuracaoSeNecessario();
  agendarAutomacoes();
}

function abrirAberturaParticipante(aoConcluir){
  var caixa=document.getElementById("abertura-participante");
  var video=document.getElementById("video-abertura-participante");
  var assistir=document.getElementById("btn-assistir-participante");
  var pular=document.getElementById("btn-pular-participante");
  if(!caixa||!video){ if(aoConcluir)aoConcluir(); return; }

  var terminou=false, urlTemporaria="";
  function concluir(){
    if(terminou) return;
    terminou=true;
    video.pause();
    if(urlTemporaria){try{URL.revokeObjectURL(urlTemporaria);}catch(e){} urlTemporaria="";}
    video.onended=video.onerror=null;
    caixa.classList.remove("tocando");
    caixa.classList.add("hidden");
    caixa.setAttribute("aria-hidden","true");
    if(aoConcluir) aoConcluir();
  }
  function prontoParaTentar(){
    assistir.disabled=false;
    assistir.textContent="Assistir à abertura";
  }
  function erroAoTocar(){
    /* Se o Safari recusar o play programático, revela o controle nativo:
       um segundo toque diretamente no vídeo continua sendo possível. */
    caixa.classList.add("tocando");
    video.controls=true;
    prontoParaTentar();
    avisa("Toque no botão de reprodução exibido no centro do vídeo.");
  }
  function tocar(){
    /* No Safari móvel, pedir tela cheia antes de play() pode consumir o
       gesto que libera mídia com som. A própria camada já ocupa a tela. */
    assistir.disabled=true;
    assistir.textContent="Iniciando…";
    video.playsInline=true;
    video.setAttribute("playsinline","");
    video.setAttribute("webkit-playsinline","");
    video.muted=false;
    video.defaultMuted=false;
    video.volume=1;
    try{video.currentTime=0;}catch(e){}
    var promessa;
    try{ promessa=video.play(); }catch(e){ erroAoTocar(); return; }
    if(promessa&&promessa.then){
      promessa.then(function(){ caixa.classList.add("tocando"); prontoParaTentar(); })
              .catch(erroAoTocar);
    }else{
      caixa.classList.add("tocando");
      prontoParaTentar();
    }
  }

  /* A orientacao em que a abertura comecou escolhe o arquivo. Girar o
     aparelho durante a reproducao nao reinicia nem troca o video. */
  var vertical=false;
  try{vertical=window.matchMedia("(orientation: portrait)").matches;}catch(e){
    vertical=window.innerHeight>window.innerWidth;
  }
  video.onended=concluir;
  assistir.onclick=tocar;
  pular.onclick=concluir;
  assistir.disabled=true;
  assistir.textContent="Carregando vídeo…";
  caixa.classList.remove("tocando","hidden");
  caixa.setAttribute("aria-hidden","false");

  var arquivo=(vertical?"img/abertura-vertical.mp4":"img/abertura.mp4")+"?v="+window.MOSAICO_VERSAO;
  function carregarDireto(){
    video.onerror=erroAoTocar;
    video.src=arquivo;
    video.load();
    prontoParaTentar();
  }
  if(vertical&&window.fetch&&window.URL&&URL.createObjectURL){
    /* No iPhone, baixar o MP4 curto por inteiro antes do toque evita
       falhas de streaming/range do Safari. O play continua no gesto. */
    fetch(arquivo,{cache:"no-store"})
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.blob();})
      .then(function(blob){
        if(terminou)return;
        if(!blob||blob.size<100000)throw new Error("Vídeo incompleto");
        urlTemporaria=URL.createObjectURL(blob);
        video.onerror=erroAoTocar;
        video.src=urlTemporaria;
        video.load();
        prontoParaTentar();
      })
      .catch(function(){if(!terminou)carregarDireto();});
  }else carregarDireto();
}

function telaPainel(){
  var m=STATE.mesa;
  if(!m) return telaInicio();
  var js=ordenados(STATE.jogadores);
  var fase=(STATE.doc&&STATE.doc.fase)||"sala";
  if(fase==="resultado"){
    var etapa=etapaRevelacao(), controle=encerramentoPendente()
      ? (souMestreDaMesa()?'<div class="controle-revelacao"><button class="btn btn-frio" onclick="concluirEncerramento()">Pular narração</button></div>':'')
      : etapa<4
      ? '<div class="controle-revelacao"><button class="btn btn-ambar" onclick="avancarRevelacao()">'+esc(rotuloProximaRevelacao(etapa))+'</button></div>'
      : '';
    return cabecalhoRodada(fase)+'<div class="revelacao-final">'+telaResultado()+controle+'</div>';
  }
  var grade="";

  if(!js.length){
    grade='<div class="vazio">Ningu&eacute;m chegou ainda.<br>'+
          'Os cart&otilde;es aparecem quando algu&eacute;m entra pelo QR.</div>';
  } else {
    for(var i=0;i<js.length;i++){
      var j=js[i], p=personagemPor(j.personagem);
      var vezAtual=(STATE.doc&&STATE.doc.vez)||0;
      var atuando=(fase==="encenacao" && i===vezAtual);
      /* o personagem so aparece no telao depois que aquela pessoa ja
         atuou — antes disso e segredo, inclusive dela mesma */
      var jaRevelado=(fase!=="sala" && fase!=="escuro") &&
                     (fase!=="encenacao" || i<vezAtual);
      var st=atuando?"atuando":(j.status==="pronto"?"pronto":"");
      var est=atuando?"Agora":(jaRevelado?"J&aacute; passou":"Na casa");
      /* A pessoa some de vez. Depois da primeira tarefa o cartao passa a
         ser so o arquetipo — quem era quem vira memoria da mesa, e isso
         e fator de confusao na deducao, nao descuido.                  */
      var titulo = jaRevelado&&p ? nomePers(p, j.forma) : j.nome;
      var sub    = "";
      grade+='<div class="jog st-'+st+'">'+
        '<div class="av">'+(jaRevelado&&p?p.av:"🕯️")+'</div>'+
        '<div class="nm">'+esc(titulo)+'</div>'+
        '<div class="pers">'+(sub?esc(sub):"&mdash;")+'</div>'+
        '<div class="est">'+est+'</div>'+
        (fase==="resultado"?'<div class="pt">'+(j.total||0)+'</div>':'')+
      '</div>';
    }
  }
  /* No telão, a encenação não identifica nem destaca quem está falando.
     O celular da própria pessoa continua sendo o único indicador da vez. */
  if(fase==="encenacao"){
    grade='<div class="vazio" style="font-family:var(--serif);font-size:clamp(25px,4vw,42px);line-height:1.35">Observe o ambiente<br>e escute os sons!</div>';
  }

  /* relogio da casa: avanca com as interpretacoes concluidas */
  var pubs=(STATE.publicas||[]).slice().sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});
  var hora=HORA_FASE[fase];
  if(hora===null) hora = pubs.length ? pubs[pubs.length-1].hora : "21:00";
  var cap=fase==="constelacao"?nomeTarefaSensor("constelacao"):CAP_FASE[fase];
  var relogio='<div class="relogio"><div class="hh">'+esc(hora)+'</div>'+
              '<div class="cap">'+esc(cap||"")+'</div></div>';

  var mural="";
  if(!pubs.length){
    mural='<div class="mural-feed"><div class="mural-trilho"><div class="publicas-vazio">A casa ainda n&atilde;o mostrou nada.<br>'+
          'As linhas v&atilde;o aparecendo sozinhas.</div></div></div>';
  } else {
    var itensMural="";
    for(var m=0;m<pubs.length;m++){
      var pu=pubs[m];
      itensMural+='<div class="publica"><span class="ph">'+esc(pu.hora)+'</span>'+
             '<div class="pt">'+esc(pu.txt)+'</div>'+
             '<div class="pq">fragmento revelado</div></div>';
    }
    mural='<div class="mural-feed"><div class="mural-trilho">'+itensMural+'</div></div>';
  }

  var acao="";
  if(fase==="sala"){
    /* Quem abriu a mesa e o ultimo gate: mesmo com todos prontos, o inicio
       so acontece quando ele libera — assim da para esperar atrasados.
       O rotulo nao entrega o que vem; a tarefa e surpresa.             */
    var prontos=contaProntos();
    var todosProntos = js.length>=1 && prontos===js.length;
    acao='<button class="btn btn-ambar" '+(todosProntos?'':'disabled')+
         ' onclick="iniciarEncenacao()">Come&ccedil;ar o jogo</button>'+

         (js.length<1 ? 'Aguardando participante.'
                      : prontos+' de '+js.length+' prontos'+
                        (todosProntos?' &mdash; pode come&ccedil;ar quando quiser.'
                                     :'. Esperando os que faltam.'))+
         '</p>';
  } else if(fase==="encenacao"){
    acao='<button class="btn" onclick="pularVez()">Pular a apresenta&ccedil;&atilde;o atual</button>';
  } else if(fase==="votacao"){

  } else if(fase==="constelacao"||fase==="inclinacao"){

  } else if(fase==="mosaico"){
    acao='<div class="card"><span class="eyebrow">Mosaico coletivo</span><p class="muted">'+STATE.v5.nucleos.filter(function(n){return n.concluidoEm;}).length+' Fragmento(s) conclu&iacute;do(s).</p></div><button class="btn btn-ambar" onclick="abrirVotoCooperacao()">Encerrar mosaico e abrir voto interno</button>';
  } else if(fase==="cooperacao"){
    acao='<div class="card"><span class="eyebrow">Voto interno cego</span><p class="muted">'+STATE.v5.cooperacao.length+' voto(s) recebidos. Os nomes e o resultado permanecem ocultos.</p></div><button class="btn btn-ambar" onclick="abrirMercado()">Encerrar voto e abrir Mercado Cego</button>';
  } else if(fase==="mercado"){

  } else if(fase==="deducao"){
    acao='<div class="card"><span class="eyebrow">Dedu&ccedil;&atilde;o final</span><p class="muted">'+STATE.v5.deducoes.length+' de '+js.length+' respostas enviadas. O placar ser&aacute; calculado automaticamente.</p></div>';
  } else if(fase==="resultado"){
    acao='<button class="btn btn-frio" onclick="voltarParaSala()">Voltar &agrave; sala</button>';
  }

  return cabecalhoRodada(fase)+'<div class="barra">'+
      '<span class="conta">'+js.length+' na mesa</span>'+
      '<span class="selo ok">'+(modoAtual()==="sem-telao"?'Sem tel&atilde;o':'Com tel&atilde;o')+'</span>'+
      '<span class="selo '+(m.fb?"ok":"esperando")+'">'+(m.fb?"Ao vivo":"Conectando…")+'</span>'+
      '<span class="dir">'+

        '<div class="grade grade-painel">'+grade+'</div><div class="acao-painel">'+acao+'</div></div>'+
      '<div class="painel-pistas"><span class="eyebrow">Pistas gerais</span>'+mural+'</div>'+
    '</div>'+

/* O personagem e segredo ate a hora. Nem o proprio jogador sabe quem
   pegou: ele recebe a rubrica e a fala, interpreta, e so depois descobre. */
function souPronto(){
  if(!STATE.eu) return false;
  for(var i=0;i<STATE.jogadores.length;i++)
    if(STATE.jogadores[i].id===STATE.eu.id) return STATE.jogadores[i].pronto===true;
  return false;
}
function contaProntos(){
  var n=0;
  for(var i=0;i<STATE.jogadores.length;i++) if(STATE.jogadores[i].pronto===true) n++;
  return n;
}

function iniciarApuracaoSeNecessario(){
  var raiz=document.getElementById("apuracao-placar");
  if(!raiz){if(_apuracaoRAF)cancelAnimationFrame(_apuracaoRAF);_apuracaoRAF=0;return;}
  var inicio=Number(raiz.getAttribute("data-inicio"))||Date.now(), corpo=raiz.querySelector("tbody"), tema=raiz.querySelector(".apuracao-tema");
  var chave=inicio+":"+Number((STATE.doc&&STATE.doc.apuracaoRepeticao)||0);
  if(_apuracaoChave!==chave){
    _apuracaoChave=chave;_apuracaoOrdemEtapa=-2;
    if(souMestreDaMesa()&&_podioAudioChave!==chave){
      _podioAudioChave=chave;
      tocarVozDeNivel("podio",.35);
    }
  }
  function reorganizar(indice){
    if(indice===_apuracaoOrdemEtapa)return;
    _apuracaoOrdemEtapa=indice;
    var antes={};Array.from(corpo.children).forEach(function(tr){antes[tr.dataset.jogador]=tr.getBoundingClientRect().top;});
    var ordem=ordemApuracao(indice);
    ordem.forEach(function(j){var tr=corpo.querySelector('tr[data-jogador="'+j.id+'"]');if(tr)corpo.appendChild(tr);});
    Array.from(corpo.children).forEach(function(tr,i){tr.querySelector(".ap-posicao").textContent=(i+1)+"º";var dy=(antes[tr.dataset.jogador]||tr.getBoundingClientRect().top)-tr.getBoundingClientRect().top;if(dy){tr.style.transition="none";tr.style.transform="translateY("+dy+"px)";requestAnimationFrame(function(){tr.style.transition="";tr.style.transform="";});}});
  }
  function quadro(){
    if(!document.body.contains(raiz)){_apuracaoRAF=0;return;}
    var decorrido=Math.max(0,Date.now()-inicio);
    if(decorrido>=22000){
      _apuracaoRAF=0;STATE.resultadoVista="podio";
      var chaveEncerramento=inicio+":"+Number((STATE.doc&&STATE.doc.apuracaoRepeticao)||0);
      if(souMestreDaMesa()&&_encerramentoAudioChave!==chaveEncerramento){
        _encerramentoAudioChave=chaveEncerramento;
        tocarVozDeNivel("encerramento",0);
      }
      render(true);return;
    }
    var etapa=decorrido<16000?Math.min(3,Math.floor(decorrido/4000)):4;
    var local=etapa<4?decorrido-etapa*4000:decorrido-16000;
    var duracaoContagem=etapa<4?1400:1600, progresso=Math.max(0,Math.min(1,(local-600)/duracaoContagem));
    tema.textContent=CATEGORIAS_APURACAO[etapa].titulo;
    CATEGORIAS_APURACAO.forEach(function(c,i){
      document.querySelectorAll("#apuracao-placar .ap-cat-"+c.id).forEach(function(el){el.classList.toggle("visivel",i<=etapa);el.classList.toggle("ativa",i===etapa);});
    });
    Array.from(corpo.children).forEach(function(tr){
      var j=STATE.jogadores.find(function(x){return String(x.id)===String(tr.dataset.jogador);});
      CATEGORIAS_APURACAO.forEach(function(c,i){var span=tr.querySelector('[data-pontos="'+c.id+'"]');if(span)span.textContent=i<etapa?pontosCategoria(j,c):(i===etapa?Math.round(pontosCategoria(j,c)*progresso):0);});
    });
    var ordemEtapa=etapa===4?3:(local>=2000?etapa:etapa-1);
    reorganizar(ordemEtapa);
    raiz.classList.toggle("saindo",decorrido>=21200);
    _apuracaoRAF=requestAnimationFrame(quadro);
  }
  if(_apuracaoRAF)cancelAnimationFrame(_apuracaoRAF);
  _apuracaoRAF=requestAnimationFrame(quadro);
}
