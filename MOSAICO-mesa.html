<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070c">
<!-- Instalado pela "Tela de Inicio", abre sem barra nenhuma. E o unico
     jeito de ter tela cheia de verdade no iPhone, onde o Safari nao
     implementa a Fullscreen API. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icone-192.png">
<meta name="apple-mobile-web-app-title" content="MOSAICO">
<title>MOSAICO — A Casa da Costa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --breu:#05070c; --painel:#0c121a; --linha:#1b2634;
    --nevoa:#8fa3b8; --ambar:#e8a44c; --frio:#7fd4ff;
    --texto:#e6ecf2; --dim:#6d7f90; --vermelho:#e0674f;
    --serif:"Cormorant Garamond",Georgia,"Noto Serif","Times New Roman",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{
    min-height:100%;color:var(--texto);
    font-family:var(--sans);overscroll-behavior-y:none;
  }
  /* O fundo mora no html. Se o body tambem pintasse, ele cobriria o
     #arte (que fica em camada de fundo) e a arte nunca apareceria. */
  html{
    background:radial-gradient(ellipse 130% 70% at 50% 0%,#0b1119 0%,#05070c 60%) fixed,
               var(--breu);
  }
  body{background:transparent}

  /* ---------- arte-chave ----------
     capa-vertical.jpg  -> abertura no celular (o poster ja traz o nome)
     fundo-painel.jpg   -> atmosfera do painel projetado (versao sem texto) */
  #arte{
    position:fixed;inset:0;z-index:0;
    background-position:center;background-size:cover;background-repeat:no-repeat;
    opacity:0;transition:opacity 1.4s ease;
  }
  #arte::after{
    content:"";position:absolute;inset:0;
  }
  body.t-inicio #arte{
    background-image:url("img/capa-vertical.jpg");
    opacity:1;
  }
  /* video de abertura: se img/abertura.mp4 existir, cobre o poster.
     Se nao existir, o <video> some sozinho e o poster continua valendo. */
  #video-abertura{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;opacity:0;transition:opacity 1.6s ease;
  }
  /* o video segura o clima ate o jogo comecar: abertura e sala.
     Da fase seguinte em diante quem manda e o papel de parede. */
  body.t-inicio #video-abertura.tocando,
  body.t-painel.fase-sala #video-abertura.tocando{opacity:1}
  body.t-painel.fase-sala #arte{background-image:none;opacity:1}
  body.t-painel.fase-sala #arte::after{
    background:linear-gradient(180deg,
      rgba(5,7,12,.78) 0%, rgba(5,7,12,.40) 22%,
      rgba(5,7,12,.30) 60%, rgba(5,7,12,.80) 100%);
  }

  /* Cada arte na orientacao em que nasceu.
     Celular (tela vertical): o poster vertical, inteiro, com o nome no topo.
     O video e 16:9 — em 9:16 perderia ~70% da largura, entao nao entra aqui.
     Tela larga (computador / telao): o video toma a tela, proporcao bate.   */
  @media (max-aspect-ratio: 1/1){
    #video-abertura{display:none}
  }

  /* Tela larga: o video e o protagonista. O bloco de criar a mesa
     sai do centro e vai para o canto, pequeno, para nao tapar a cena. */
  @media (min-aspect-ratio: 1/1) and (min-width:820px){
    #app.capa{
      max-width:26em;margin:0 auto 0 0;
      padding-left:4vw;padding-bottom:5vh;
      background:linear-gradient(to top right,
        rgba(5,7,12,.94) 0%, rgba(5,7,12,.80) 32%,
        rgba(5,7,12,.42) 58%, transparent 82%);
    }
    #app.capa h1{font-size:clamp(13px,1.15vw,17px);letter-spacing:.34em;margin-bottom:12px}
    #app.capa .lead{font-size:clamp(16px,1.35vw,21px);line-height:1.4;margin-bottom:22px}
    #app.capa .btn{font-size:clamp(12px,.95vw,14px);padding:15px 22px;margin-bottom:9px}
    #app.capa .muted{font-size:clamp(12px,.9vw,14px);margin-top:16px}
    #app.capa .aviso{font-size:clamp(12px,.95vw,15px);padding:12px 14px}
  }
  /* veu leve so para dar unidade; quem garante a leitura e o
     degrade do proprio #app.capa, que fica por cima da arte */
  body.t-inicio #arte::after{
    background:linear-gradient(180deg,
      rgba(5,7,12,.04) 0%, rgba(5,7,12,.10) 40%, rgba(5,7,12,.22) 100%);
  }
  body.t-painel #arte{
    background-image:url("img/fundo-painel.jpg");
    opacity:.92;
  }
  /* escurece so onde ha leitura: faixa do relogio em cima, rodape embaixo.
     O meio fica limpo para a casa e o penhasco aparecerem. */
  body.t-painel #arte::after{
    background:linear-gradient(180deg,
      rgba(5,7,12,.86) 0%,
      rgba(5,7,12,.62) 16%,
      rgba(5,7,12,.34) 42%,
      rgba(5,7,12,.50) 72%,
      rgba(5,7,12,.88) 100%);
  }

  /* abertura: o poster manda, o texto ancora embaixo */
  #app.capa{
    min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;
    padding-bottom:max(34px,env(safe-area-inset-bottom));
    /* a mancha de leitura: o topo fica limpo para o nome e a tempestade,
       e a base fica solida o bastante para o texto nao brigar com o raio */
    background:linear-gradient(180deg,
      transparent 0%, rgba(5,7,12,.18) 20%, rgba(5,7,12,.72) 36%,
      rgba(5,7,12,.93) 50%, #05070c 66%);
  }
  #app.capa h1{
    font-size:clamp(15px,4vw,19px);letter-spacing:.4em;text-transform:uppercase;
    font-family:var(--sans);font-weight:600;color:var(--ambar);
    margin-bottom:16px;text-shadow:0 2px 20px rgba(0,0,0,.9);
  }
  #app.capa .lead{
    text-shadow:0 2px 24px rgba(0,0,0,.95);margin-bottom:30px;
  }
  #app.capa .eyebrow{display:none}
  #app{
    position:relative;z-index:1;
    max-width:640px;margin:0 auto;min-height:100vh;
    padding:max(24px,env(safe-area-inset-top)) 20px max(30px,env(safe-area-inset-bottom));
  }
  /* o painel e projetado: precisa de largura e de leitura a distancia */
  #app.largo{max-width:1180px;padding-left:28px;padding-right:28px}
  .painel-cols{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
  .rodada-telao{text-align:center;margin:2px auto 18px;padding:13px 22px;
    width:min(92%,820px);border:1px solid rgba(72,190,210,.65);border-radius:8px;
    background:linear-gradient(135deg,rgba(25,91,107,.9),rgba(9,35,49,.94));
    color:#bdf5ff;box-shadow:0 0 34px rgba(72,190,210,.18)}
  .rodada-telao .rotulo{display:block;font-size:clamp(10px,2vw,13px);font-weight:800;
    letter-spacing:.3em;text-transform:uppercase;color:var(--ambar);margin-bottom:5px}
  .rodada-telao .nome{display:block;font-family:var(--serif);font-size:clamp(28px,5vw,52px);
    line-height:1.05;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .rodada-celular{margin:0 auto 20px;padding:10px 14px;width:100%}
  .rodada-celular .nome{font-size:clamp(22px,7vw,32px)}
  /* Telao deitado: duas colunas lado a lado. */
  @media(min-width:900px) and (min-aspect-ratio: 1/1){
    .painel-cols{grid-template-columns:1.25fr .75fr;gap:34px}
    #app.largo .grade{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  }
  /* Telao em pe: uma coluna so, e tudo cresce — quem le esta longe. */
  @media(min-width:820px) and (max-aspect-ratio: 1/1){
    #app.largo{max-width:100%;padding-left:5vw;padding-right:5vw;
               display:flex;flex-direction:column}
    /* espalha o conteudo pela altura em vez de amontoar no topo */
    .painel-cols{grid-template-columns:1fr;gap:5vh;flex:1;align-content:space-between}
    #app.largo .grade{grid-template-columns:repeat(auto-fit,minmax(15vw,1fr));gap:1.6vw}
    #app.largo .relogio .hh{font-size:11vw}
    #app.largo .relogio .cap{font-size:1.7vw;letter-spacing:.3em}
    #app.largo .eyebrow{font-size:1.7vw}
    #app.largo .jog .av{font-size:5vw}
    #app.largo .jog .nm{font-size:2.2vw}
    #app.largo .jog .pers{font-size:2.4vw}
    #app.largo .jog .est{font-size:1.3vw}
    #app.largo .publica .ph{font-size:1.7vw}
    #app.largo .publica .pt{font-size:3.4vw;line-height:1.3}
    #app.largo .publica .pq{font-size:1.9vw}
    #app.largo .publicas-vazio,#app.largo .vazio{font-size:2.6vw}
    #app.largo .barra .conta{font-size:2vw}
    #app.largo .rodada-telao .rotulo{font-size:1.4vw}
    #app.largo .rodada-telao .nome{font-size:4vw}
    #app.largo .btn{font-size:1.8vw;padding:2.4vh 3vw}
    #app.largo .muted{font-size:1.8vw}
  }

  /* ---------- relogio da casa ---------- */
  .relogio{
    text-align:center;padding:8px 0 26px;
  }
  .relogio .hh{
    font-family:var(--serif);font-size:clamp(52px,13vw,92px);line-height:1;
    letter-spacing:.1em;color:var(--nevoa);font-variant-numeric:tabular-nums;
    text-shadow:0 0 44px rgba(143,163,184,.3);
  }
  .relogio .cap{
    font-size:clamp(11px,3vw,14px);letter-spacing:.34em;text-transform:uppercase;
    color:var(--dim);margin-top:10px;
  }

  /* com a arte visivel, o texto do painel precisa se descolar dela */
  body.t-painel .relogio .hh, body.t-painel .relogio .cap,
  body.t-painel .eyebrow, body.t-painel .vazio,
  body.t-painel .publicas-vazio, body.t-painel .publica .pt,
  body.t-painel .publica .ph, body.t-painel .publica .pq,
  body.t-painel .barra .conta, body.t-painel .muted{
    text-shadow:0 2px 16px rgba(5,7,12,.95), 0 0 44px rgba(5,7,12,.8);
  }

  /* ---------- pistas gerais (feed do painel) ---------- */
  .publica{
    border-left:2px solid rgba(232,164,76,.5);
    padding:2px 0 2px 18px;margin-bottom:26px;
    animation:surge 1.1s cubic-bezier(.16,1,.3,1);
  }
  @keyframes surge{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .publica .ph{
    font-size:clamp(12px,3.2vw,15px);font-weight:600;letter-spacing:.2em;
    color:var(--ambar);font-variant-numeric:tabular-nums;
  }
  .publica .pt{
    font-family:var(--serif);font-size:clamp(23px,6vw,31px);line-height:1.32;
    color:var(--texto);margin-top:9px;
  }
  .publica .pq{
    font-family:var(--serif);font-style:italic;font-size:clamp(16px,4.2vw,19px);
    color:var(--dim);margin-top:8px;
  }
  .publicas-vazio{
    font-family:var(--serif);font-style:italic;color:var(--dim);
    font-size:clamp(19px,5vw,24px);line-height:1.5;padding:26px 0;
  }

  /* ---------- tipografia ---------- */
  .eyebrow{
    display:block;font-size:clamp(11px,3vw,14px);font-weight:600;
    letter-spacing:.32em;text-transform:uppercase;color:var(--dim);
    margin-bottom:10px;
  }
  h1{
    font-family:var(--serif);font-size:clamp(42px,12vw,68px);
    line-height:1.03;font-weight:400;margin-bottom:8px;
  }
  h2{
    font-family:var(--serif);font-size:clamp(30px,8.4vw,44px);
    line-height:1.12;font-weight:400;margin-bottom:14px;
  }
  .lead{
    font-family:var(--serif);font-size:clamp(21px,5.7vw,29px);
    line-height:1.45;color:var(--nevoa);margin-bottom:26px;
  }
  .muted{color:var(--dim);font-size:clamp(14px,3.7vw,17px);line-height:1.6}

  /* ---------- botoes ---------- */
  .btn{
    display:block;width:100%;margin-bottom:12px;
    font-family:var(--sans);font-size:clamp(15px,4vw,18px);font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;
    padding:22px 24px;border-radius:3px;cursor:pointer;
    border:1px solid var(--linha);background:var(--painel);color:var(--texto);
    transition:border-color .25s ease,background .25s ease;
  }
  .btn:active{background:#141d28}
  .btn-ambar{border-color:rgba(232,164,76,.5);color:var(--ambar);background:rgba(232,164,76,.06)}
  .btn-frio{border-color:rgba(127,212,255,.45);color:var(--frio);background:rgba(127,212,255,.06)}
  .btn-fantasma{border-color:transparent;color:var(--dim);letter-spacing:.12em;padding:16px}
  .btn-perigo{border-color:rgba(224,103,79,.45);color:var(--vermelho);
    background:rgba(224,103,79,.06)}
  .btn-perigo:active{background:rgba(224,103,79,.16)}
  .btn:disabled{opacity:.32;cursor:default}
  .btn-menu-mestre{position:fixed;z-index:45;right:104px;
    bottom:max(16px,env(safe-area-inset-bottom));padding:12px 16px;border-radius:100px;
    border:1px solid rgba(127,212,255,.5);background:rgba(5,7,12,.82);color:var(--frio);
    font:700 clamp(11px,3vw,14px) var(--sans);letter-spacing:.16em;text-transform:uppercase}
  body.tem-arquivo .btn-menu-mestre{right:236px}
  .btn-caso{position:fixed;z-index:45;right:14px;bottom:max(16px,env(safe-area-inset-bottom));
    padding:12px 16px;border-radius:100px;border:1px solid rgba(127,212,255,.42);
    background:rgba(5,7,12,.76);color:var(--frio);font:700 clamp(11px,3vw,14px) var(--sans);
    letter-spacing:.14em;text-transform:uppercase}
  body.tem-arquivo .btn-caso{right:148px}
  .caso-fundo{position:fixed;inset:0;z-index:43;background:rgba(2,5,9,.96);
    padding:max(18px,env(safe-area-inset-top)) 16px max(82px,env(safe-area-inset-bottom));overflow-y:auto}
  .caso-card{max-width:600px;margin:auto}.caso-card .publica:last-child{margin-bottom:4px}
  .menu-mestre-fundo{position:fixed;inset:0;z-index:43;background:rgba(2,5,9,.94);
    padding:max(18px,env(safe-area-inset-top)) 16px max(82px,env(safe-area-inset-bottom));overflow-y:auto}
  .menu-mestre-card{max-width:600px;margin:auto}
  .menu-mestre-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .menu-mestre-topo h2{margin:0}.menu-mestre-topo .btn{width:auto;margin:0;padding:11px 14px}
  .menu-mestre-grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .menu-mestre-grade .btn{margin:0;padding:14px 10px;font-size:12px}
  .menu-mestre-qr{width:min(210px,58vw);display:block;margin:14px auto;border:8px solid #fff;border-radius:6px}
  .conectado-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--linha)}
  body.modo-sem-telao #app{padding-bottom:92px}
  .mural-movel{margin:24px 0 80px;border:1px solid var(--linha);border-radius:6px;background:rgba(12,18,26,.92);padding:0 14px}
  .mural-movel summary{cursor:pointer;padding:14px 0;color:var(--frio);font-weight:800}
  .btn-sm{
    display:inline-block;width:auto;padding:12px 18px;margin:0;
    font-size:clamp(11px,3vw,13px);letter-spacing:.14em;
  }

  /* ---------- campos ---------- */
  label{
    display:block;font-size:clamp(14px,3.7vw,17px);font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;color:var(--nevoa);
    opacity:.85;margin:0 0 11px;
  }
  input{
    width:100%;margin-bottom:22px;
    font-family:var(--sans);font-size:clamp(20px,5.4vw,26px);
    padding:18px 16px;border-radius:3px;
    border:1px solid var(--linha);background:#080d14;color:var(--texto);
  }
  input:focus{outline:none;border-color:rgba(127,212,255,.5)}
  input.codigo{
    font-family:var(--sans);font-size:clamp(30px,9vw,44px);font-weight:600;
    letter-spacing:.3em;text-align:center;text-transform:uppercase;
  }

  /* ---------- cartoes ---------- */
  .card{
    border:1px solid var(--linha);border-radius:3px;background:var(--painel);
    padding:20px;margin-bottom:14px;
  }
  .barra{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--linha);
  }
  .barra .conta{
    font-size:clamp(15px,4vw,19px);font-weight:600;color:var(--texto);
  }
  .barra .dir{margin-left:auto;display:flex;gap:8px}

  /* ---------- grade de jogadores ---------- */
  .grade{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:12px;margin-bottom:24px;
  }
  .jog{
    border:1px solid var(--linha);border-radius:3px;background:var(--painel);
    padding:18px 14px;text-align:center;position:relative;overflow:hidden;
  }
  .jog::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--linha);
  }
  .jog.st-pronto::before{background:var(--frio)}
  .jog.st-atuando::before{background:var(--ambar)}
  .jog.st-atuando{border-color:rgba(232,164,76,.45)}
  .jog .av{font-size:clamp(30px,8vw,40px);line-height:1;margin-bottom:10px}
  .jog .nm{
    font-size:clamp(15px,4vw,18px);font-weight:600;margin-bottom:5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .jog .pers{
    font-family:var(--serif);font-style:italic;
    font-size:clamp(16px,4.3vw,20px);color:var(--nevoa);
  }
  .jog .est{
    font-size:clamp(11px,2.9vw,13px);letter-spacing:.18em;text-transform:uppercase;
    color:var(--dim);margin-top:9px;
  }
  .jog .pt{
    font-size:clamp(22px,6vw,28px);font-weight:600;color:var(--ambar);margin-top:8px;
    font-variant-numeric:tabular-nums;
  }
  .vazio{
    grid-column:1/-1;text-align:center;padding:44px 20px;
    font-family:var(--serif);font-style:italic;color:var(--dim);
    font-size:clamp(19px,5.2vw,25px);line-height:1.5;
  }

  /* ---------- portao: a tela-titulo antes do video ----------
     O toque aqui e o que libera o som. Navegador nenhum deixa video
     com audio comecar sozinho — entao o primeiro toque e a chave.   */
  #portao{
    position:fixed;inset:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 30px;
    background:linear-gradient(180deg,rgba(5,7,12,.35) 0%,rgba(5,7,12,.72) 100%);
    transition:opacity 1.2s ease, background 1.2s ease;
  }
  /* durante o video o Pular vai para o canto: no centro ele cai
     exatamente onde legenda e texto do video costumam aparecer */
  #portao.tocando{
    background:transparent;
    justify-content:flex-end;align-items:flex-end;
    padding-right:18px;
  }
  #portao.saindo{opacity:0;pointer-events:none}
  body.portao #app{opacity:0;pointer-events:none;transition:opacity .8s ease}
  #portao-toque{
    font-family:var(--serif);font-style:italic;
    font-size:clamp(26px,6.8vw,38px);color:var(--texto);
    text-shadow:0 2px 30px rgba(0,0,0,.95);margin-bottom:28px;
    animation:respira 3s ease-in-out infinite;
  }
  #portao #btn-comecar{width:auto;min-width:14em;margin-bottom:16px}
  /* foco visivel: na TV a pessoa navega as cegas sem isso */
  #portao #btn-comecar:focus,#btn-pular:focus{
    outline:none;border-color:var(--ambar);
    box-shadow:0 0 0 3px rgba(232,164,76,.35),0 0 34px rgba(232,164,76,.3);
  }
  #portao-sub{
    font-size:clamp(11px,3vw,14px);letter-spacing:.26em;text-transform:uppercase;
    color:var(--nevoa);opacity:.65;
    text-shadow:0 2px 20px rgba(0,0,0,.95);
  }
  @keyframes respira{0%,100%{opacity:.6}50%{opacity:1}}
  #portao.tocando #portao-toque,
  #portao.tocando #portao-sub,
  #portao.tocando #btn-comecar{display:none}
  #btn-pular{
    display:none;pointer-events:auto;

  /* ---------- menu de pistas do jogador ---------- */

  /* ---------- controles de abertura, no cantinho ---------- */

  }

  /* ---------- roteiro de cinema ---------- */
  #escuro{
    position:fixed;inset:0;z-index:40;background:#020304;

    text-align:center;padding:40px 30px;
  }

  #escuro .sub{
    font-size:clamp(12px,3.2vw,15px);letter-spacing:.28em;text-transform:uppercase;

  }

    width:9px;height:9px;border-radius:50%;background:var(--nevoa);

  /* ---------- modal QR ---------- */
  .modal-fundo{

  }

  /* ---------- cortina ----------
     O poster fecha a tela enquanto a casa sorteia. Quando abre,
     o jogador ja e alguem. Esconde a espera e cria o momento.     */
  #cortina{
    position:fixed;inset:0;z-index:30;
    background:url("img/capa-vertical.jpg") center/cover no-repeat,#05070c;

  #cortina.on #cortina-txt{animation:cortSobe 1.1s ease .7s both}
  @keyframes cortSobe{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* a tela de digitar o codigo tambem recebe a arte, mais apagada,
     para a chegada ser uma sequencia continua e nao tres telas soltas */
  body.t-entrar #arte{
    background-image:url("img/capa-vertical.jpg");
    opacity:.30;
  }
  body.t-entrar #arte::after{
    background:linear-gradient(180deg,rgba(5,7,12,.55) 0%,rgba(5,7,12,.92) 70%,#05070c 100%);
  }

  /* ================= TELAS DO JOGADOR (celular) ================= */

  /* Duas artes, dois momentos:
     - chegou e ainda nao se declarou pronto -> a casa no penhasco
     - declarou pronto, esperando os outros  -> o celular e as pecas   */
  body.t-espera #arte{ background-image:url("img/capa-vertical.jpg"); opacity:1; }
  body.t-pronto #arte{ background-image:url("img/aguardando.jpg"); opacity:1; }
  body.t-espera #arte::after, body.t-pronto #arte::after{
    background:linear-gradient(180deg,
      rgba(5,7,12,.05) 0%, rgba(5,7,12,.12) 30%, rgba(5,7,12,.30) 100%);
  }
  #app.espera{
    min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;
    padding-bottom:max(34px,env(safe-area-inset-bottom));
    background:linear-gradient(180deg,
      transparent 0%, rgba(5,7,12,.20) 34%, rgba(5,7,12,.80) 52%,
      rgba(5,7,12,.95) 64%, #05070c 78%);
  }
  #app.espera .eyebrow{text-align:center}
  .espera-quem{text-align:center;margin-bottom:26px}
  .espera-quem .av{font-size:clamp(50px,15vw,74px);line-height:1;
    filter:drop-shadow(0 0 26px rgba(232,164,76,.4))}
  .espera-quem .nm{
    font-family:var(--serif);font-size:clamp(34px,9.4vw,48px);margin-top:10px;

  .espera-quem .ds{
    font-family:var(--serif);font-style:italic;color:var(--nevoa);
    font-size:clamp(19px,5.1vw,24px);line-height:1.4;margin-top:8px;
    text-shadow:0 2px 20px rgba(0,0,0,.95);
  }
  .contagem-prontos{
    text-align:center;font-family:var(--serif);font-style:italic;
    font-size:clamp(20px,5.4vw,26px);color:var(--nevoa);margin-top:18px;
    text-shadow:0 2px 20px rgba(0,0,0,.95);
  }

  /* escuro: a tela some. Nada de nome, nada de dica. */
  #app.escuro{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
  }
  body.t-escuro{background:#000}
  body.t-escuro #arte{opacity:0}
  .escuro-frase{
    font-family:var(--serif);font-style:italic;
    font-size:clamp(21px,5.7vw,27px);color:#2b3742;line-height:1.45;max-width:15em;
  }

  /* pista privada recebida ao encerrar a vez */
  .pista-card{
    border:1px solid rgba(232,164,76,.28);border-radius:3px;
    background:linear-gradient(160deg,rgba(20,26,34,.96),rgba(10,14,20,.98));
    padding:26px 24px;position:relative;overflow:hidden;
    animation:rvSobe .9s cubic-bezier(.16,1,.3,1) both;
  }
  .pista-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,transparent,var(--ambar),transparent);
  }
  .pista-card .ph{
    font-size:clamp(12px,3.4vw,16px);font-weight:600;letter-spacing:.2em;
    color:var(--ambar);font-variant-numeric:tabular-nums;
  }
  .pista-card .pt{
    font-family:var(--serif);font-size:clamp(27px,7.2vw,38px);line-height:1.3;
    margin-top:14px;
  }

  /* abertura da estoria, no fim */
  .historia p{
    font-family:var(--serif);font-size:clamp(23px,6.2vw,31px);line-height:1.45;

  }
  .historia p:last-child{
    font-style:italic;color:var(--ambar);
  }

  /* ---------- revelacao do personagem ---------- */
  .revelacao{text-align:center;margin:38px 0}
  .rv-av{font-size:clamp(64px,19vw,96px);line-height:1;
    filter:drop-shadow(0 0 30px rgba(232,164,76,.4))}
  .rv-nome{margin-top:18px}
  .revelacao.revela .rv-av{animation:rvSurge 1.2s cubic-bezier(.16,1,.3,1) both}
  .revelacao.revela .rv-nome{animation:rvSobe .9s cubic-bezier(.16,1,.3,1) .5s both}
  .revelacao.revela .rv-desc{animation:rvSobe .9s cubic-bezier(.16,1,.3,1) .9s both}
  @keyframes rvSurge{
    from{opacity:0;transform:scale(.55);filter:blur(14px)}
    to{opacity:1;transform:scale(1);filter:blur(0)}
  }
  @keyframes rvSobe{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* ---------- porta do mestre ---------- */
  #senha-erro{
    color:var(--vermelho);font-size:clamp(14px,3.7vw,17px);
    min-height:24px;margin-bottom:14px;
  }
  .modal input.senha{
    text-align:center;letter-spacing:.18em;margin-bottom:16px;
  }
</style>

<body>
<div id="arte">
  <!-- Coloque o video em img/abertura.mp4 e ele assume a abertura sozinho.
       Sem o arquivo, nada quebra: fica o poster capa-vertical.jpg. -->
  <video id="video-abertura" muted loop playsinline preload="auto"
         poster="img/capa-vertical.jpg"></video>
</div>
<button id="btn-pistas" title="Abrir os fragmentos guardados" aria-label="Abrir Arquivo">🗂 Arquivo <b>0</b></button>

<div id="pistas">
  <h2>Arquivo</h2>
  <p class="muted">Seus fragmentos e as pistas adquiridas durante o caso.</p>
  <div id="pistas-lista"></div>
  <div id="pistas-vazio">Voc&ecirc; ainda n&atilde;o recebeu nada.<br>A noite mal come&ccedil;ou.</div>
  <button class="btn" id="fechar-pistas" style="max-width:20em;margin:12px auto 0">Voltar</button>
</div>

<div id="ctrl-abertura">
  <button id="btn-repetir" title="Repetir abertura" aria-label="Repetir abertura">&#8635;</button>
  <button id="btn-som" title="Som" aria-label="Ligar ou desligar o som">&#128263;</button>
  <button id="btn-cheia" title="Tela cheia" aria-label="Tela cheia">&#9974;</button>
</div>

<div id="portao">
  <div id="portao-toque">A casa est&aacute; esperando</div>
  <!-- botao de verdade: TV navega por foco, div clicavel nao recebe OK -->
  <button id="btn-comecar" class="btn btn-ambar">Come&ccedil;ar</button>
  <div id="portao-sub">Toque na tela ou pressione OK</div>
  <button id="btn-pular">Pular</button>
</div>

<div id="cortina"><div id="cortina-txt"></div></div>
<div id="app"></div>

<script src="js/mosaico-v5.js"></script>
<script>
/* ============================================================
   MOSAICO — mesa, painel e encenacao
   Convencoes herdadas do Learning-lab (Laboratorio do Pesquisador):
   codigo de 6 caracteres sem 0/O/1/I, link ?sala=, QR via qrserver,
   Firestore publicado em window.MosaicoFB por um script type=module.
   ============================================================ */
"use strict";

/* ---------- flexao de genero ----------
   O texto guarda as duas formas: {masculino|feminino}. A escolha e do
   jogador, feita na entrada, antes de saber qual arquetipo vai receber.
   Jornalista e Policial nao mudam de palavra — so o artigo — por isso
   o rotulo inteiro fica escrito, em vez de trocar sufixo por regra.   */
function flex(txt, forma){
  return String(txt==null?"":txt).replace(/\{([^|}]*)\|([^}]*)\}/g,
    function(_,m,f){ return forma==="f" ? f : m; });
}

/* ---------- arquetipos (Cap. 3 — Os Seis Convidados) ---------- */
var PERSONAGENS = [
  { id:"investigador", av:"🔦",
    nome:"{O Investigador|A Investigadora}",
    desc:"Chega primeiro. Sempre observa antes de se misturar." },
  { id:"herdeiro", av:"🔑",
    nome:"{O Herdeiro|A Herdeira}",
    desc:"Não entra: surge. A névoa abre espaço quando passa." },
  { id:"morador", av:"👟",
    nome:"{O Morador|A Moradora}",
    desc:"Passos leves, calculados. Acostumad{o|a} a não ser percebid{o|a}." },
  { id:"jornalista", av:"👜",
    nome:"{O Jornalista|A Jornalista}",
    desc:"Segura a bolsa com força. Algo lá dentro importa mais que a noite." },
  { id:"policial", av:"🪞",
    nome:"{O Policial|A Policial}",
    desc:"Tenta parecer tranquil{o|a}. Não está." },
  { id:"menina", av:"🔇",
    nome:"{O Menino|A Menina}",
    desc:"{O último|A última}. Vê tudo. Não diz nada." }
];

function nomePers(p, forma){ return p ? flex(p.nome, forma) : "—"; }
function descPers(p, forma){ return p ? flex(p.desc, forma) : ""; }

/* ---------- roteiros da encenacao (Cap. 1 e 3) ---------- */
var ROTEIRO = {
  investigador:{
    rub:"Você entra primeiro. Não por coragem — por hábito. Passa a mão pela parede do corredor, como quem testa a textura de algo vivo. A madeira responde com um estalo curto. Você para. Olha para cima.",
    tom:"Alto — quase um grito",
    fala:"“Tem alguém aí?”",
    pos:"A fala sai curta, automática. Ninguém responde. Ou talvez tenha respondido, e o som se perdeu na tempestade."
  },
  herdeiro:{
    rub:"Você não entra: surge. A névoa abre espaço, como se reconhecesse você. Olha para cada canto da sala como quem procura algo que já sabe que está ali. O cofre chama sua atenção — fechado, mas com a marca de dedo fresca. Você toca a trava com o indicador.",
    tom:"Baixo, seco, sem hesitar",
    fala:"“Isso não estava assim.”",
    pos:"E não estava mesmo."
  },
  morador:{
    rub:"Você chega sem fazer barulho — a porta nem parece abrir. Passos leves, calculados, de quem está acostumad{o|a} a não ser percebid{o|a}. Olha para a escada. Para o sótão. Para a janela do segundo andar.",
    tom:"Sem falar — só o olhar",
    fala:"( silêncio )",
    pos:"Você não diz nada. Mas encara alguma coisa acima da cabeça das outras pessoas por três segundos, como quem já viu algo que os outros não viram. Depois desvia."
  },
  jornalista:{
    rub:"Você entra como se estivesse atrasad{o|a} — mesmo não estando. Segura a bolsa com força, como se algo lá dentro fosse mais importante do que a própria noite. Olha para o corredor. Para a cortina que balança sem vento. Para a porta entreaberta.",
    tom:"Incomodad{o|a} — mais do que deveria",
    fala:"“Quem deixou isso assim?”",
    pos:"Ninguém responde. E isso incomoda você ainda mais."
  },

/* Herdado do Learning-lab: em file:// o QR aponta para um endereco que
   nenhum outro aparelho alcanca. E a causa mais comum de "QR nao funciona". */
function avisoLocal(){
  var loc=window.location||{}, p=loc.protocol||"", h=loc.hostname||"";
  if(p!=="http:" && p!=="https:"){
    return '<div class="aviso"><b>Esta p&aacute;gina est&aacute; aberta como arquivo local.</b> '+
           'O QR e o link apontam para um endere&ccedil;o que s&oacute; existe neste aparelho. '+
           'Publique no GitHub Pages antes de usar com a mesa.</div>';
  }
  /* localhost tambem quebra o QR: no celular, "localhost" e o PROPRIO celular.
     Este era o caso mais comum de "le o QR e nao entra".                      */
  if(h==="localhost" || h==="127.0.0.1" || h==="[::1]"){
    return '<div class="aviso"><b>O endere&ccedil;o &eacute; localhost.</b> '+
           'Ao ler o QR, o celular tenta abrir <i>o pr&oacute;prio celular</i> &mdash; '+
           'e n&atilde;o acha nada. Publique no GitHub Pages para a mesa funcionar.</div>';
  }
  /* IP de rede local funciona entre aparelhos no mesmo Wi-Fi, mas nao fora dele
     e o Firebase exige o dominio autorizado. */
  if(/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h)){
    return '<div class="aviso"><b>Endere&ccedil;o de rede local.</b> '+
           'S&oacute; funciona para quem estiver no mesmo Wi-Fi, e o Firebase pode recusar '+
           'o login por dom&iacute;nio n&atilde;o autorizado.</div>';
  }
  return "";
}

async function verificarAutomacoes(){
  if(!souMestreDaMesa()) return;
  var d=dadosAutomacao(), fase=(STATE.doc&&STATE.doc.fase)||"";
  if(_autoFasePendente&&_autoFasePendente!==fase) _autoFasePendente=null;
  if(!d||_autoFasePendente===d.fase||!d.total) return;
  var prazoTerminou=d.inicio&&Date.now()>=d.inicio+d.limite;
  if(d.recebidos<d.total&&!prazoTerminou) return;
  _autoFasePendente=d.fase;
  try{await d.acao();}catch(e){_autoFasePendente=null;console.error("automação da fase",e);}
}
function agendarAutomacoes(){
  if(!souMestreDaMesa()) return;
  var d=dadosAutomacao();
  if(!d){if(_autoTimer)clearTimeout(_autoTimer);_autoTimer=null;_autoTimerChave="";return;}
  verificarAutomacoes();
  if(!d.inicio||d.recebidos>=d.total) return;
  var chave=d.fase+":"+d.inicio;
  if(_autoTimerChave===chave) return;
  if(_autoTimer)clearTimeout(_autoTimer);
  _autoTimerChave=chave;
  _autoTimer=setTimeout(function(){_autoTimer=null;_autoTimerChave="";verificarAutomacoes();},Math.max(0,d.inicio+d.limite-Date.now())+100);
}

                : (STATE.tela==="inicio") ? "capa"

  /* enquanto a sala espera, o painel continua com o video */
  var faseAgora=(STATE.doc&&STATE.doc.fase)||"sala";
  document.body.classList.toggle("fase-sala",
    STATE.tela==="painel" && faseAgora==="sala");
  var h="";
  switch(STATE.tela){
    case "inicio":      h=telaInicio(); break;
    case "entrar":      h=telaEntrar(); break;
    case "painel":      h=telaPainel(); break;
    case "esperando":   h=telaEsperando(); break;

    case "mosaico":     h=telaMosaico(); break;
    case "cooperacao":  h=telaCooperacao(); break;
    case "mercado":     h=telaMercado(); break;

      '<button class="forma-op'+(STATE.modoMesa==="sem-telao"?' on':'')+'" onclick="escolherModoMesa(\'sem-telao\')"><b>📱</b><span>Sem tel&atilde;o</span></button>'+
      '<p class="muted" style="margin:10px 0 16px">Com tel&atilde;o: um aparelho fica no painel. Sem tel&atilde;o: quem abre tamb&eacute;m joga e controla pelo celular.</p>'+
      (autenticado?'<p class="muted">Mestre reconhecido neste aparelho.</p>':'<input id="senha" class="senha" type="password" inputmode="text" '+

function telaPainel(){
  var m=STATE.mesa;
  if(!m) return telaInicio();
  var js=ordenados(STATE.jogadores);
  var fase=(STATE.doc&&STATE.doc.fase)||"sala";
  var grade="";

  if(!js.length){
    grade='<div class="vazio">Ningu&eacute;m chegou ainda.<br>'+
          'Os cart&otilde;es aparecem quando algu&eacute;m entra pelo QR.</div>';
  } else {
    for(var i=0;i<js.length;i++){
      var j=js[i], p=personagemPor(j.personagem);
      var vezAtual=(STATE.doc&&STATE.doc.vez)||0;
      var atuando=(fase==="encenacao" && i===vezAtual);
      /* o personagem so aparece no telao depois que aquela pessoa ja
         atuou — antes disso e segredo, inclusive dela mesma */
      var jaRevelado=(fase!=="sala" && fase!=="escuro") &&
                     (fase!=="encenacao" || i<vezAtual);
      var st=atuando?"atuando":(j.status==="pronto"?"pronto":"");
      var est=atuando?"Agora":(jaRevelado?"J&aacute; passou":"Na casa");
      /* A pessoa some de vez. Depois da primeira tarefa o cartao passa a
         ser so o arquetipo — quem era quem vira memoria da mesa, e isso
         e fator de confusao na deducao, nao descuido.                  */
      var titulo = jaRevelado&&p ? nomePers(p, j.forma) : j.nome;
      var sub    = "";
      grade+='<div class="jog st-'+st+'">'+
        '<div class="av">'+(jaRevelado&&p?p.av:"🕯️")+'</div>'+
        '<div class="nm">'+esc(titulo)+'</div>'+
        '<div class="pers">'+(sub?esc(sub):"&mdash;")+'</div>'+
        '<div class="est">'+est+'</div>'+
        (fase==="resultado"?'<div class="pt">'+(j.total||0)+'</div>':'')+
      '</div>';
    }
  }
  /* No telão, a encenação não identifica nem destaca quem está falando.
     O celular da própria pessoa continua sendo o único indicador da vez. */
  if(fase==="encenacao"){
    grade='<div class="vazio" style="font-family:var(--serif);font-size:clamp(25px,4vw,42px);line-height:1.35">Observe o ambiente<br>e escute os sons!</div>';
  }

  /* relogio da casa: avanca com as interpretacoes concluidas */
  var pubs=(STATE.publicas||[]).slice().sort(function(a,b){return (a.ordem||0)-(b.ordem||0);});
  var hora=HORA_FASE[fase];
  if(hora===null) hora = pubs.length ? pubs[pubs.length-1].hora : "21:00";
  var relogio='<div class="relogio"><div class="hh">'+esc(hora)+'</div>'+
              '<div class="cap">'+CAP_FASE[fase]+'</div></div>';

  var mural="";
  if(!pubs.length){
    mural='<div class="publicas-vazio">A casa ainda n&atilde;o mostrou nada.<br>'+
          'As linhas v&atilde;o aparecendo sozinhas.</div>';
  } else {
    for(var m=pubs.length-1;m>=0;m--){
      var pu=pubs[m];
      mural+='<div class="publica"><span class="ph">'+esc(pu.hora)+'</span>'+
             '<div class="pt">'+esc(pu.txt)+'</div>'+
             '<div class="pq">fragmento revelado</div></div>';
    }
  }

  var acao="";
  if(fase==="sala"){
    /* Quem abriu a mesa e o ultimo gate: mesmo com todos prontos, o inicio
       so acontece quando ele libera — assim da para esperar atrasados.
       O rotulo nao entrega o que vem; a tarefa e surpresa.             */
    var prontos=contaProntos();
    var todosProntos = js.length>=2 && prontos===js.length;
    acao='<button class="btn btn-ambar" '+(todosProntos?'':'disabled')+
         ' onclick="iniciarEncenacao()">Come&ccedil;ar o jogo</button>'+
         '<p class="muted" style="text-align:center">'+
         (js.length<2 ? 'Precisa de pelo menos duas pessoas.'
                      : prontos+' de '+js.length+' prontos'+
                        (todosProntos?' &mdash; pode come&ccedil;ar quando quiser.'
                                     :'. Esperando os que faltam.'))+
         '</p>';
  } else if(fase==="encenacao"){
    acao='<button class="btn" onclick="pularVez()">Pular a apresenta&ccedil;&atilde;o atual</button>';
  } else if(fase==="votacao"){
    acao='<div class="card"><span class="eyebrow">Vota&ccedil;&atilde;o aberta</span>'+
         '<p class="muted">'+STATE.votos.length+' de '+js.length+' j&aacute; votaram. '+
         'Ningu&eacute;m pode votar em si. Os n&uacute;cleos ser&atilde;o formados automaticamente.</p></div>';
  } else if(fase==="mosaico"){
    acao='<div class="card"><span class="eyebrow">Mosaico coletivo</span><p class="muted">'+STATE.v5.nucleos.filter(function(n){return n.concluidoEm||n.concluidoMs;}).length+' n&uacute;cleo(s) conclu&iacute;do(s).</p></div><button class="btn btn-ambar" onclick="abrirVotoCooperacao()">Encerrar mosaico e abrir voto interno</button>';
  } else if(fase==="cooperacao"){
    acao='<div class="card"><span class="eyebrow">Voto interno cego</span><p class="muted">'+STATE.v5.cooperacao.length+' voto(s) recebidos. Os nomes e o resultado permanecem ocultos.</p></div><button class="btn btn-ambar" onclick="abrirMercado()">Encerrar voto e abrir Mercado Cego</button>';
  } else if(fase==="mercado"){
    acao='<div class="card"><span class="eyebrow">Mercado Cego</span><p class="muted">'+STATE.v5.negociacoes.length+' compra(s) conclu&iacute;da(s).</p></div><button class="btn btn-ambar" onclick="abrirDeducao()">Fechar mercado e abrir dedu&ccedil;&atilde;o</button>';
  } else if(fase==="deducao"){
    acao='<div class="card"><span class="eyebrow">Dedu&ccedil;&atilde;o final</span><p class="muted">'+STATE.v5.deducoes.length+' de '+js.length+' respostas enviadas. O placar ser&aacute; calculado automaticamente.</p></div>';
  } else if(fase==="resultado"){
    acao='<button class="btn btn-frio" onclick="voltarParaSala()">Voltar &agrave; sala</button>';
  }

  return cabecalhoRodada(fase)+'<div class="barra">'+
      '<span class="conta">'+js.length+' na mesa</span>'+
      '<span class="selo ok">'+(modoAtual()==="sem-telao"?'Sem tel&atilde;o':'Com tel&atilde;o')+'</span>'+
      '<span class="selo '+(m.fb?"ok":"esperando")+'">'+(m.fb?"Ao vivo":"Conectando…")+'</span>'+
      '<span class="dir">'+
        '<button class="btn btn-sm btn-frio" onclick="abrirQr()">C&oacute;digo &middot; QR</button>'+
      '</span>'+
    '</div>'+
    relogio+
    '<div class="painel-cols">'+
      '<div><span class="eyebrow">Na casa</span>'+
        '<div class="grade">'+grade+'</div>'+acao+'</div>'+
      '<div><span class="eyebrow">Pistas gerais</span>'+mural+'</div>'+
    '</div>'+
    modalQr();
}

  var qr="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data="+

    '<p class="muted">Apontar a c&acirc;mera ou digitar o c&oacute;digo.</p>'+

      'Derruba todos os jogadores. N&atilde;o d&aacute; para desfazer.</p>'+
    '</div></div>';
}

/* O personagem e segredo ate a hora. Nem o proprio jogador sabe quem
   pegou: ele recebe a rubrica e a fala, interpreta, e so depois descobre. */
function souPronto(){
  if(!STATE.eu) return false;
  for(var i=0;i<STATE.jogadores.length;i++)
    if(STATE.jogadores[i].id===STATE.eu.id) return STATE.jogadores[i].pronto===true;
  return false;
}
function contaProntos(){
  var n=0;
  for(var i=0;i<STATE.jogadores.length;i++) if(STATE.jogadores[i].pronto===true) n++;
  return n;
}

function telaEsperando(){
  var js=ordenados(STATE.jogadores);
  var pronto=souPronto();
  var cls=STATE.revelando?" revela":"";
  if(STATE.revelando) setTimeout(function(){ STATE.revelando=false; },2600);

  if(!pronto){
    return '<span class="eyebrow">Voc&ecirc; est&aacute; na casa</span>'+
      '<div class="revelacao'+cls+'">'+
        '<div class="rv-av">🕯️</div>'+
        '<h2 class="rv-nome">A casa j&aacute;<br>decidiu.</h2>'+
        '<p class="lead rv-desc" style="margin-bottom:0">Voc&ecirc; ainda n&atilde;o sabe quem &eacute; '+
        'nesta noite. Vai descobrir na hora.</p>'+
      '</div>'+
      '<button class="btn btn-ambar" onclick="marcarPronto()">Estou pronto para jogar</button>'+
      '<p class="muted" style="text-align:center;margin-top:14px">'+
        contaProntos()+' de '+js.length+' j&aacute; est&atilde;o prontos.</p>';
  }

  /* declarou pronto: troca a arte e fica assim ate chegar a vez */
  return '<span class="eyebrow">Pronto</span>'+
    '<div class="revelacao">'+
      '<div class="pulso" style="margin:0 auto 26px"></div>'+
      '<h2 class="rv-nome">A casa vai<br>come&ccedil;ar.</h2>'+
      '<p class="lead rv-desc" style="margin-bottom:0">Mantenha o celular com voc&ecirc; e proteja sua tela. '+
      'Ele mostrar&aacute; as instru&ccedil;&otilde;es quando chegar a sua vez.</p>'+
    '</div>'+
    '<div class="contagem-prontos">'+contaProntos()+' de '+js.length+' prontos</div>';
}

function telaEncenacao(){
  var js=ordenados(STATE.jogadores);
  var vez=(STATE.doc&&STATE.doc.vez)||0;
  var atual=js[vez];
  var souEu=atual&&STATE.eu&&atual.id===STATE.eu.id;

  if(!souEu){
    /* o nome pode aparecer — o personagem nao */
    return '<div id="escuro"><div class="pulso"></div>'+
      '<div class="quem">'+(atual?esc(atual.nome):"&mdash;")+'</div>'+
      '<div class="sub">Mantenha o celular com voc&ecirc;, proteja sua tela e observe o ambiente.</div></div>';
  }

  if(STATE.contando>0){
    return '<div id="escuro"><div id="contagem">'+STATE.contando+'</div>'+
      '<div class="sub" style="margin-top:20px">Respire. &Eacute; a sua vez.</div></div>';
  }

  var r=ROTEIRO[STATE.eu.personagem];
  var fm=STATE.eu.forma;
  if(!r) return '<p class="lead">Roteiro n&atilde;o encontrado.</p>';

  /* sem o nome do personagem: quem esta atuando ainda nao sabe quem e */
  return '<span class="eyebrow">&Eacute; a sua vez</span>'+
    '<p class="muted" style="text-align:center">Leia no seu celular e mantenha a tela voltada somente para voc&ecirc;.</p>'+
    '<div class="roteiro">'+
      '<div class="quem">Fa&ccedil;a agora, em voz alta</div>'+
      '<div class="rub">'+esc(flex(r.rub,fm))+'</div>'+
      '<div class="tom">'+esc(flex(r.tom,fm))+'</div>'+
      '<div class="fala">'+esc(flex(r.fala,fm))+'</div>'+
      '<div class="pos">'+esc(flex(r.pos,fm))+'</div>'+
    '</div>'+
    '<button class="btn btn-ambar" onclick="terminei()">Toque para concluir sua apresenta&ccedil;&atilde;o!</button>';
}

/* So aqui o jogador descobre quem era — e ja leva a pista da noite. */
function telaRevelacao(){
  var p=personagemPor(STATE.eu&&STATE.eu.personagem);
  var pista=PISTA_PRIVADA[STATE.eu&&STATE.eu.personagem];
  return '<span class="eyebrow">Voc&ecirc; era</span>'+
    '<div class="revelacao revela">'+
      '<div class="rv-av">'+(p?p.av:"👤")+'</div>'+
      '<h2 class="rv-nome">'+esc(nomePers(p,STATE.eu&&STATE.eu.forma))+'</h2>'+
      '<p class="lead rv-desc">'+esc(descPers(p,STATE.eu&&STATE.eu.forma))+'</p>'+
    '</div>'+
    (pista?'<div class="pista-card">'+
      '<span class="ph">'+esc(pista.hora)+' &middot; sua pista</span>'+
      '<div class="pt">'+esc(pista.txt)+'</div></div>':'')+
    '<p class="muted" style="text-align:center;margin:18px 0 8px">Toque para adicionar a pista ao Arquivo e seguir com o caso.</p>'+
    '<button class="btn btn-ambar" style="margin-top:8px" '+
      'onclick="guardarPista()">Adicionar ao Arquivo</button>';
}

function telaEncerrada(){
  return '<span class="eyebrow">Fim da noite</span>'+
    '<div class="revelacao">'+
      '<div class="rv-av">🕯️</div>'+
      '<h2 class="rv-nome">A casa<br>fechou.</h2>'+
      '<p class="lead rv-desc" style="margin-bottom:0">A mesa foi encerrada. '+
      'Suas pistas continuam guardadas.</p>'+
    '</div>'+
    '<button class="btn btn-frio" onclick="sairDaMesa()">Voltar ao in&iacute;cio</button>';
}

function sairDaMesa(){
  if(_autoTimer)clearTimeout(_autoTimer);_autoTimer=null;_autoTimerChave="";_autoFasePendente=null;
  if(_unsubJog) _unsubJog(); if(_unsubMesa) _unsubMesa();
  if(_unsubVotos) _unsubVotos(); if(_unsubPub) _unsubPub();
  _unsubV5.forEach(function(f){try{f();}catch(e){}}); _unsubV5=[];
  _unsubJog=_unsubMesa=_unsubVotos=_unsubPub=null;
  try{ sessionStorage.removeItem("mosaico_eu"); }catch(e){}
  try{ sessionStorage.removeItem("mosaico_mestre_codigo"); }catch(e){}
  STATE.eu=null; STATE.mesa=null; STATE.jogadores=[]; STATE.doc=null; STATE.menuMestreAberto=false; STATE.casoAberto=false;
  STATE.forma=null; STATE.tela="inicio";
  render();
}

function telaVotacao(){
  var js=ordenados(STATE.jogadores);
  if(STATE.jaVotei){
    return '<span class="eyebrow">Vota&ccedil;&atilde;o</span>'+
      '<h2>Seu voto foi registrado.</h2>'+
      '<p class="lead">Seu voto &eacute; cego. O resultado detalhado n&atilde;o ser&aacute; revelado.</p>';
  }
  var ops="";
  for(var i=0;i<js.length;i++){
    var j=js[i];
    if(STATE.eu&&j.id===STATE.eu.id) continue;   /* ninguem vota em si */
    var p=personagemPor(j.personagem);
    ops+='<button class="pers-op" onclick="votar(\''+j.id+'\')">'+
      '<span class="av">'+(p?p.av:"👤")+'</span>'+
      /* vota-se no papel, nao na pessoa — o nome ja nao existe mais */
      '<span class="txt"><span class="nm">'+esc(nomePers(p,j.forma))+'</span>'+
      '<span class="desc">'+esc(descPers(p,j.forma))+'</span></span></button>';
  }
  return '<span class="eyebrow">Performance &middot; voto cego</span>'+
    '<h2>Quem mais contribuiu para o clima e a divers&atilde;o?</h2>'+
    '<p class="lead">Um voto s&oacute;, sem votar em si. O resultado n&atilde;o ser&aacute; exibido.</p>'+
    '<div class="pers-lista">'+ops+'</div>';
}

function telaResultado(){
  var js=ordenados(STATE.jogadores).slice().sort(function(a,b){ return (b.total||0)-(a.total||0); });
  var grade="";
  for(var i=0;i<js.length;i++){
    var j=js[i], p=personagemPor(j.personagem);
    grade+='<div class="jog'+(i===0?' st-atuando':'')+'">'+
      '<div class="av">'+(p?p.av:"👤")+'</div>'+
      '<div class="nm">'+esc(nomePers(p,j.forma))+'</div>'+
      '<div class="pers">&nbsp;</div>'+
      '<div class="pt">'+(j.total||0)+'</div>'+
      '<div class="est">pontos</div>'+
    '</div>';
  }
  return '<span class="eyebrow">Placar final</span>'+
    '<h2>A verdade foi reconstru&iacute;da.</h2>'+
    '<div class="grade" style="margin-top:22px">'+grade+'</div>'+
    '<p class="muted" style="text-align:center">Tempo 32% &middot; Qualidade 13% &middot; Coopera&ccedil;&atilde;o 30% &middot; Economia 20% &middot; Performance 5%</p>';
}

function meuJogador(){
  if(!STATE.eu) return null;
  return STATE.jogadores.find(function(j){return j.id===STATE.eu.id;})||null;
}
function opcao(valor, rotulo){ return '<option value="'+esc(valor)+'">'+esc(rotulo)+'</option>'; }

function telaMosaico(){
  var eu=meuJogador(), nucleo=eu&&eu.nucleo;
  var feito=(STATE.v5.nucleos||[]).some(function(n){return String(n.id)===String(nucleo)&&(n.concluidoEm||n.concluidoMs);});
  if(feito) return '<span class="eyebrow">N&uacute;cleo '+esc(nucleo)+'</span><h2>Mosaico conclu&iacute;do.</h2><p class="lead">A ordem foi registrada pelo servidor. Aguarde os demais n&uacute;cleos.</p>';
  var opts='<option value="">Escolha…</option>'+(CASO.publicas||[]).map(function(p){return opcao(p.id,p.hora+' — '+p.txt);}).join('');
  var campos=''; for(var i=0;i<6;i++) campos+='<label>'+(i+1)+'&ordm;<select id="mos-'+i+'">'+opts+'</select></label>';

/* ---------- porta do mestre ----------
   AVISO HONESTO: qualquer senha guardada numa pagina web e verificavel
   por quem abrir o codigo-fonte. Isto serve para impedir que alguem
   abra mesas por engano ou por curiosidade — nao e seguranca de fato.
   O que protege os DADOS sao as Regras do Firestore.                   */
var SENHA_HASH="2ff22e27b070d318da49f2ba1062cfef81e85e7cb826a5e761cbdb5f07c62472";

async function sha256hex(txt){
  var buf=new TextEncoder().encode(txt);
  var h=await crypto.subtle.digest("SHA-256",buf);
  return Array.prototype.map.call(new Uint8Array(h),function(b){
    return b.toString(16).padStart(2,"0");
  }).join("");
}
function jaEhMestre(){
  try{ return sessionStorage.getItem("mosaico_mestre")==="1"; }catch(e){ return false; }
}
function pedirSenha(){
  STATE.senhaAberta=true; render();
  setTimeout(function(){ var i=document.getElementById("senha"); if(i) i.focus(); },80);
}
function fecharSenha(){ STATE.senhaAberta=false; render(); }
function escolherModoMesa(modo){ STATE.modoMesa=modo; render(); setTimeout(function(){var i=document.getElementById('senha');if(i)i.focus();},50); }
async function conferirSenha(){
  var campo=document.getElementById("senha");
  var erro=document.getElementById("senha-erro");
  if(!campo) return;
  var txt=(campo.value||"").trim();
  if(!txt){ erro.textContent="Escreva a senha."; return; }
  var ok=false;
  try{ ok = (await sha256hex(txt))===SENHA_HASH; }
  catch(e){ erro.textContent="Este navegador não permite conferir a senha."; return; }
  if(!ok){
    erro.textContent="Senha incorreta.";
    campo.value=""; campo.focus();
    return;
  }
  try{ sessionStorage.setItem("mosaico_mestre","1"); }catch(e){}
  STATE.senhaAberta=false;
  criarMesa(STATE.modoMesa);
}

/* ---------- tela cheia ----------
   So funciona a partir de um gesto da pessoa — nenhum navegador deixa
   entrar em tela cheia sozinho. E no iPhone o Safari nao implementa a
   API: la o caminho e "Adicionar a Tela de Inicio", que abre sem barra
   nenhuma por causa do manifest e das metatags.                      */
function telaCheia(){
  var el=document.documentElement;
  var f=el.requestFullscreen||el.webkitRequestFullscreen||
        el.mozRequestFullScreen||el.msRequestFullscreen;
  if(f){ try{ f.call(el); }catch(e){} }
  if(screen.orientation && screen.orientation.lock){
    try{ screen.orientation.lock("portrait"); }catch(e){}
  }
}
function jaEmTelaCheia(){
  return !!(document.fullscreenElement||document.webkitFullscreenElement);
}
function alternarTelaCheia(){
  if(jaEmTelaCheia()){
    var s=document.exitFullscreen||document.webkitExitFullscreen;
    if(s){ try{ s.call(document); }catch(e){} }
  } else telaCheia();
}

}

/* A casa escolhe: sorteia entre os personagens ainda livres na mesa. */
function sortearPersonagem(ocupados){
  var livres=[];
  for(var i=0;i<PERSONAGENS.length;i++)
    if(ocupados.indexOf(PERSONAGENS[i].id)===-1) livres.push(PERSONAGENS[i].id);
  /* mesa maior que o elenco: repete, mas nunca trava ninguem na porta */
  if(!livres.length) return PERSONAGENS[(Math.random()*PERSONAGENS.length)|0].id;
  return livres[(Math.random()*livres.length)|0];
}

async function entrarNaMesa(){
  var codigo=(document.getElementById("cod").value||"").trim().toUpperCase();
  var nome=(document.getElementById("nome").value||"").trim();
  if(codigo.length!==6){ alert("O código tem 6 caracteres."); return; }
  if(!nome){ alert("Escreva seu nome."); return; }
  if(!STATE.forma){ alert("Escolha como a casa vai te chamar."); return; }
  /* "tanto faz" tambem e escolha: a casa decide, como decide o resto */
  var forma = STATE.forma==="?" ? (Math.random()<0.5?"m":"f") : STATE.forma;

  telaCheia();   /* quem entra pelo QR nao passa pelo portao: o gesto e aqui */
  fecharCortina("A porta abriu. A casa está decidindo quem você é.");
  var entrouEm=Date.now();

  var id=novoId();
  try{
    var F0=await esperarFB();
    if(F0.uid && F0.uid()) id=F0.uid();   /* uid anonimo: permite regra por dono */
  }catch(e){ abrirCortina(); alert(e.message||e); return; }

  try{
    var FB=await esperarFB();
    var existe=await FB.mesaAtiva(codigo);
    if(!existe){ abrirCortina(); alert("Mesa não encontrada ou encerrada."); return; }

    /* quem ja esta na casa define o que sobrou para sortear */
    var jaEstao=await FB.listarJogadores(codigo);
    if(jaEstao.filter(function(j){return j.id!==id;}).length>=12){
      abrirCortina(); alert("A mesa já atingiu o limite deste caso."); return;
    }
    var ocupados=[];
    for(var j=0;j<jaEstao.length;j++)
      if(jaEstao[j].id!==id && jaEstao[j].personagem) ocupados.push(jaEstao[j].personagem);
    var sorteado=sortearPersonagem(ocupados);

    STATE.eu={codigo:codigo,id:id,nome:nome,personagem:sorteado,forma:forma};
    try{ sessionStorage.setItem("mosaico_eu",JSON.stringify(STATE.eu)); }catch(e){}

    await FB.entrarJogador(codigo,id,{
      nome:nome, personagem:sorteado, forma:forma,
      pronto:false,          /* so o proprio jogador se declara pronto */
      entrouMs:Date.now(), votos:0,
      moedas:((CASO.configuracao||{}).moedasIniciais||9), total:0
    });
    _unsubJog=FB.ouvirJogadores(codigo,function(l){ STATE.jogadores=l; sincronizarJogador(); });
    _unsubMesa=FB.ouvirMesa(codigo,function(d){ STATE.doc=d||{fase:"sala",vez:0}; sincronizarJogador(); });
    _unsubVotos=FB.ouvirVotos(codigo,function(v){ STATE.votos=v; });
    _unsubPub=FB.ouvirPublicas(codigo,function(p){ STATE.publicas=p; });
    assinarV5(FB,codigo);
    STATE.tela="esperando";
    render();

    /* a cortina fica no minimo 2,4s mesmo que a rede responda na hora:
       se ela piscar, nao e um momento, e um engasgo */
    var jaPassou=Date.now()-entrouEm;
    setTimeout(function(){
      abrirCortina();
      STATE.revelando=true;   /* a animacao so comeca com a cortina subindo */
      render();
    }, Math.max(0, 2400-jaPassou));
  }catch(e){
    console.error(e);
    abrirCortina();
    alert("Não foi possível entrar.\n\n"+((e&&(e.message||e.code))||e));
  }
}

/* o jogador segue a fase que o painel publicou */
/* Duas pessoas podem ler a lista no mesmo instante e sortear o mesmo
   personagem. Quem entrou depois cede e sorteia de novo entre os livres. */
function resolverColisao(){
  if(!STATE.eu) return;
  var meu=null, conflito=false, ocupados=[];
  for(var i=0;i<STATE.jogadores.length;i++){
    var j=STATE.jogadores[i];
    if(j.id===STATE.eu.id){ meu=j; continue; }
    if(j.personagem) ocupados.push(j.personagem);
    if(j.personagem===STATE.eu.personagem &&
       (j.entrouMs||0) < ((meu&&meu.entrouMs)||Date.now())) conflito=true;
  }
  if(!conflito || !meu) return;
  var novo=sortearPersonagem(ocupados);
  if(novo===STATE.eu.personagem) return;
  STATE.eu.personagem=novo;
  try{ sessionStorage.setItem("mosaico_eu",JSON.stringify(STATE.eu)); }catch(e){}
  esperarFB().then(function(FB){
    FB.atualizarJogador(STATE.eu.codigo,STATE.eu.id,{personagem:novo});
  }).catch(function(){});
}

function sincronizarJogador(){
  if(!STATE.eu) return;
  /* a mesa foi encerrada no painel: ninguem fica preso em tela morta */
  if(STATE.doc && STATE.doc.ativa===false){
    STATE.travaTela=false;
    STATE.tela="encerrada";
    render();
    return;
  }
  resolverColisao();
  if(STATE.travaTela){ render(); return; }   /* revelacao segura a tela */
  var fase=(STATE.doc&&STATE.doc.fase)||"sala";
  var nova = fase==="sala"      ? "esperando"
           : fase==="encenacao" ? "encenacao"
           : fase==="votacao"   ? "votacao"
           : fase==="mosaico"   ? "mosaico"
           : fase==="cooperacao"? "cooperacao"
           : fase==="mercado"   ? "mercado"
           : fase==="deducao"   ? "deducao"
           : "resultado";

  if(nova==="encenacao" && STATE.tela!=="encenacao"){
    var js=ordenados(STATE.jogadores);
    var atual=js[(STATE.doc.vez||0)];
    if(atual&&atual.id===STATE.eu.id) iniciarContagem();
  }
  if(nova==="encenacao" && STATE.tela==="encenacao"){
    var js2=ordenados(STATE.jogadores);
    var at2=js2[(STATE.doc.vez||0)];
    if(at2&&at2.id===STATE.eu.id&&STATE.contando===0&&!_timerContagem) iniciarContagem();
  }
  STATE.tela=nova;
  render();
}

function iniciarContagem(){
  STATE.contando=3;
  clearInterval(_timerContagem);
  _timerContagem=setInterval(function(){
    STATE.contando--;
    if(STATE.contando<=0){ clearInterval(_timerContagem); _timerContagem=null; }
    render();
  },1000);
}

/* Ao concluir a vez, a casa mostra mais uma linha no painel. */
async function avancarVez(codigo, autor){
  var js=ordenados(STATE.jogadores);
  var vez=(STATE.doc&&STATE.doc.vez)||0;
  var FB=await esperarFB();
  var p=PUBLICAS[vez];
  if(p) await FB.publicar(codigo, vez, { hora:p.hora, txt:p.txt, autor:autor||"—", ordem:vez });
  if(vez+1>=js.length) await FB.atualizarMesa(codigo,{fase:"votacao",votacaoAbertaMs:Date.now()});
  else await FB.atualizarMesa(codigo,{vez:vez+1});
}

/* ---------- pistas do jogador ----------
   Ficam no documento do proprio jogador no Firestore, nao so na tela.
   Assim sobrevivem a queda de conexao e podem ser relidas a qualquer
   momento — num jogo de deducao, consultar o que se recebeu e o jogo. */
function minhasPistas(){
  if(!STATE.eu) return [];
  for(var i=0;i<STATE.jogadores.length;i++)
    if(STATE.jogadores[i].id===STATE.eu.id) return STATE.jogadores[i].pistas||[];
  return [];
}

async function guardarPista(){
  var p = PISTA_PRIVADA[STATE.eu && STATE.eu.personagem];
  if(p){
    var atuais = minhasPistas();
    var repetida = atuais.some(function(x){ return x.hora===p.hora && x.txt===p.txt; });
    if(!repetida){
      try{
        var FB=await esperarFB();
        await FB.atualizarJogador(STATE.eu.codigo, STATE.eu.id,
          { pistas: atuais.concat([{ id:p.id||('priv-'+STATE.eu.personagem), hora:p.hora, txt:p.txt, adquirida:false }]) });
      }catch(e){ console.error("guardarPista", e); }
    }
  }
  STATE.travaTela=false;
  sincronizarJogador();
}

function desenhaPistas(){
  var lista=minhasPistas();
  var el=document.getElementById("pistas-lista");
  var vazio=document.getElementById("pistas-vazio");
  var btn=document.getElementById("btn-pistas");
  if(!el||!btn) return;
  el.innerHTML="";
  for(var i=0;i<lista.length;i++){
    var d=document.createElement("div");
    d.className="pista-item";
    d.innerHTML='<span class="ph"></span><div class="pt"></div>';
    d.querySelector(".ph").textContent=lista[i].hora;
    d.querySelector(".pt").textContent=lista[i].txt;
    el.appendChild(d);
  }
  vazio.style.display = lista.length ? "none" : "";
  btn.querySelector("b").textContent = lista.length;
  document.body.classList.toggle("tem-arquivo",lista.length>0);
  /* o botao so existe para quem esta jogando, e nunca no telao */
  btn.classList.toggle("on", !!STATE.eu && lista.length>0 && STATE.tela!=="painel" && STATE.tela!=="inicio");
}

async function abrirDeducao(){ var FB=await esperarFB(); await FB.atualizarMesa(STATE.mesa.codigo,{fase:'deducao',deducaoAbertaMs:Date.now()}); }
async function enviarDeducao(){
  var ids=['suspeito','motivo','acao','prova','lacuna'], dados={id:STATE.eu.id};
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById('ded-'+ids[i]); if(!el||!el.value){alert('Preencha todos os cinco campos.');return;} dados[ids[i]]=el.value;
  }
  dados.pistasUsadas=Array.from(document.querySelectorAll('input[name="pista-usada"]:checked')).map(function(x){return x.value;});
  var FB=await esperarFB(); await FB.gravarServidor(STATE.eu.codigo,'deducoes',STATE.eu.id,dados,'submetidoEm');
}
async function finalizarPartida(){
  var sol=CASO.solucao||{}, deducoes=STATE.v5.deducoes.map(function(d){
    var campos=['motivo','acao','prova','lacuna'].reduce(function(n,k){return n+(d[k]===sol[k]?1:0);},0);
    var submetidoMs=d.submetidoEm&&d.submetidoEm.toMillis?d.submetidoEm.toMillis():(d.submetidoMs||0);
    return Object.assign({},d,{submetidoMs:submetidoMs,suspeitoCorreto:d.suspeito===sol.suspeito,camposCorretos:campos,usouPistaAdquirida:(d.pistasUsadas||[]).length>0});
  });
  var perf=MosaicoV5.dividirVoto(STATE.votos,STATE.jogadores.map(function(j){return j.id;}),5);
  var coopInd={};
  STATE.jogadores.forEach(function(j){coopInd[j.id]=0;});
  var numeros=Array.from(new Set(STATE.jogadores.map(function(j){return j.nucleo;})));
  numeros.forEach(function(n){
    var ids=STATE.jogadores.filter(function(j){return j.nucleo===n;}).map(function(j){return j.id;});
    var pontos;
    if(ids.length===2) pontos=Object.fromEntries(ids.map(function(id){return [id,5];}));
    else pontos=MosaicoV5.dividirVoto(STATE.v5.cooperacao.filter(function(v){return v.nucleo===n;}),ids,10);
    Object.assign(coopInd,pontos);
  });
  function msNucleo(n){return n.concluidoEm&&n.concluidoEm.toMillis?n.concluidoEm.toMillis():(n.concluidoMs||0);}
  var concluidos=STATE.v5.nucleos.filter(function(n){return n.concluidoEm||n.concluidoMs;}).sort(function(a,b){return msNucleo(a)-msNucleo(b);});
  var escala=[20,16,12,8], coletivo={};
  STATE.jogadores.forEach(function(j){var pos=concluidos.findIndex(function(n){return Number(n.id)===Number(j.nucleo);}); coletivo[j.id]=pos<0?0:(escala[pos]==null?4:escala[pos]);});
  var negociacoes=STATE.v5.negociacoes.map(function(n){
    var pista=Object.keys(CASO.pistas||{}).map(function(k){return CASO.pistas[k];}).find(function(p){return p.id===n.pistaId;});
    return Object.assign({},n,{qualidade:(pista&&pista.qualidade)||'mediana'});
  });
  var placar=MosaicoV5.calcular({jogadores:STATE.jogadores,deducoes:deducoes,negociacoes:negociacoes,coopColetiva:coletivo,coopIndividual:coopInd,performance:perf});
  var FB=await esperarFB();
  for(var i=0;i<placar.length;i++) await FB.atualizarJogador(STATE.mesa.codigo,placar[i].id,{total:placar[i].total,pontuacao:placar[i].componentes,economiaDetalhe:placar[i].economia});
  await FB.atualizarMesa(STATE.mesa.codigo,{fase:'resultado',reveladaEmMs:Date.now(),solucao:sol});
}

/* ============================================================
   INIT — se a URL tem ?sala=, vai direto para a tela de entrada
   ============================================================ */
/* ============================================================
   ABERTURA
   O mesmo elemento de video serve as duas funcoes: primeiro toca
   inteiro, com som, em tela cheia; depois vira pano de fundo mudo
   e em loop. Assim o arquivo de 10 MB e baixado uma vez so.
   ============================================================ */
(function ligaVideo(){
  var v=document.getElementById("video-abertura");
  var portao=document.getElementById("portao");
  if(!v||!portao) return;

  var jaViu=false;
  try{ jaViu = sessionStorage.getItem("mosaico_abertura")==="1"; }catch(e){}
  var entrandoNaSala=false;
  try{ entrandoNaSala = !!new URLSearchParams(location.search).get("sala"); }catch(e){}

  /* quem chega pelo QR quer entrar na mesa, nao assistir abertura */
  if(jaViu || entrandoNaSala){ semPortao(); }
  else { document.body.classList.add("portao"); }

  function sincronizaIconeSom(){
    var b=document.getElementById("btn-som");
    if(!b) return;
    b.innerHTML = v.muted ? "&#128263;" : "&#128266;";
    b.classList.toggle("on", !v.muted);
  }

  function semPortao(){
    document.body.classList.remove("portao");
    portao.classList.add("saindo");
    /* pulando a abertura, o video ja entra como fundo: mudo e em loop */
    v.muted=true; v.loop=true;
    sincronizaIconeSom();
    setTimeout(function(){ portao.style.display="none"; },1300);
  }

  function viraFundo(){
    try{ sessionStorage.setItem("mosaico_abertura","1"); }catch(e){}
    v.muted=true; v.loop=true;
    var t=v.play(); if(t&&t.catch) t.catch(function(){});
    semPortao();
  }

  /* o toque libera o som: e a unica porta que o navegador aceita */
  var comecouEm=0;
  function abrirComSom(){
    telaCheia();          /* o toque do portao e o gesto que libera as duas coisas */
    portao.classList.add("tocando");
    v.muted=false; v.loop=false; v.volume=1;
    comecouEm=Date.now();

    function arranca(){
      var t=v.play();
      if(t&&t.catch) t.catch(function(){
        v.muted=true; sincronizaIconeSom(); v.play();
      });
    }
    /* Rebobinar e assincrono. Se der play antes do seek terminar, o video
       toca no fim e dispara um "ended" na hora — que apagaria o som que a
       pessoa acabou de liberar. Por isso espera o seeked.               */
    if(v.currentTime>0.2){
      var aoVoltar=function(){ v.removeEventListener("seeked",aoVoltar); arranca(); };
      v.addEventListener("seeked",aoVoltar);
      try{ v.currentTime=0; }
      catch(e){ v.removeEventListener("seeked",aoVoltar); arranca(); }
    } else {
      arranca();
    }
    sincronizaIconeSom();
  }

  portao.addEventListener("click",function(e){
    if(e.target.id==="btn-pular"){ viraFundo(); return; }
    if(!portao.classList.contains("tocando")) abrirComSom();
  });

  /* Controle remoto de TV: nao ha toque. OK/Enter/Espaco fazem o mesmo,
     e o botao recebe foco sozinho para o primeiro OK ja valer.        */
  document.addEventListener("keydown",function(e){
    if(portao.style.display==="none") return;
    var k=e.key;
    if(k==="Enter"||k===" "||k==="Spacebar"||k==="OK"||e.keyCode===13||e.keyCode===32){
      e.preventDefault();
      if(portao.classList.contains("tocando")) viraFundo();
      else abrirComSom();
    }
  });
  if(document.body.classList.contains("portao")){
    setTimeout(function(){
      var b=document.getElementById("btn-comecar");
      if(b) try{ b.focus(); }catch(e){}
    },400);
  }

  /* controles soltos na tela de abertura */
  window.repetirAbertura=function(){
    portao.style.display="";
    portao.classList.remove("saindo");
    portao.classList.add("tocando");
    document.body.classList.add("portao");
    abrirComSom();
  };
  window.alternarSom=function(){
    v.muted=!v.muted;
    if(!v.muted){ v.volume=1; var t=v.play(); if(t&&t.catch) t.catch(function(){}); }
    sincronizaIconeSom();
  };
  var bR=document.getElementById("btn-repetir");
  var bS=document.getElementById("btn-som");
  if(bR) bR.addEventListener("click",function(){ window.repetirAbertura(); });
  if(bS) bS.addEventListener("click",function(){ window.alternarSom(); });
  var bC=document.getElementById("btn-cheia");
  if(bC) bC.addEventListener("click",function(){
    alternarTelaCheia();
    setTimeout(function(){ bC.classList.toggle("on", jaEmTelaCheia()); },300);
  });

  /* cinto de seguranca: "ended" logo apos rebobinar e espurio, ignora */
  v.addEventListener("ended", function(){
    if(Date.now()-comecouEm < 1200) return;
    viraFundo();
  });
  v.addEventListener("canplay",function(){
    v.classList.add("tocando");
    document.body.classList.add("com-video");
    if(!document.body.classList.contains("portao")){
      var t=v.play(); if(t&&t.catch) t.catch(function(){});
    }
  });
  v.addEventListener("error",function(){
    v.classList.remove("tocando");
    document.body.classList.remove("com-video");
    semPortao();   /* sem video, nao existe portao */
  });
  v.src="img/abertura.mp4";
  setTimeout(function(){ if(!v.readyState) semPortao(); },8000);
})();

(function init(){
  var q=null;
  try{ q=new URLSearchParams(location.search); }catch(e){}
  if(q && q.get("sala")) STATE.tela="entrar";

  /* ?caso=nome carrega casos/nome.json e troca a historia inteira.
     Sem o parametro, roda A Casa da Costa, que ja vem embutida.     */
  var nomeCaso = q ? q.get("caso") : null;
  if(nomeCaso && /^[a-z0-9-]{1,40}$/.test(nomeCaso)){
    fetch("casos/"+nomeCaso+".json")
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(c){ aplicarCaso(c); render(); })
      .catch(function(e){
        console.error("caso", e);
        avisa("Caso não encontrado — usando A Casa da Costa");
        render();
      });
  }
  render();
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc,
  collection, onSnapshot, serverTimestamp, getDocs, runTransaction
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

/* ══════════════════════════════════════════════════════════════════
   CONFIGURACAO DO FIREBASE — PROJETO PROPRIO DO MOSAICO

   Este jogo NAO deve compartilhar projeto com o Laboratorio do
   Pesquisador. Cole aqui a config do projeto novo:

   console.firebase.google.com  ->  seu projeto do Mosaico
   ->  engrenagem  ->  Configuracoes do projeto
   ->  Seus apps  ->  app da Web  ->  Configuracao do SDK

   Estas chaves sao PUBLICAS por natureza (vao no cliente, qualquer
   pessoa ve o codigo-fonte). Quem protege os dados sao as Regras do
   Firestore, nao a chave. As regras necessarias estao no README.
   ══════════════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey:            "AIzaSyDwshZbqaMOKxdRuyLtdpbijPRdrjVOcxE",
  authDomain:        "mosaico-game.firebaseapp.com",
  projectId:         "mosaico-game",
  storageBucket:     "mosaico-game.firebasestorage.app",
  messagingSenderId: "436141261767",
  appId:             "1:436141261767:web:6a83555a2f7c4ed4550fe2"
};

const CONFIGURADO = firebaseConfig.apiKey !== "COLE_AQUI";
const RAIZ = "mosaico";

if(!CONFIGURADO){
  window.MOSAICO_SEM_CONFIG = true;
  window.dispatchEvent(new Event("mosaicofb-ready"));
  console.warn("MOSAICO: firebaseConfig não preenchido — modo offline.");
}

const app  = CONFIGURADO ? initializeApp(firebaseConfig) : null;
const db   = CONFIGURADO ? getFirestore(app) : null;
const auth = CONFIGURADO ? getAuth(app) : null;

/* login anonimo: ninguem cria conta, mas as Regras podem exigir
   request.auth != null em vez de deixar a colecao aberta ao mundo */
let _uid = null;
const prontoAuth = CONFIGURADO ? new Promise(res => {
  onAuthStateChanged(auth, u => { if(u){ _uid = u.uid; res(u.uid); } });
  signInAnonymously(auth).catch(e => {
    console.error("Login anônimo falhou — ative Authentication > Anônimo", e);
    res(null);
  });
}) : Promise.resolve(null);

if(CONFIGURADO) window.MosaicoFB = {
  db,
  async pronto(){ return prontoAuth; },
  uid(){ return _uid; },
  async criarMesa(codigo, modo){
    await prontoAuth;
    await setDoc(doc(db, RAIZ, codigo), {
      ativa:true, fase:"sala", vez:0, modo:modo||"com-telao",
      criadaEm:serverTimestamp(), criadaEmMs:Date.now()
    });
    return codigo;
  },
  async mesaAtiva(codigo){
    await prontoAuth;
    const s = await getDoc(doc(db, RAIZ, codigo));
    return s.exists() && s.data().ativa === true;
  },
  async atualizarMesa(codigo, dados){
    await updateDoc(doc(db, RAIZ, codigo), dados);
  },
  ouvirMesa(codigo, cb){
    return onSnapshot(doc(db, RAIZ, codigo),
      s => cb(s.exists() ? s.data() : null),
      e => { console.error("ouvirMesa", e); });
  },
  async entrarJogador(codigo, id, dados){
    await setDoc(doc(db, RAIZ, codigo, "jogadores", id),
                 { ...dados, atualizadoEmMs: Date.now() }, { merge:true });
  },
  async atualizarJogador(codigo, id, dados){
    await setDoc(doc(db, RAIZ, codigo, "jogadores", id),
                 { ...dados, atualizadoEmMs: Date.now() }, { merge:true });
  },
  ouvirJogadores(codigo, cb){
    return onSnapshot(collection(db, RAIZ, codigo, "jogadores"), snap => {
      const l = []; snap.forEach(d => l.push({ id:d.id, ...d.data() })); cb(l);
    }, e => { console.error("ouvirJogadores", e); cb([]); });
  },
  async listarJogadores(codigo){
    await prontoAuth;
    const snap = await getDocs(collection(db, RAIZ, codigo, "jogadores"));
    const l = []; snap.forEach(d => l.push({ id:d.id, ...d.data() }));
    return l;
  },
  async votar(codigo, deId, paraId){
    await setDoc(doc(db, RAIZ, codigo, "votos", deId),
                 { de:deId, para:paraId, ms:Date.now() });
  },
  ouvirVotos(codigo, cb){
    return onSnapshot(collection(db, RAIZ, codigo, "votos"), snap => {
      const l = []; snap.forEach(d => l.push({ id:d.id, ...d.data() })); cb(l);
    }, e => { console.error("ouvirVotos", e); cb([]); });
  },
  async publicar(codigo, ordem, dados){
    await setDoc(doc(db, RAIZ, codigo, "publicas", String(ordem)), dados);
  },
  ouvirPublicas(codigo, cb){
    return onSnapshot(collection(db, RAIZ, codigo, "publicas"), snap => {
      const l = []; snap.forEach(d => l.push({ id:d.id, ...d.data() })); cb(l);
    }, e => { console.error("ouvirPublicas", e); cb([]); });
  },
  async gravar(codigo, colecao, id, dados){
    await setDoc(doc(db, RAIZ, codigo, colecao, id), dados, {merge:true});
  },
  async gravarServidor(codigo, colecao, id, dados, campo){
    await setDoc(doc(db, RAIZ, codigo, colecao, id), {...dados,[campo]:serverTimestamp()}, {merge:true});
  },
  ouvirColecao(codigo, nome, cb){
    return onSnapshot(collection(db, RAIZ, codigo, nome), snap => {
      const l=[]; snap.forEach(d=>l.push({id:d.id,...d.data()})); cb(l);
    }, e=>{ console.error("ouvirColecao "+nome,e); cb([]); });
  },
  async concluirNucleo(codigo, id, dados){
    const ref=doc(db,RAIZ,codigo,"nucleos",id);
    await runTransaction(db,async tx=>{
      const atual=await tx.get(ref);
      if(atual.exists()&&(atual.data().concluidoEm||atual.data().concluidoMs)) return;
      tx.set(ref,{...dados,concluidoEm:serverTimestamp()},{merge:true});
    });
  },
  async comprarOferta(codigo, ofertaId, compradorId){
    const ofertaRef=doc(db,RAIZ,codigo,"ofertas",ofertaId);
    const compradorRef=doc(db,RAIZ,codigo,"jogadores",compradorId);
    await runTransaction(db,async tx=>{
      const ofertaSnap=await tx.get(ofertaRef);
      if(!ofertaSnap.exists()||ofertaSnap.data().status!=="aberta") throw new Error("Oferta indisponível.");
      const oferta=ofertaSnap.data();
      if(oferta.vendedorId===compradorId) throw new Error("Você não pode comprar a própria pista.");
      const vendedorRef=doc(db,RAIZ,codigo,"jogadores",oferta.vendedorId);
      const compradorSnap=await tx.get(compradorRef), vendedorSnap=await tx.get(vendedorRef);
      if(!compradorSnap.exists()||!vendedorSnap.exists()) throw new Error("Jogador desconectado.");
      const comprador=compradorSnap.data(), vendedor=vendedorSnap.data();
      if((comprador.moedas||0)<oferta.preco) throw new Error("Moedas insuficientes.");
      const pista=(vendedor.pistas||[]).find(p=>p.id===oferta.pistaId);
      if(!pista) throw new Error("Pista não encontrada.");
      const jaTem=(comprador.pistas||[]).some(p=>p.id===pista.id);
      const novas=jaTem?(comprador.pistas||[]):(comprador.pistas||[]).concat([{...pista,adquirida:true,compradaDe:oferta.vendedorId}]);
      tx.set(compradorRef,{moedas:(comprador.moedas||0)-oferta.preco,pistas:novas},{merge:true});
      tx.set(vendedorRef,{moedas:(vendedor.moedas||0)+oferta.preco},{merge:true});
      tx.set(ofertaRef,{status:"comprada",compradorId,compradaMs:Date.now()},{merge:true});
      tx.set(doc(db,RAIZ,codigo,"negociacoes",ofertaId),{...oferta,status:"comprada",compradorId,compradaMs:Date.now()});
    });
  }
};

window.dispatchEvent(new Event("mosaicofb-ready"));
console.log("MosaicoFB ready");
</script>
