<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOSAICO · Telão</title><style>:root{color-scheme:dark;--g:#70d6a0;--ink:#eef5f2;--muted:#8fa4ad}*{box-sizing:border-box}body{margin:0;background:#050b12;color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}.wrap{padding:2.4vw;display:grid;gap:1.5vw}.top{display:grid;grid-template-columns:1fr auto;gap:2vw;align-items:center;border:1px solid #3c5d70;background:linear-gradient(155deg,#142331,#08131c);padding:1.4vw 1.8vw;border-radius:1vw;box-shadow:0 .45vw 0 #020609,0 1.4vw 3vw #0008}.brand b{font:800 clamp(36px,5vw,78px)/.9 Georgia,serif;color:#efc878}.brand span{display:block;margin-top:.6vw;font-size:clamp(14px,1.5vw,25px);color:var(--muted)}.turn{text-align:right}.turn small{display:block;color:#efc878;font-weight:800;letter-spacing:.15em}.turn b{font-size:clamp(28px,3.5vw,58px)}.turn strong{display:block;font:800 clamp(34px,5vw,78px)/1 monospace;color:#fff}.question{border:1px solid #3d9a68;background:linear-gradient(155deg,#10271f,#07110f);padding:1.4vw 1.8vw;border-radius:1vw;box-shadow:inset .25vw 0 var(--g),0 .45vw 0 #020609}.question small{color:#8ce4b0;font-weight:800;letter-spacing:.12em}.question h1{font:700 clamp(25px,3vw,50px)/1.15 monospace;color:var(--g);margin:.7vw 0 0}.fields{display:grid;grid-template-columns:repeat(5,1fr);gap:.8vw}.field{min-width:0;border:1px solid #579c78;background:#091813;padding:1vw;border-radius:.8vw;box-shadow:inset .18vw 0 #79d6a1,0 .35vw 0 #020609}.field b{display:block;font-size:clamp(13px,1.35vw,23px)}.field span{display:block;margin-top:.55vw;color:#8ce4b0;font:800 clamp(10px,1vw,17px) monospace}.players{border:1px solid #415c70;background:linear-gradient(155deg,#142331,#071019);padding:1.2vw;border-radius:1vw}.players h2{margin:0 0 .8vw;font:600 clamp(22px,2.5vw,42px) Georgia,serif}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.7vw}.player{border:1px solid #526c7b;border-left:.3vw solid #70a8c6;background:#08131b;padding:.8vw;border-radius:.65vw}.player b{display:block;font-size:clamp(12px,1.25vw,21px)}.player span{color:var(--muted);font:700 clamp(9px,.9vw,15px) monospace}.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#020609a8;padding:6vw}.overlay.on{display:flex}.event{width:min(78vw,1200px);padding:4vw;border:2px solid var(--g);border-radius:1.5vw;text-align:center;background:linear-gradient(155deg,#123324,#06120d);box-shadow:0 2vw 7vw #000}.event small{font:900 clamp(20px,2vw,34px) monospace;color:#8ce4b0;letter-spacing:.18em}.event h2{font:700 clamp(48px,7vw,110px)/.95 Georgia,serif;margin:1.4vw 0;color:white}.event b{font:800 clamp(28px,4vw,66px) monospace;color:var(--g)}.waiting{padding:12vh 5vw;text-align:center}.waiting h1{font:700 clamp(55px,8vw,120px) Georgia,serif;color:#efc878}.waiting p{font-size:clamp(20px,2vw,34px);color:var(--muted)}.opening{position:fixed;inset:0;z-index:100;background:#020609;display:none}.opening.on{display:grid;place-items:center}.opening img{width:100%;height:100%;object-fit:contain}.openbox{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);width:min(620px,90vw);padding:16px;background:#071014e8;border:1px solid #405866;border-radius:14px;text-align:center}.openbox h2{font:600 clamp(25px,3vw,42px) Georgia,serif;color:#efc878;margin:0 0 8px}.openbox button{min-height:52px;border:0;border-radius:9px;padding:10px 18px;background:linear-gradient(#ffc266,#dd8b2e);color:#1b1005;font-weight:900}.opencontrols{display:none;gap:8px;justify-content:center;margin-top:10px}.opencontrols.on{display:flex}.opencontrols button{background:#10202a;color:#eef5f2;border:1px solid #506976}@media(max-width:800px){.fields{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}</style></head><body><div id="root" class="waiting"><h1>MOSAICO</h1><p>Conectando à exibição pública…</p></div><div id="overlay" class="overlay"><div class="event"><small>CAMPO FECHADO</small><h2 id="eventField"></h2><b id="eventBy"></b></div></div><div id="opening" class="opening"><img src="Abertura.jpg" alt="Abertura de A Manhã do Carro-Forte"><audio id="openingAudio" preload="auto" src="Amanha-do-carroforte.mp3"></audio><div class="openbox"><h2>📓 Abertura da reunião</h2><p id="openingMsg">O áudio público será reproduzido somente neste telão.</p><button id="openingStart">🔊 Entendi · ativar som e iniciar</button><div id="openControls" class="opencontrols"><button id="openPause">⏸ Pausar</button><button id="openRestart">↻ Reiniciar</button><button id="openSkip">Pular abertura</button></div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getFirestore,doc,onSnapshot,collection}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const cfg={apiKey:'AIzaSyA160bkgHBrYwvIxlENax-aAyLWPMaOU4',authDomain:'mosaico-noite.firebaseapp.com',projectId:'mosaico-noite',storageBucket:'mosaico-noite.firebasestorage.app',messagingSenderId:'703343424116',appId:'1:703343424116:web:e6990b5c00d43aca6e9721'},db=getFirestore(initializeApp(cfg,'dragon-telao-'+Date.now())),p=new URLSearchParams(location.search),code=(p.get('sala')||'').toUpperCase(),openingMode=p.get('abertura')==='1';let room=null,players=[],baseline=true,lastEvent='';const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function render(){if(!room)return;const pub=room.publicState||{},fs=pub.fields||[],ps=pub.players?.length?pub.players:players;root.className='wrap';root.innerHTML=`<section class="top"><div class="brand"><b>MOSAICO</b><span>A Noite · A Manhã do Carro-Forte</span></div><div class="turn"><small>VEZ</small><b>${esc(pub.turnName||'—')}</b><strong>${esc(pub.timer||'00:00')}</strong></div></section><section class="question"><small>${esc(pub.questionTitle||'PERGUNTA')}</small><h1>${esc(pub.questionText||'Aguardando a pergunta da mesa…')}</h1></section><section class="fields">${fs.length?fs.map(f=>`<article class="field"><b>${esc(f.label)}</b><span>${f.closed?'FECHADO · '+esc(f.closedBy||'—'):'EM ABERTO'}</span></article>`).join(''):'<article class="field"><b>Campos da pergunta</b><span>AGUARDANDO</span></article>'}</section><section class="players"><h2>Jogadores conectados</h2><div class="grid">${ps.map(x=>`<article class="player"><b>${esc(x.name||x.nome||'Jogador')}</b><span>${esc(x.fragments??x.fragmentos??0)} fragmentos · ${esc(x.state||'conectado')}</span></article>`).join('')}</div></section>`;const ev=pub.lastFieldEvent;if(ev?.id&&ev.id!==lastEvent){if(!baseline)showEvent(ev);lastEvent=ev.id}baseline=false}function showEvent(e){eventField.textContent=e.fieldLabel||'Campo';eventBy.textContent=e.by||'Jogador';overlay.classList.add('on');setTimeout(()=>overlay.classList.remove('on'),3000)}if(openingMode){opening.classList.add('on');openingStart.onclick=async()=>{try{await openingAudio.play();openingStart.style.display='none';openingMsg.textContent='A abertura está em andamento.';openControls.classList.add('on')}catch{openingMsg.textContent='O navegador bloqueou o áudio. Toque novamente para ativar.'}};openPause.onclick=()=>{if(openingAudio.paused){openingAudio.play();openPause.textContent='⏸ Pausar'}else{openingAudio.pause();openPause.textContent='▶ Continuar'}};openRestart.onclick=()=>{openingAudio.currentTime=0;openingAudio.play();openPause.textContent='⏸ Pausar'};const done=()=>{openingAudio.pause();opening.classList.remove('on')};openSkip.onclick=done;openingAudio.onended=()=>setTimeout(done,900)}if(!code){root.innerHTML='<h1>MOSAICO</h1><p>Código da sala ausente.</p>'}else{onSnapshot(doc(db,'noite',code),s=>{room=s.exists()?s.data():null;if(!room){root.innerHTML='<h1>MOSAICO</h1><p>Sala indisponível.</p>';return}render()});onSnapshot(collection(db,'noite',code,'jogadores'),s=>{players=s.docs.map(d=>d.data()).map(x=>({name:x.nome,fragments:x.fragmentos||0,state:'conectado'}));render()})}</script></body></html>
