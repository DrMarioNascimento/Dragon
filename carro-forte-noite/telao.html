<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOSAICO · Telão</title><style>:root{color-scheme:dark;--g:#70d6a0;--ink:#eef5f2;--muted:#8fa4ad}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#050b12;color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{padding:2.4vw;display:grid;gap:1.5vw}.top{display:grid;grid-template-columns:1fr auto;gap:2vw;align-items:center;border:1px solid #3c5d70;background:#0c1821;padding:1.4vw 1.8vw;border-radius:1vw}.brand b{font:800 clamp(36px,5vw,78px)/.9 Georgia,serif;color:#efc878}.brand span{display:block;margin-top:.6vw;color:var(--muted)}.turn{text-align:right}.turn small{display:block;color:#efc878;font-weight:800}.turn b{font-size:clamp(28px,3.5vw,58px)}.turn strong{display:block;font:800 clamp(34px,5vw,78px)/1 monospace}.question,.players{border:1px solid #3d5e70;background:#0a171f;padding:1.4vw;border-radius:1vw}.question h1{color:var(--g);font:700 clamp(25px,3vw,50px)/1.15 monospace}.fields,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.8vw}.field,.player{border:1px solid #526c7b;border-left:.3vw solid #70a8c6;background:#08131b;padding:.8vw;border-radius:.65vw}.waiting{padding:12vh 5vw;text-align:center}.waiting h1{font:700 clamp(55px,8vw,120px) Georgia,serif;color:#efc878}.waiting p{font-size:clamp(20px,2vw,34px);color:var(--muted)}.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#020609a8;padding:6vw}.overlay.on{display:flex}.event{width:min(78vw,1200px);padding:4vw;border:2px solid var(--g);border-radius:1.5vw;text-align:center;background:#0b2519}.event h2{font:700 clamp(48px,7vw,110px)/.95 Georgia,serif}.opening{position:fixed;inset:0;z-index:100;background:#020609;display:none;overflow:hidden}.opening.on{display:block}.opening-media{position:absolute;inset:0;display:grid;place-items:center}.opening img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.opening-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,#020609d9)}.openbox{position:absolute;z-index:3;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,92vw);padding:18px;background:#071014f2;border:1px solid #526a77;border-radius:14px;text-align:center;box-shadow:0 18px 55px #000}.openbox h2{font:600 clamp(26px,3vw,44px) Georgia,serif;color:#efc878;margin:0 0 8px}.openbox p{color:#b7c4ca}.openbox button{min-height:52px;border:0;border-radius:9px;padding:10px 18px;background:linear-gradient(#ffc266,#dd8b2e);color:#1b1005;font-weight:900}.opencontrols{display:none;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.opencontrols.on{display:flex}.opencontrols button{background:#10202a;color:#eef5f2;border:1px solid #506976}@media(max-width:800px){.fields,.grid{grid-template-columns:1fr 1fr}}</style></head><body><div id="root" class="waiting"><h1>MOSAICO</h1><p>Conectando à exibição pública…</p></div><div id="overlay" class="overlay"><div class="event"><small>CAMPO FECHADO</small><h2 id="eventField"></h2><b id="eventBy"></b></div></div><div id="opening" class="opening"><div class="opening-media"><img id="openingImage" src="./Abertura.jpg?v=20260831-opening2" alt="Abertura de A Manhã do Carro-Forte"><div class="opening-shade"></div></div><audio id="openingAudio" preload="metadata" src="./Amanha-do-carroforte.mp3?v=20260831-opening2"></audio><div class="openbox"><h2>📓 Abertura da reunião</h2><p id="openingMsg">Imagem pronta. Ative o som para iniciar a narração pública.</p><button id="openingStart">🔊 Entendi · ativar som e iniciar</button><div id="openControls" class="opencontrols"><button id="openPause">⏸ Pausar</button><button id="openRestart">↻ Reiniciar</button><button id="openSkip">Pular abertura</button></div></div></div><script>/* A abertura é inicializada antes do Firebase para nunca depender da conexão da sala. */(function(){const p=new URLSearchParams(location.search),openingMode=p.get('abertura')==='1'||p.get('opening')==='1';if(!openingMode)return;const stage=document.getElementById('opening'),audio=document.getElementById('openingAudio'),start=document.getElementById('openingStart'),msg=document.getElementById('openingMsg'),controls=document.getElementById('openControls'),pause=document.getElementById('openPause'),restart=document.getElementById('openRestart'),skip=document.getElementById('openSkip'),img=document.getElementById('openingImage');stage.classList.add('on');img.onerror=()=>{msg.textContent='A imagem não pôde ser carregada. O áudio ainda pode ser iniciado.'};audio.onerror=()=>{msg.textContent='O áudio não pôde ser carregado. Verifique a conexão e tente novamente.'};start.onclick=async()=>{try{audio.currentTime=0;await audio.play();start.style.display='none';msg.textContent='A abertura está em andamento.';controls.classList.add('on')}catch(e){msg.textContent='Toque novamente para permitir a reprodução do áudio.'}};pause.onclick=async()=>{if(audio.paused){await audio.play();pause.textContent='⏸ Pausar'}else{audio.pause();pause.textContent='▶ Continuar'}};restart.onclick=async()=>{audio.currentTime=0;await audio.play();pause.textContent='⏸ Pausar'};const done=()=>{audio.pause();stage.classList.remove('on')};skip.onclick=done;audio.onended=()=>setTimeout(done,900);window.MosaicoTelaoOpening={active:true,done}})();</script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getFirestore,doc,onSnapshot,collection}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const cfg={apiKey:'AIzaSyA160bkgHBrYwvIxlENax-aAyLWPMaOU4',authDomain:'mosaico-noite.firebaseapp.com',projectId:'mosaico-noite',storageBucket:'mosaico-noite.firebasestorage.app',messagingSenderId:'703343424116',appId:'1:703343424116:web:e6990b5c00d43aca6e9721'},db=getFirestore(initializeApp(cfg,'dragon-telao-'+Date.now())),p=new URLSearchParams(location.search),code=(p.get('sala')||'').toUpperCase();let room=null,players=[],baseline=true,lastEvent='';const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function render(){if(!room)return;const pub=room.publicState||{},fs=pub.fields||[],ps=pub.players?.length?pub.players:players;root.className='wrap';root.innerHTML=`<section class="top"><div class="brand"><b>MOSAICO</b><span>A Noite · A Manhã do Carro-Forte</span></div><div class="turn"><small>VEZ</small><b>${esc(pub.turnName||'—')}</b><strong>${esc(pub.timer||'00:00')}</strong></div></section><section class="question"><small>${esc(pub.questionTitle||'PERGUNTA')}</small><h1>${esc(pub.questionText||'Aguardando a pergunta da mesa…')}</h1></section><section class="fields">${fs.length?fs.map(f=>`<article class="field"><b>${esc(f.label)}</b><span>${f.closed?'FECHADO · '+esc(f.closedBy||'—'):'EM ABERTO'}</span></article>`).join(''):'<article class="field"><b>Campos da pergunta</b><span>AGUARDANDO</span></article>'}</section><section class="players"><h2>Jogadores conectados</h2><div class="grid">${ps.map(x=>`<article class="player"><b>${esc(x.name||x.nome||'Jogador')}</b><span>${esc(x.fragments??x.fragmentos??0)} fragmentos · ${esc(x.state||'conectado')}</span></article>`).join('')}</div></section>`;const ev=pub.lastFieldEvent;if(ev?.id&&ev.id!==lastEvent){if(!baseline){eventField.textContent=ev.fieldLabel||'Campo';eventBy.textContent=ev.by||'Jogador';overlay.classList.add('on');setTimeout(()=>overlay.classList.remove('on'),3000)}lastEvent=ev.id}baseline=false}if(!code){root.innerHTML='<h1>MOSAICO</h1><p>Código da sala ausente.</p>'}else{onSnapshot(doc(db,'noite',code),s=>{room=s.exists()?s.data():null;if(!room){root.innerHTML='<h1>MOSAICO</h1><p>Sala indisponível.</p>';return}render()});onSnapshot(collection(db,'noite',code,'jogadores'),s=>{players=s.docs.map(d=>d.data()).map(x=>({name:x.nome,fragments:x.fragmentos||0,state:'conectado'}));render()})}</script></body></html>
