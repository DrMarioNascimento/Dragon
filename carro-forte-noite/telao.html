<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOSAICO · Telão</title><style>:root{color-scheme:dark;--g:#70d6a0;--ink:#eef5f2;--muted:#8fa4ad}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#050b12;color:var(--ink);font-family:Inter,system-ui,sans-serif}.wall{position:fixed;inset:0;background:#050b12 url('./Papel-de-Parede-CarroforteTelao.jpg?v=20260831-wall6') center/cover no-repeat;z-index:-2}.wall:after{content:'';position:absolute;inset:0;background:#02060955}.waiting{min-height:100vh;display:grid;place-items:center;text-align:center;padding:8vh 5vw}.waiting-card{padding:2vw 3vw;background:#061018df;border:1px solid #3c5d70;border-radius:1vw}.waiting h1{margin:0;font:700 clamp(55px,8vw,120px) Georgia,serif;color:#efc878}.waiting p{font-size:clamp(20px,2vw,34px);color:#d2dde2}.ready-btn{min-height:58px;border:0;border-radius:10px;padding:12px 22px;background:linear-gradient(#ffc266,#dd8b2e);color:#1b1005;font-weight:900;font-size:clamp(16px,1.5vw,24px)}.opening{position:fixed;inset:0;z-index:100;background:#020609;display:none;overflow:hidden}.opening.on{display:block}.opening-media{position:absolute;inset:0;display:grid;place-items:center}.opening img{width:100%;height:100%;object-fit:contain}.opening-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 62%,#020609c9)}.openbox{position:absolute;z-index:3;left:50%;bottom:3vh;transform:translateX(-50%);width:min(680px,92vw);padding:14px;background:#071014ed;border:1px solid #526a77;border-radius:14px;text-align:center}.openbox h2{font:600 clamp(26px,3vw,44px) Georgia,serif;color:#efc878;margin:0}.openbox p{color:#b7c4ca}.opencontrols{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.opencontrols button{min-height:48px;border:1px solid #506976;border-radius:8px;background:#10202a;color:#eef5f2;padding:8px 13px;font-weight:800}.wrap{padding:2.4vw;display:grid;gap:1.5vw}.top,.question,.players,.field,.player{backdrop-filter:blur(12px)}.top{display:grid;grid-template-columns:1fr auto;gap:2vw;align-items:center;border:1px solid #3c5d70;background:#0c1821e8;padding:1.4vw 1.8vw;border-radius:1vw}.brand b{font:800 clamp(36px,5vw,78px)/.9 Georgia,serif;color:#efc878}.brand span{display:block;color:var(--muted)}.turn{text-align:right}.turn strong{display:block;font:800 clamp(34px,5vw,78px)/1 monospace}.question,.players{border:1px solid #3d5e70;background:#0a171fe8;padding:1.4vw;border-radius:1vw}.question h1{color:var(--g);font:700 clamp(25px,3vw,50px)/1.15 monospace}.fields,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.8vw}.field,.player{border:1px solid #526c7b;border-left:.3vw solid #70a8c6;background:#08131be8;padding:.8vw;border-radius:.65vw}@media(max-width:800px){.fields,.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wall"></div><div id="root" class="waiting"><div class="waiting-card"><h1>MOSAICO</h1><p id="waitMsg">📺 Conectando o Telão…</p><button id="readyBtn" class="ready-btn" style="display:none">🔊 Entendi · ativar som</button></div></div><div id="opening" class="opening"><div class="opening-media"><img src="./AberturaTelão.jpg?v=20260831-opening6" alt="Abertura de A Manhã do Carro-Forte no telão"><div class="opening-shade"></div></div><audio id="openingAudio" preload="auto" src="./Amanha-do-carroforte.mp3?v=20260831-opening6"></audio><div class="openbox"><h2>📓 Abertura da reunião</h2><p>A abertura está em andamento.</p><div class="opencontrols"><button id="openPause">⏸ Pausar</button><button id="openRestart">↻ Reiniciar</button><button id="openSkip">Pular abertura</button></div></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{getFirestore,doc,updateDoc,onSnapshot,collection}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const cfg={apiKey:'AIzaSyA160bkgHBrYwvIxlENax-aAyLWPMaOU4',authDomain:'mosaico-noite.firebaseapp.com',projectId:'mosaico-noite',storageBucket:'mosaico-noite.firebasestorage.app',messagingSenderId:'703343424116',appId:'1:703343424116:web:e6990b5c00d43aca6e9721'},app=initializeApp(cfg,'dragon-telao-'+Date.now()),auth=getAuth(app),db=getFirestore(app),p=new URLSearchParams(location.search),code=(p.get('sala')||'').toUpperCase(),roomRef=code?doc(db,'noite',code):null,audio=document.getElementById('openingAudio'),stage=document.getElementById('opening');let room=null,players=[],armed=false,lastToken=0,activeToken=0,heartbeat=null;const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function patchOpening(data){if(!roomRef)return;const patch={'opening.displaySeenMs':Date.now()};for(const[k,v]of Object.entries(data))patch['opening.'+k]=v;await updateDoc(roomRef,patch)}function beat(){clearInterval(heartbeat);heartbeat=setInterval(()=>patchOpening({displaySeenMs:Date.now()}).catch(()=>{}),5000)}async function connect(){if(!code){waitMsg.textContent='Código da sala ausente.';return}try{await signInAnonymously(auth);waitMsg.textContent='📺 Telão conectado. Ative o áudio para continuar.';readyBtn.style.display='inline-block';beat()}catch(e){waitMsg.textContent='Não foi possível autenticar o Telão. Reabra o QR.'}}readyBtn.onclick=async()=>{try{audio.muted=true;await audio.play();audio.pause();audio.currentTime=0;audio.muted=false}catch{}armed=true;readyBtn.style.display='none';waitMsg.textContent='📺 Telão conectado ✓ · áudio preparado. Aguardando o Mestre.';try{await patchOpening({status:'ready',command:'idle',error:''})}catch(e){armed=false;readyBtn.style.display='inline-block';waitMsg.textContent='Não foi possível registrar o Telão na sala.'}};async function startOpening(token){if(!armed){await patchOpening({status:'error',error:'audio-not-armed',failedToken:token});return}activeToken=token;stage.classList.add('on');audio.currentTime=0;try{await audio.play();await patchOpening({status:'playing',command:'playing',token,error:''})}catch{stage.classList.remove('on');readyBtn.style.display='inline-block';waitMsg.textContent='🔊 Toque novamente para preparar o áudio.';armed=false;await patchOpening({status:'error',command:'idle',error:'audio-play-failed',failedToken:token})}}async function finishOpening(){audio.pause();stage.classList.remove('on');await patchOpening({status:'finished',command:'idle',finishedToken:activeToken,error:''});render()}openPause.onclick=async()=>{if(audio.paused){await audio.play();openPause.textContent='⏸ Pausar'}else{audio.pause();openPause.textContent='▶ Continuar'}};openRestart.onclick=async()=>{audio.currentTime=0;await audio.play();openPause.textContent='⏸ Pausar'};openSkip.onclick=finishOpening;audio.onended=()=>setTimeout(finishOpening,900);function consume(d){const o=d?.opening||{},token=Number(o.token||0);if(o.command==='start'&&token&&token!==lastToken){lastToken=token;startOpening(token)}}function render(){if(!room?.publicState?.questionText)return;const pub=room.publicState,fs=pub.fields||[],ps=pub.players?.length?pub.players:players;root.className='wrap';root.innerHTML=`<section class="top"><div class="brand"><b>MOSAICO</b><span>A Noite · A Manhã do Carro-Forte</span></div>${pub.turnName?`<div class="turn"><small>VEZ</small><b>${esc(pub.turnName)}</b><strong>${esc(pub.timer||'00:00')}</strong></div>`:''}</section><section class="question"><small>${esc(pub.questionTitle||'PERGUNTA')}</small><h1>${esc(pub.questionText)}</h1></section>${fs.length?`<section class="fields">${fs.map(f=>`<article class="field"><b>${esc(f.label)}</b><span>${f.closed?'FECHADO · '+esc(f.closedBy||'—'):'EM ABERTO'}</span></article>`).join('')}</section>`:''}<section class="players"><h2>Jogadores conectados</h2><div class="grid">${ps.map(x=>`<article class="player"><b>${esc(x.name||x.nome||'Jogador')}</b><span>${x.fragments??x.fragmentos??null?esc(x.fragments??x.fragmentos)+' fragmentos · ':''}${esc(x.state||'na mesa')}</span></article>`).join('')}</div></section>`}if(code&&roomRef){onSnapshot(roomRef,s=>{room=s.exists()?s.data():null;if(room){consume(room);render()}});onSnapshot(collection(db,'noite',code,'jogadores'),s=>{players=s.docs.map(d=>d.data()).map(x=>({name:x.nome,fragments:x.fragmentos||0,state:'conectado'}));render()});connect()}else{waitMsg.textContent='Código da sala ausente.'}</script></body></html>
