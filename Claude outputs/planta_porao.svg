<svg xmlns="http://www.w3.org/2000/svg" width="840" height="970" viewBox="0 0 840 970" font-family="Georgia,serif">
<rect width="100%" height="100%" fill="#f6efdc"/>
<text x="20" y="28" font-size="22" fill="#3a2a18">Casa da Costa · PROPOSTA de planta do porão</text>
<rect x="84" y="614" width="224" height="154" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4" opacity="1"/><rect x="308" y="614" width="112" height="238" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4" opacity="1"/><rect x="420" y="614" width="168" height="154" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4" opacity="1"/><rect x="588" y="516" width="168" height="252" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4" opacity="1"/><rect x="84" y="194" width="224" height="420" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4" opacity="1"/><rect x="588" y="194" width="168" height="322" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4" opacity="1"/><rect x="308" y="194" width="280" height="378" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="4 4" opacity="1"/><text x="448" y="408" font-size="12" fill="#999" text-anchor="middle" font-style="italic">(sem porão sob o resto da casa)</text><rect x="308" y="82" width="406" height="112" fill="#e2d6bc" stroke="#3a2a18" stroke-width="2" opacity="1"/><text x="504" y="109" font-size="15" fill="#3a2a18" text-anchor="middle" font-weight="700">PORÃO</text><rect x="437" y="146" width="34" height="34" fill="#c9b48a" stroke="#3a2a18" stroke-width="2" opacity="1"/><text x="454" y="133" font-size="9" fill="#3a2a18" text-anchor="middle">escadinha ↑ despensa</text><text x="454" y="144" font-size="9" fill="#3a2a18" text-anchor="middle">(range nos dois sentidos)</text><circle cx="350" cy="163" r="11" fill="#1d4e89"/><text x="350" y="168" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">K</text><text x="386" y="167" font-size="10" fill="#3a2a18" text-anchor="start">quadro de luz geral</text><text x="574" y="144" font-size="10" fill="#3a2a18" text-anchor="middle">adega (garrafas · as três do Porto)</text><text x="658" y="178" font-size="10" fill="#3a2a18" text-anchor="middle">pipas · caixotes</text><text x="504" y="223" font-size="11" fill="#b5482a" text-anchor="middle" font-weight="700">uma só entrada · sem túnel · sem ligação com a passagem, a sala do relógio ou o lado de fora</text>
<text x="20" y="940" font-size="13" fill="#6b5234">O porão fica só sob a ala norte. Uma única entrada (a escadinha da despensa). O túnel antigo até a guarita sai.</text>
<g transform="translate(770,80)"><path d="M0 30 L10 0 L20 30 L10 22Z" fill="#3a2a18"/><text x="4" y="48" font-size="14">N</text></g>
